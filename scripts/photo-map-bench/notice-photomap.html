<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:410px;background:#0c1220;font-family:Pretendard,sans-serif;color:#fff}
.w{padding:22px 22px 18px;background:radial-gradient(120% 60% at 50% 0%,#1d2b45 0%,#0c1220 70%)}
.e{font:700 10px/1 "Space Grotesk";letter-spacing:.22em;color:#f5b041}
.e b{background:#f5b041;color:#0c1220;padding:3px 6px 2px;border-radius:4px;margin-right:8px;letter-spacing:.12em}
h1{font-family:"Noto Serif KR";font-weight:900;font-size:25px;line-height:1.3;margin-top:12px;letter-spacing:-.01em}
h1 em{font-style:normal;color:#8fe0b5}
.r{width:28px;height:2px;background:#f5b041;margin:13px 0 15px}
.card{position:relative;width:316px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.card img{display:block;width:100%}
.tag{position:absolute;right:10px;top:10px;background:#151b23;color:#fff;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;gap:5px;align-items:center}
.steps{margin-top:16px;display:grid;gap:10px}
.s{display:flex;gap:12px;align-items:flex-start}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(143,224,181,.14);color:#8fe0b5;font:700 12px/24px "Space Grotesk";text-align:center}
.s p{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.s p b{color:#fff}
.chip{display:inline-block;background:rgba(255,255,255,.12);border-radius:6px;padding:0 6px;font-weight:700;color:#fff}
</style></head><body><div class="w">
<div class="e"><b>NEW</b>ROMANTIC ROUTE · PHOTO MAP</div>
<h1>내가 다녀온 박지가<br><em>사진 지도</em>가 돼요</h1>
<div class="r"></div>
<div class="card"><img src="card.jpg"></div>
<div class="steps">
<div class="s"><div class="n">1</div><p>지도 아래 <span class="chip">사진지도</span>를 누르면<br>전국이 박지 사진으로 채워져요</p></div>
<div class="s"><div class="n">2</div><p><span class="chip">내 지도</span>에선 피드를 올리거나 <b>다녀옴</b>을 누른<br>박지가 하나씩 내 사진으로 채워져요</p></div>
<div class="s"><div class="n">3</div><p><span class="chip">한눈에 보기</span>로 한 장에 담아<br>저장하고 인스타·카톡에 자랑해요</p></div>
</div>
</div></body></html>
