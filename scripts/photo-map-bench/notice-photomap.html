<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:410px;background:#000;font-family:Pretendard,sans-serif;color:#fff}
.w{padding:22px 22px 18px;background:#000}
.e{font:700 10px/1 "Space Grotesk";letter-spacing:.22em;color:#f5b041}
.e b{background:#f5b041;color:#0c1220;padding:3px 6px 2px;border-radius:4px;margin-right:8px;letter-spacing:.12em}
h1{font-family:"Noto Serif KR",serif;font-weight:600;font-size:20px;line-height:1.45;margin-top:12px;letter-spacing:-.01em}
h1 em{font-style:normal;color:#8fe0b5}
.r{width:28px;height:2px;background:#f5b041;margin:13px 0 15px}
.card{position:relative;width:316px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.card img{display:block;width:100%}
/* 카드 속 숫자(431 SPOTS)를 지금 화면과 같은 '채워진 / 전체'로 덮는다 */
.num{position:absolute;left:9px;top:49px;width:84px;height:27px;background:#aad3ea}
.num span{position:absolute;left:2px;bottom:3px;font:700 23.7px/1 "Space Grotesk";color:#1d2320;letter-spacing:-.02em;white-space:nowrap}
.num small{font:500 10.3px/1 "Space Grotesk";color:#2f5d48;margin-left:3px;letter-spacing:0}
.stat{margin:16px 0 4px;font-size:14px;color:rgba(255,255,255,.75)}
.stat b{font:700 17px "Space Grotesk";color:#8fe0b5}
.steps{margin-top:12px;display:grid;gap:10px}
.s{display:flex;gap:12px;align-items:flex-start}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(143,224,181,.14);color:#8fe0b5;font:700 12px/24px "Space Grotesk";text-align:center}
.s p{font-size:13.5px;line-height:1.45;color:rgba(255,255,255,.88)}
.chip{display:inline-block;background:rgba(255,255,255,.12);border-radius:6px;padding:0 6px;font-weight:700;color:#fff}
</style></head><body><div class="w">
<div class="e"><b>NEW</b>ROMANTIC ROUTE · PHOTO MAP</div>
<h1>한 칸씩 채워 가는<br><em>나의 백패킹 포토맵</em></h1>
<div class="r"></div>
<div class="card"><img src="card.jpg"></div>
<p class="stat">전국 <b>130</b>개 시·군 중 <b>66</b>곳이 사진으로 채워졌어요</p>
<div class="steps">
<div class="s"><div class="n">1</div><p>다녀온 백패킹에 <span class="chip">피드</span>를 올리면<br>빈 칸이 내 사진으로 채워져요</p></div>
<div class="s"><div class="n">2</div><p><span class="chip">내 지도</span>엔 다녀온 곳만 모여<br>나만의 포토맵이 돼요</p></div>
<div class="s"><div class="n">3</div><p><span class="chip">한눈에 보기</span>로 한 장에 담아 공유해요</p></div>
</div>
</div></body></html>
