      <span class="okbm-splash-type-sizer" aria-hidden="true">낭만을 찾는 방법</span>

<script>
(function initOkbmSplashIntro() {
  var SPLASH_SHOWN_KEY = 'splash_shown';
  var overlay = document.getElementById('okbmSplashOverlay');
  var typeEl = document.getElementById('okbmSplashTypeText');
  var innerEl = overlay ? overlay.querySelector('.okbm-splash-inner') : null;

  function readSplashShown() {
    if (window.__okbmSplashAlreadyShown === true) return true;
    try {
      if (sessionStorage.getItem('okbm_skip_splash_once') === '1') {
        sessionStorage.removeItem('okbm_skip_splash_once');
        return true;
      }
    } catch (e) {}
    try {
      var ref = String(document.referrer || '');
      if (!ref) return false;
      if (/kakao\.com|kauth\.kakao/i.test(ref)) return true;
      if (new URL(ref, location.href).host === location.host) return true;
    } catch (e) {}
    return false;
  }

  function markSplashShown() {
    window.__okbmSplashAlreadyShown = true;
    try { sessionStorage.setItem(SPLASH_SHOWN_KEY, 'true'); } catch (e) {}
    try { localStorage.removeItem('okbm_splash_shown'); } catch (e) {}
  }

  function hideSplashOverlayNow() {
    document.documentElement.classList.remove('okbm-splash-active');
    document.documentElement.classList.add('okbm-splash-skipped');
    if (!overlay) return;
    overlay.style.setProperty('display', 'none', 'important');
    overlay.setAttribute('aria-busy', 'false');
    overlay.setAttribute('aria-hidden', 'true');
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  }

  if (!overlay || readSplashShown() || window.__okbmSplashSkipForDirectTab) {
    hideSplashOverlayNow();
    if (window.__okbmSplashSkipForDirectTab) markSplashShown();
    window.__okbmNotifyHeroReady = window.__okbmNotifyHeroReady || function() {};
    window.__okbmNotifySpotsReady = window.__okbmNotifySpotsReady || function() {};
    return;
  }

  var SLOGAN = '낭만을 찾는 방법';
  var TYPE_STEP_MS = 86;
  var TYPE_SPACE_MS = 136;
  // 슬로건 '낭만'까지 타이핑된 뒤 로고 등장
  var LOGO_TRIGGER_AT = 2;
  var LOGO_IN_MS = 2000;
  var HOLD_MS = 200;
  var FADE_MS = 720;
  var HARD_TIMEOUT_MS = 6600;
  var DATA_CAP_MS = 2200;
  var dismissed = false;
  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {}

  var heroReadyResolve;
  window.__okbmHeroBootReady = new Promise(function(resolve) {
    heroReadyResolve = resolve;
  });
  window.__okbmNotifyHeroReady = function() {
    if (heroReadyResolve) {
      heroReadyResolve();
      heroReadyResolve = null;
    }
  };

  var spotsReadyResolve;
  window.__okbmSpotsBootReady = new Promise(function(resolve) {
    spotsReadyResolve = resolve;
  });
  window.__okbmNotifySpotsReady = function() {
    if (spotsReadyResolve) {
      spotsReadyResolve();
      spotsReadyResolve = null;
    }
  };

  function delay(ms) {
    return new Promise(function(resolve) { setTimeout(resolve, ms); });
  }

  function preloadImage(src) {
    return new Promise(function(resolve) {
      if (!src) return resolve();
      var img = new Image();
      img.onload = function() { resolve(src); };
      img.onerror = function() { resolve(src); };
      img.src = src;
    });
  }

  function uniqueUrls(list) {
    var seen = {};
    var out = [];
    (list || []).forEach(function(src) {
      if (!src || seen[src]) return;
      seen[src] = true;
      out.push(src);
    });
    return out;
  }

  function collectCachedHeroPhotos() {
    var urls = [];
    try {
      var feeds = JSON.parse(localStorage.getItem('okbm_cached_community_feeds') || '[]');
      if (!Array.isArray(feeds)) return urls;
      for (var i = 0; i < feeds.length && urls.length < 4; i++) {
        var photos = feeds[i] && feeds[i].photos;
        if (!Array.isArray(photos)) continue;
        for (var j = 0; j < photos.length && urls.length < 4; j++) {
          if (typeof photos[j] === 'string' && photos[j].indexOf('https://') === 0) {
            urls.push(photos[j]);
          }
        }
      }
    } catch (e) {}
    return urls;
  }

  function collectLiveHeroPhotos() {
    var urls = [];
    var records = window.heroTopRecords || [];
    for (var i = 0; i < records.length && urls.length < 4; i++) {
      var photos = records[i] && records[i].photos;
      if (!Array.isArray(photos)) continue;
      if (typeof photos[0] === 'string' && photos[0].indexOf('https://') === 0) {
        urls.push(photos[0]);
      }
    }
    return urls;
  }

  function waitSplashFont() {
    try {
      if (!document.fonts || typeof document.fonts.load !== 'function') {
        return Promise.resolve();
      }
      return Promise.race([
        document.fonts.load("600 18px 'OKBM Splash Serif'", SLOGAN).then(function() {
          return document.fonts.ready;
        }),
        delay(900)
      ]);
    } catch (e) {
      return Promise.resolve();
    }
  }

  function playIntro() {
    if (reduceMotion) {
      if (typeEl) typeEl.textContent = SLOGAN;
      if (innerEl) innerEl.classList.add('is-logo-in');
      return delay(400);
    }
    return waitSplashFont().then(function() {
      return new Promise(function(resolve) {
        var typeDone = false;
        var logoDone = false;
        var logoStarted = false;
        var typeTimer = null;
        function maybeDone() {
          if (typeDone && logoDone) resolve();
        }
        function startLogo() {
          if (logoStarted) return;
          logoStarted = true;
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              if (innerEl) innerEl.classList.add('is-logo-in');
            });
          });
          setTimeout(function() {
            logoDone = true;
            maybeDone();
          }, LOGO_IN_MS);
        }
        if (!typeEl) {
          startLogo();
          typeDone = true;
          return;
        }
        var i = 0;
        var startedAt = performance.now();
        var nextAt = startedAt;
        function scheduleTick() {
          if (i >= SLOGAN.length) {
            typeDone = true;
            maybeDone();
            return;
          }
          var ch = SLOGAN.charAt(i);
          typeEl.textContent += ch;
          i += 1;
          if (i === LOGO_TRIGGER_AT) startLogo();
          var step = (ch === ' ') ? TYPE_SPACE_MS : TYPE_STEP_MS;
          nextAt += step;
          var wait = Math.max(0, nextAt - performance.now());
          typeTimer = setTimeout(scheduleTick, wait);
        }
        scheduleTick();
      });
    });
  }

  function waitCoreData() {
    var hero = window.__okbmHeroBootReady || Promise.resolve();
    var spots = window.__okbmSpotsBootReady || Promise.resolve();
    var cachedFeeds = false;
    var cachedSpots = false;
    try {
      var feeds = JSON.parse(localStorage.getItem('okbm_cached_community_feeds') || '[]');
      cachedFeeds = Array.isArray(feeds) && feeds.length > 0;
    } catch (e) {}
    try {
      var spotsCache = JSON.parse(localStorage.getItem('okbm_spots_cache') || localStorage.getItem('okbm_master_spots') || '[]');
      cachedSpots = Array.isArray(spotsCache) && spotsCache.length > 0;
    } catch (e) {}
    if (cachedFeeds) window.__okbmNotifyHeroReady();
    if (cachedSpots) window.__okbmNotifySpotsReady();
    return Promise.race([
      Promise.all([hero, spots]),
      delay(DATA_CAP_MS)
    ]);
  }

  function warmAppPages() {
    if (typeof window.okbmEnsurePlan === 'function') {
      window.okbmEnsurePlan().catch(function() {});
    }
    if (typeof window.okbmEnsureKakaoSdk === 'function') {
      window.okbmEnsureKakaoSdk().catch(function() {});
    }
  }

  function dismissSplash() {
    if (dismissed) return;
    dismissed = true;
    markSplashShown();
    document.documentElement.classList.add('okbm-splash-reveal');
    overlay.classList.add('is-leaving');
    overlay.setAttribute('aria-busy', 'false');
    overlay.setAttribute('aria-hidden', 'true');
    setTimeout(function() {
      if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      document.documentElement.classList.remove('okbm-splash-active');
      document.documentElement.classList.remove('okbm-splash-reveal');
      document.documentElement.classList.add('okbm-splash-skipped');
    }, FADE_MS + 40);
  }

  // fulllogoblk.png는 공유(OG) 전용이라 스플래시에서 미리 받지 않는다.
  var localAssets = [
    'logo.png',
    'fulllogo.png',
    'icons/tent.svg',
    'icons/backpack.svg',
    'icons/sleeping-bag.svg',
    'icons/mat.svg',
    'icons/cooking.svg',
    'icons/clothing.svg',
    'icons/food.svg',
    'icons/other.svg',
    'icons/romantic-route-gear-icons.svg'
  ];
  var heroAssets = uniqueUrls(collectCachedHeroPhotos());

  warmAppPages();

  var preloadBoot = Promise.all([
    Promise.all(localAssets.map(preloadImage)),
    waitCoreData(),
    heroAssets.length ? Promise.race([Promise.all(heroAssets.map(preloadImage)), delay(900)]) : Promise.resolve()
  ]).then(function() {
    var livePhotos = uniqueUrls(collectLiveHeroPhotos());
    if (!livePhotos.length) return;
    return Promise.race([
      Promise.all(livePhotos.map(preloadImage)),
      delay(400)
    ]);
  });

  Promise.all([playIntro(), preloadBoot])
    .then(function() { return delay(HOLD_MS); })
    .then(dismissSplash)
    .catch(dismissSplash);

  setTimeout(dismissSplash, HARD_TIMEOUT_MS);
})();
</script>

  <script>

    window.modalCloseStack = window.modalCloseStack || [];

    window.registerModalOpen = function(modalId, closeFn) {
      window.modalCloseStack = window.modalCloseStack.filter(function(m) { return m.id !== modalId; });
      window.modalCloseStack.push({ id: modalId, close: closeFn });
    };

    window.unregisterModalClose = function(modalId) {
      window.modalCloseStack = window.modalCloseStack.filter(function(m) { return m.id !== modalId; });
    };

    window.closeTopmostModal = function() {
      if (typeof window.tryCloseTopmostModal === 'function') {
        return window.tryCloseTopmostModal();
      }
      if (window.modalCloseStack && window.modalCloseStack.length > 0) {
        var top = window.modalCloseStack.pop();
        if (top && typeof top.close === 'function') {
          top.close();
          return true;
        }
      }
      return false;
    };

    (function initEdgeSwipeDismiss() {
      var touchStartX = 0, touchStartY = 0, isEdgeTracking = false;

      document.addEventListener('touchstart', function(e) {
        if (!window.modalCloseStack || window.modalCloseStack.length === 0) return;
        if (!e.touches || e.touches.length !== 1) return;
        var x = e.touches[0].clientX;
        if (x <= 30) {
          touchStartX = x;
          touchStartY = e.touches[0].clientY;
          isEdgeTracking = true;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!isEdgeTracking || !e.touches || e.touches.length !== 1) return;
        var diffX = e.touches[0].clientX - touchStartX;
        var diffY = Math.abs(e.touches[0].clientY - touchStartY);
        if (diffX > 60 && diffX > diffY * 1.5) {
          isEdgeTracking = false;
          window.closeTopmostModal();
        }
      }, { passive: true });

      document.addEventListener('touchend', function() { isEdgeTracking = false; }, { passive: true });
      document.addEventListener('touchcancel', function() { isEdgeTracking = false; }, { passive: true });
    })();

    (function initGlobalSmartKeyboardGuard() {
      var _activeScrollParent = null;
      var _origPaddingBottom = '';

      var findScrollableParent = function(el) {
        var current = el ? el.parentElement : null;
        while (current && current !== document.body && current !== document.documentElement) {
          var overflowY = window.getComputedStyle(current).overflowY;
          if (overflowY === 'auto' || overflowY === 'scroll' || current.classList.contains('modal-scroll-body')) {
            return current;
          }
          current = current.parentElement;
        }
        return null;
      };

      document.addEventListener('focusin', function(e) {
        var target = e.target;
        if (!target) return;
        var tag = target.tagName ? target.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'textarea' && !target.isContentEditable) return;

        var scrollParent = findScrollableParent(target);
        if (scrollParent) {
          _activeScrollParent = scrollParent;
          _origPaddingBottom = scrollParent.style.paddingBottom || '';
          scrollParent.style.paddingBottom = '320px';
        }

        setTimeout(function() {
          if (target && typeof target.scrollIntoView === 'function') {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 280);
      }, true);

      document.addEventListener('focusout', function(e) {
        var target = e.target;
        if (!target) return;
        var tag = target.tagName ? target.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'textarea' && !target.isContentEditable) return;

        setTimeout(function() {
          if (_activeScrollParent) {
            _activeScrollParent.style.paddingBottom = _origPaddingBottom;
            _activeScrollParent = null;
          }
        }, 150);
      }, true);
    })();

    window.addEventListener('contextmenu', function(e) {
      var target = e.target;
      if (target) {
        var tag = target.tagName ? target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || target.isContentEditable) {
          return;
        }
      }
      e.preventDefault();
    }, { capture: true });

    window.addEventListener('popstate', function() {
      if (window.__okbmHandlingHardwareBack) return;
      if (typeof window.tryCloseTopmostModal === 'function') {
        window.tryCloseTopmostModal();
      } else if (window.modalCloseStack && window.modalCloseStack.length > 0) {
        window.closeTopmostModal();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var wrapModal = function(openName, closeName, modalId) {
        var origOpen = window[openName];
        var origClose = window[closeName];
        if (typeof origOpen === 'function' && !origOpen.__okbmLazy && !origOpen.__okbmWrapped) {
          var wrappedOpen = function() {
            if (openName === 'openPlanModal' && typeof window.okbmMountPlanModalShell === 'function') {
              window.okbmMountPlanModalShell();
            }
            if (openName === 'openPlanModal' || openName === 'openHistoryModal') {
              if (typeof window.closeAllTripModals === 'function') {
                window.closeAllTripModals();
              }
            }
            var res = origOpen.apply(this, arguments);
            window.registerModalOpen(modalId, origClose);
            return res;
          };
          wrappedOpen.__okbmWrapped = true;
          window[openName] = wrappedOpen;
        }
        if (typeof origClose === 'function' && !origClose.__okbmLazy && !origClose.__okbmWrapped) {
          var wrappedClose = function() {
            window.unregisterModalClose(modalId);
            return origClose.apply(this, arguments);
          };
          wrappedClose.__okbmWrapped = true;
          window[closeName] = wrappedClose;
        }
      };
      window.__okbmWrapKnownModals = function() {
        wrapModal('openPlanModal', 'closePlanModal', 'romanticPlanModal');
        wrapModal('openHistoryModal', 'closeHistoryModal', 'romanticHistoryModal');
        wrapModal('openUserProfileModal', 'closeUserProfileModal', 'userProfileModalOverlay');
        wrapModal('openLoginModal', 'closeLoginModal', 'loginModalOverlay');
        wrapModal('openGearPresetModal', 'closeGearPresetModal', 'gearPresetModal');
        wrapModal('openPackShareModal', 'closePackShareModal', 'packShareModalOverlay');
        wrapModal('openPhotoStudio', 'closePhotoStudio', 'photoStudioOverlay');
        wrapModal('openVideoDetailModal', 'closeVideoDetailModal', 'videoDetailModal');
        wrapModal('openThemeSpotAllModal', 'closeThemeSpotAllModal', 'themeSpotAllModal');
      };

      document.addEventListener('click', function(e) {
        var dockItem = e.target.closest('#romanticMasterBottomDock .dock-item');
        if (dockItem) {
          var title = dockItem.getAttribute('title') || '';
          if (title.includes('플랜') || title.includes('보관함') || title.includes('루트') || title.includes('루터') || title.includes('홈') || title.includes('리포트')) {

              try { window.closePastTripRegisterModal({ silent: true }); } catch (err) {}
            }
          }
        }
      });

      window.__okbmWrapKnownModals();
