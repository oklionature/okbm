<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>대한민국 낭만 백패킹 로드</title>
  
  <!-- Naver Maps Open API -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=nokunumn03&submodules=geocoder"></script>
  <!-- CSV Parser (Google Sheet 연동용) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- 낭만적인 감성 폰트 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Alex+Brush&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 68px;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
      user-select: none;
    }
    .header-left { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
    
    /* ⭐ 50% 확대 + 태극기/산 이모티콘 + 프리미엄 메탈릭 골드 그라데이션 타이틀 */
    .header-title-box {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .main-title {
      font-family: 'Gowun Batang', serif;
      font-size: 1.85rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 25%, #fef08a 65%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.8px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
    }
    .main-title .flag-icon, .main-title .mountain-icon {
      -webkit-text-fill-color: initial; /* 이모티콘 고유 색상 유지 */
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .sub-en-title {
      font-family: 'Alex Brush', cursive;
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(135deg, #34d399 10%, #38bdf8 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.2px;
      white-space: nowrap;
      margin-left: 2px;
      filter: drop-shadow(0 1px 3px rgba(56, 189, 248, 0.3));
    }
    
    .sync-status-badge {
      background: #0284c7;
      color: #ffffff;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.4s ease;
    }
    .admin-status-badge {
      display: none;
      background: #0f766e;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: #334155;
      border: 1px solid #64748b;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .header-btn:hover { background: #475569; }
    .header-btn.active {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
    }

    /* 관리자 모드 전용 버튼 */
    .admin-only-btn {
      display: none;
      background: #0f766e;
      border-color: #0d9488;
    }
    .admin-only-btn:hover { background: #115e59; }

    .search-container { position: relative; display: flex; align-items: center; width: 280px; }
    .search-input {
      width: 100%;
      padding: 8px 38px 8px 14px;
      border-radius: 20px;
      border: 1px solid #475569;
      background: #334155;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus { border-color: #0f766e; background: #1e293b; }
    .search-btn-icon {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .search-dropdown {
      position: absolute;
      top: 44px;
      left: 0; right: 0;
      background: #ffffff;
      color: #0f172a;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      list-style: none;
      max-height: 340px;
      overflow-y: auto;
      display: none;
      z-index: 2000;
      border: 1px solid #cbd5e1;
    }
    .dropdown-header {
      padding: 9px 12px;
      background-color: #f8fafc;
      font-size: 0.76rem;
      font-weight: bold;
      color: #0f766e;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-item {
      padding: 11px 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .dropdown-item:hover { background: #f8fafc; }
    .dropdown-info { flex: 1; padding-right: 8px; }
    
    .top-rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .top-rank-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rank-badge {
      display: inline-block;
      width: 20px;
      height: 20px;
      line-height: 20px;
      text-align: center;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 800;
    }
    .rank-1 { background: #fef08a; color: #854d0e; border: 1px solid #fde047; }
    .rank-2 { background: #e2e8f0; color: #334155; }
    .rank-3 { background: #fed7aa; color: #9a3412; }
    .rank-etc { background: #f1f5f9; color: #64748b; }
    .top-spot-title { font-weight: 700; color: #0f766e; font-size: 0.88rem; }
    .top-spot-city { font-size: 0.76rem; color: #0284c7; font-weight: 600; background: #e0f2fe; padding: 2px 6px; border-radius: 4px; }
    .top-spot-views { font-size: 0.72rem; color: #94a3b8; font-weight: 500; }

    .btn-quick-add {
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .btn-quick-add:hover { background: #115e59; }

    .container {
      display: flex;
      width: 100%;
      height: calc(100% - 68px);
      margin-top: 68px;
      position: relative;
    }
    
    .sidebar {
      width: 390px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 500;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.92rem;
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sheet-edit-link {
      display: none;
      align-items: center;
      gap: 4px;
      background: #107c41;
      color: #ffffff;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    .sheet-edit-link:hover { background: #0c6133; }

    .admin-data-tools {
      display: none;
      padding: 8px 12px;
      background: #f1f5f9;
      border-bottom: 1px solid #cbd5e1;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .admin-tool-btn {
      flex: 1;
      min-width: 80px;
      padding: 5px 8px;
      font-size: 0.76rem;
      font-weight: 700;
      border-radius: 4px;
      border: 1px solid #94a3b8;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      text-align: center;
    }
    .admin-tool-btn:hover { background: #e2e8f0; }
    .admin-tool-btn.btn-ai-highlight {
      background: #0f766e;
      color: #ffffff;
      border-color: #0d9488;
    }
    .admin-tool-btn.btn-ai-highlight:hover { background: #115e59; }

    /* 2단 필터바 */
    .filter-wrapper {
      background: #f8fafc;
      border-bottom: 1.5px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px 12px 14px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .region-filter-bar, .terrain-filter-bar {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      align-items: center;
      padding-bottom: 5px;
      -webkit-overflow-scrolling: touch;
    }
    
    .region-filter-bar::-webkit-scrollbar, .terrain-filter-bar::-webkit-scrollbar {
      height: 6px;
    }
    .region-filter-bar::-webkit-scrollbar-track, .terrain-filter-bar::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 4px;
    }
    .region-filter-bar::-webkit-scrollbar-thumb {
      background: #0f766e;
      border-radius: 4px;
    }
    .terrain-filter-bar::-webkit-scrollbar-thumb {
      background: #0284c7;
      border-radius: 4px;
    }
    
    .filter-label {
      font-size: 0.74rem;
      font-weight: 800;
      color: #475569;
      white-space: nowrap;
      margin-right: 4px;
      background: #e2e8f0;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .filter-btn {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
    }
    .filter-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .filter-btn.active {
      background: #0f766e;
      color: #ffffff;
      border-color: #0f766e;
      box-shadow: 0 2px 4px rgba(15, 118, 110, 0.3);
    }
    .terrain-filter-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 4px rgba(2, 132, 199, 0.3);
    }

    /* 목록 영역 */
    .spot-list { 
      flex: 1; 
      overflow-y: auto; 
      list-style: none; 
      position: relative;
    }
    
    .region-group { border-bottom: 1px solid #e2e8f0; }
    .region-group-title {
      padding: 11px 16px;
      background-color: #f8fafc;
      font-size: 0.84rem;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .region-group-title:hover { background-color: #f1f5f9; border-left-color: #0f766e; }

    /* 목록 카드 스타일 */
    .spot-item {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #ffffff;
    }
    .spot-item:hover { background-color: #f8fafc; }
    .spot-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-right: 65px;
    }
    .spot-name-wrapper {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .spot-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f766e;
      word-break: keep-all;
    }
    
    /* NEW! 및 HOT!! 배지 */
    .badge-status {
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      line-height: 1.2;
    }
    .badge-new {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(16, 185, 129, 0.4);
      animation: pulseNew 1.8s infinite;
    }
    .badge-hot {
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(239, 68, 68, 0.4);
    }
    @keyframes pulseNew {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .spot-meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }
    .meta-tag {
      font-size: 0.68rem;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .tag-terrain-deck { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .tag-terrain-rock { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .tag-terrain-soil { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .tag-terrain-island { background: #ccfbf1; color: #0f766e; border: 1px solid #99f6e4; }
    .tag-terrain-valley { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .tag-terrain-cave { background: #f5d0fe; color: #86198f; border: 1px solid #f0abfc; }
    .tag-terrain-etc { background: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
    
    .tag-diff { 
      background: #1e293b; 
      color: #facc15; 
      border: 1px solid #0f172a; 
      letter-spacing: 0.3px;
    }
    .tag-dist {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .tag-rating {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      font-weight: 800;
    }

    .spot-desc-single {
      font-size: 0.74rem;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      line-height: 1.3;
    }

    .spot-coords-text {
      font-size: 0.68rem;
      color: #64748b;
      background: #f8fafc;
      padding: 1px 4px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      width: fit-content;
    }
    
    /* ⭐ 유튜브 / 블로그 / 인스타그램 등록자 / 드론배지 한 줄 정렬 */
    .spot-action-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #ffffff !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      transition: all 0.15s ease;
      cursor: pointer;
      line-height: 1.3;
      white-space: nowrap;
    }
    .btn-yt { background: #ef4444; }
    .btn-yt:hover { background: #dc2626; }
    .btn-blog { background: #03c75a; }
    .btn-blog:hover { background: #02b14f; }
    
    /* 인스타그램 그라데이션 등록자 배너 */
    .btn-insta { 
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      border: none;
      color: #ffffff !important;
      font-size: 0.64rem;
      padding: 1.5px 6px;
      border-radius: 4px;
      gap: 3px;
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(220, 39, 67, 0.35);
    }
    .btn-insta:hover { 
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-insta svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      fill: #ffffff;
    }
    
    .instant-tooltip-box {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .drone-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 0.66rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .drone-ok { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .drone-warn { background: #fef9c3; color: #a16207; border: 1px solid #fde047; }
    .drone-no { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    .instant-tooltip-box::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 5px;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      border: 1px solid #334155;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity 0.05s ease, transform 0.05s ease;
      z-index: 6000;
      line-height: 1.3;
    }
    .instant-tooltip-box::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 1px);
      left: 14px;
      border-width: 5px 5px 0 5px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.05s ease;
      z-index: 6000;
    }
    .instant-tooltip-box:hover::after,
    .instant-tooltip-box:hover::before {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .spot-action-btns {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 3px;
    }
    .btn-edit {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.68rem;
      cursor: pointer;
      display: none;
      font-weight: 600;
    }
    .btn-del {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.68rem;
      cursor: pointer;
      display: none;
      font-weight: 600;
    }

    #map { flex: 1; height: 100%; position: relative; }
    
    .compact-info-window {
      padding: 8px 10px;
      min-width: 210px;
      max-width: 270px;
      max-height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      line-height: 1.25;
    }
    .compact-title { font-size: 0.86rem; font-weight: 700; color: #0f766e; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    
    .compact-entry-link {
      font-size: 0.72rem;
      color: #0284c7;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      padding: 3px 6px;
      border-radius: 4px;
      width: fit-content;
      word-break: break-all;
      white-space: pre-line;
      line-height: 1.25;
      text-decoration: none;
      display: block;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .compact-entry-link:hover {
      background: #0284c7;
      color: #ffffff !important;
      border-color: #0284c7;
      box-shadow: 0 1px 4px rgba(2, 132, 199, 0.3);
    }

    .compact-desc {
      font-size: 0.74rem;
      color: #334155;
      word-break: keep-all;
      white-space: pre-line;
      line-height: 1.25;
    }

    .btn-save-location {
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 4px;

    function getSpotStatusBadges(spot) {
      let html = '';
      const views = spot.searchCount || parseInt(localStorage.getItem(`okbm_views_${spot.id}`)) || parseInt(localStorage.getItem(`okbm_views_${spot.name}`)) || 0;
      
      if (views >= 5) {
        html += `<span class="badge-status badge-hot">🔥 HOT!!</span>`;
      }
      
      const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
      const now = Date.now();
      let createdTime = spot.createdAt ? parseInt(spot.createdAt) : (newlyAddedSpotMeta[String(spot.id)] || 0);

      if (createdTime > 0 && (now - createdTime) <= THREE_DAYS_MS) {
        html += `<span class="badge-status badge-new">✨ NEW!</span>`;
      }
      
      return html;
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function autoDetectDroneStatus(lat, lng) {
      if (!lat || !lng) return { status: 'ok', reason: '자유 비행 구역 (150m 고도제한 준수 / 촬영 시 원스톱 허가 권장)' };

      for (const park of nationalParks) {
        if (getDistanceMeters(lat, lng, park.lat, park.lng) <= park.radius) {
          return { status: 'no', reason: `[국립공원 비행금지] ${park.name} (자연공원법에 의해 비행·촬영 엄격 금지)` };
        }
      }

      for (const zone of restrictedZones) {
        if (getDistanceMeters(lat, lng, zone.lat, zone.lng) <= zone.radius) {
          if (zone.type === 'border') return { status: 'no', reason: `[휴전선 접경 비행금지] ${zone.name} (군사작전상 민간드론 비행 불가)` };
          if (zone.type === 'p73') return { status: 'no', reason: `[수도권 비행금지공역 P-73] 서울 핵심부 드론 비행 절대 금지` };
          if (zone.type === 'nuke' || zone.type === 'mil_ban') return { status: 'no', reason: `[국가중요시설 비행금지] ${zone.name}` };
          if (zone.type === 'mil') return { status: 'warn', reason: `[군사작전 관제공역] ${zone.name} (드론원스톱 비행 및 촬영 사전승인 필수)` };
          if (zone.type === 'air') return { status: 'warn', reason: `[공항 관제권] ${zone.name} 반경 9.3km (드론원스톱 사전승인 필수)` };
        }
      }

      return { status: 'ok', reason: '자유 비행 구역 (최대고도 150m 이하 비행 가능 / 상업·공개 촬영 시 사전허가 권장)' };
    }

      if (!r) {
        r = (status === 'no') 
          ? '비행금지구역 (휴전선 접경/국립공원/원전 등 비행 불가)' 
          : (status === 'warn') 
          ? '군/공항 관제공역 (드론원스톱 비행 및 촬영 사전승인 필수)' 
          : '자유 비행 구역 (고도 150m 준수 / 촬영 시 원스톱 허가 권장)';
      }
      
      if (status === 'no') {
        return `<div class="instant-tooltip-box" data-tooltip="${r}"><span class="drone-badge drone-no">🚫 드론금지</span></div>`;
      } else if (status === 'warn') {
        return `<div class="instant-tooltip-box" data-tooltip="${r}"><span class="drone-badge drone-warn">⚠️ 승인필요</span></div>`;
      } else {
        return `<div class="instant-tooltip-box" data-tooltip="${r}"><span class="drone-badge drone-ok">🛸 자유비행</span></div>`;
      }
    }

    function detectRegionAndCity(lat, lng, name = '', entryPoint = '') {
      const fullText = (name + ' ' + entryPoint).toLowerCase();
      
      if (fullText.includes('제주') || fullText.includes('서귀포') || fullText.includes('우도') || fullText.includes('가파도') || fullText.includes('마라도') || fullText.includes('비양도') || fullText.includes('추자') || fullText.includes('한라산') || fullText.includes('성산일출봉') || fullText.includes('백약이') || fullText.includes('오름')) {
        let city = fullText.includes('서귀포') ? '제주 서귀포시' : '제주시';
        return { region: '제주', cityName: city };
      }
      if (fullText.includes('서울') || fullText.includes('인천') || fullText.includes('옹진') || fullText.includes('강화') || fullText.includes('굴업도') || fullText.includes('자월도') || fullText.includes('덕적도') || fullText.includes('백령도') || fullText.includes('대청도')) {
        return { region: '서울/인천', cityName: fullText.includes('서울') ? '서울' : '인천 옹진군' };
      }
      if (fullText.includes('경기') || fullText.includes('남양주') || fullText.includes('양평') || fullText.includes('이천') || fullText.includes('장호원') || fullText.includes('용인') || fullText.includes('광주') || fullText.includes('여주') || fullText.includes('가평') || fullText.includes('포천') || fullText.includes('안성') || fullText.includes('평택')) {
        let city = '경기';
        ['남양주시','양평군','이천시','용인시','광주시','여주시','가평군','포천시','안성시','평택시'].forEach(c => { 
          if(fullText.includes(c.slice(0,2))) city = '경기 ' + c; 
        });
        return { region: '경기', cityName: city };
      }
      if (fullText.includes('강원') || fullText.includes('정선') || fullText.includes('평창') || fullText.includes('영월') || fullText.includes('원주') || fullText.includes('춘천') || fullText.includes('홍천') || fullText.includes('강릉') || fullText.includes('인제') || fullText.includes('양구') || fullText.includes('화천') || fullText.includes('철원') || fullText.includes('고성')) {
        let city = '강원';
        ['정선군','홍천군','평창군','영월군','원주시','춘천시','강릉시','인제군','양구군','화천군','철원군','고성군'].forEach(c => {
          if(fullText.includes(c.slice(0,2))) city = '강원 ' + c;
        });
        return { region: '강원', cityName: city };
      }
      if (fullText.includes('충북') || fullText.includes('충남') || fullText.includes('충청') || fullText.includes('충주') || fullText.includes('괴산') || fullText.includes('단양') || fullText.includes('천안') || fullText.includes('청주') || fullText.includes('음성') || fullText.includes('진천')) {
        return { region: '충청', cityName: '충청' };
      }
      if (fullText.includes('경북') || fullText.includes('경남') || fullText.includes('경상') || fullText.includes('문경') || fullText.includes('합천') || fullText.includes('거창') || fullText.includes('울산') || fullText.includes('부산') || fullText.includes('대구') || fullText.includes('울릉도') || fullText.includes('독도')) {
        return { region: '경상', cityName: '경상' };
      }
      if (fullText.includes('전북') || fullText.includes('전남') || fullText.includes('전라') || fullText.includes('신안') || fullText.includes('여수') || fullText.includes('순천') || fullText.includes('해남') || fullText.includes('완도') || fullText.includes('선유도') || fullText.includes('비금도') || fullText.includes('관매도') || fullText.includes('초도')) {
        return { region: '전라', cityName: '전라' };
      }

      if (lat < 34.0) return { region: '제주', cityName: '제주' };
      if (lat >= 36.95 && lat <= 38.3 && lng >= 126.5 && lng <= 127.8) return { region: '경기', cityName: '경기' };
      if (lat >= 37.0 && lng > 127.8) return { region: '강원', cityName: '강원' };
      if (lat >= 35.8 && lat < 37.0 && lng <= 127.9) return { region: '충청', cityName: '충청' };
      if (lat < 36.0 && lng > 127.8) return { region: '경상', cityName: '경상' };
      if (lat < 35.8 && lng <= 127.8) return { region: '전라', cityName: '전라' };
      return { region: '경기', cityName: '경기' };
    }

    function formatKoreanSubAddress(rawSub, lat, lng) {
      if (!rawSub) {
        const auto = detectRegionAndCity(lat, lng);
        return auto.cityName || auto.region;
      }
      if (/[a-zA-Z]/.test(rawSub) && !/[가-힣]/.test(rawSub)) {
        const auto = detectRegionAndCity(lat, lng);
        return auto.cityName || auto.region;
      }
      return rawSub;
    }

    async function getElevation(lat, lng) {
      if (!lat || !lng) return '450m';
      try {
        const res = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`);
        const data = await res.json();
        if (data && data.results && data.results.length > 0) {
          return `${Math.round(data.results[0].elevation)}m`;
        }
      } catch (e) {}
      return '450m';
    }

    async function saveUpdatedLocation(spotId, newLat, newLng) {
      const targetSpot = spots.find(s => String(s.id) === String(spotId));
      if (!targetSpot) {
        alert('해당 박지 정보를 찾을 수 없습니다.');
        return;
      }

      targetSpot.lat = parseFloat(newLat);
      targetSpot.lng = parseFloat(newLng);

      const check = autoDetectDroneStatus(targetSpot.lat, targetSpot.lng);
      targetSpot.droneStatus = check.status;
      const res = detectRegionAndCity(targetSpot.lat, targetSpot.lng, targetSpot.name, targetSpot.entryPoint);
      targetSpot.region = res.region;
      targetSpot.cityName = res.cityName;

      naver.maps.Service.reverseGeocode({
        coords: new naver.maps.LatLng(targetSpot.lat, targetSpot.lng),
        orders: [naver.maps.Service.OrderType.ADDR, naver.maps.Service.OrderType.ROAD_ADDR].join(',')
      }, async function(status, response) {
        if (status === naver.maps.Service.Status.OK && response.v2 && response.v2.address) {
          const autoAddr = response.v2.address.jibunAddress || response.v2.address.roadAddress;
          if (autoAddr) targetSpot.entryPoint = autoAddr;
        }

        infoWindow.close();
        renderSpots(targetSpot.region);

        const payload = JSON.stringify({
          action: 'UPDATE_LOCATION',
          id: targetSpot.id,
          name: targetSpot.name,
          lat: targetSpot.lat,
          lng: targetSpot.lng,
          region: targetSpot.region,
          cityName: targetSpot.cityName,
          droneStatus: targetSpot.droneStatus,
          entryPoint: targetSpot.entryPoint
        });

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });
          alert(`✅ '${targetSpot.name}' 위치가 구글 시트와 웹에 저장되었습니다!\n(위도: ${newLat}, 경도: ${newLng})`);
        } catch (err) {
          console.error('시트 저장 에러:', err);
          alert('구글 시트 전송 중 오류가 발생했습니다: ' + err);
        }
      });
    }

    async function searchCoordsByQuery(query) {
      if (!query || !query.trim()) return null;
      const cleanQ = query.trim();

      const naverResult = await new Promise((resolve) => {
        naver.maps.Service.geocode({ query: cleanQ }, function(status, response) {
          if (status === naver.maps.Service.Status.OK && response.v2.addresses.length > 0) {
            const item = response.v2.addresses[0];
            resolve({ lat: parseFloat(item.y), lng: parseFloat(item.x), title: item.roadAddress || item.jibunAddress });
          } else {
            resolve(null);
          }
        });
      });
      if (naverResult) return naverResult;

      try {
        const pRes = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(cleanQ)}&limit=3&lang=default`);
        const pData = await pRes.json();
        if (pData && pData.features && pData.features.length > 0) {
          const coords = pData.features[0].geometry.coordinates;
          return { lat: coords[1], lng: coords[0], title: pData.features[0].properties.name || cleanQ };
        }
      } catch (e) {}

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanQ)}&countrycodes=kr&limit=3&accept-language=ko,ko-KR`);
        const data = await res.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon), title: data[0].display_name.split(',')[0] };
        }
      } catch (e) {}

      return null;
    }

    async function processBulkImport() {
      const rawText = document.getElementById('bulkImportTextarea').value.trim();
      const statusEl = document.getElementById('bulkStatusMsg');
      const btn = document.getElementById('btnRunBulkImport');

      if (!rawText) return alert('요약 텍스트 또는 JSON을 입력해주세요.');

      btn.disabled = true;
      statusEl.innerText = '⏳ 데이터 분석 중...';

      let itemsToProcess = [];

      try {
        const parsed = JSON.parse(rawText);
        if (Array.isArray(parsed)) itemsToProcess = parsed;
        else if (typeof parsed === 'object') {
          if (Array.isArray(parsed.spots)) itemsToProcess = parsed.spots;
          else itemsToProcess = [parsed];
        }
      } catch (err) {
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (jsonMatch) {
          try { itemsToProcess = [JSON.parse(jsonMatch[0])]; } catch (e) {}
        }
      }

      if (itemsToProcess.length === 0) {
        const parsedData = {};
        rawText.split('\n').forEach(line => {
          const [key, ...vals] = line.split(/[:=]/);
          if (!key || vals.length === 0) return;
          const k = key.trim();
          const v = vals.join(':').trim();
          if (k.includes('이름') || k.includes('산') || k.toLowerCase() === 'name') parsedData.name = v;
          if (k.includes('들머리') || k.includes('주소') || k.toLowerCase() === 'entrypoint') parsedData.entryPoint = v;
          if (k.includes('고도') || k.includes('해발') || k.toLowerCase() === 'elevation') parsedData.elevation = v;
          if (k.includes('특징') || k.includes('설명') || k.toLowerCase() === 'desc') parsedData.desc = v;
          if (k.includes('거리') || k.toLowerCase() === 'distance') parsedData.distance = v;
          if (k.includes('난이도') || k.toLowerCase() === 'difficulty') parsedData.difficulty = v.replace(/[^0-9]/g, '') || '3';
          if (k.includes('유튜브') || k.includes('링크') || k.toLowerCase().includes('youtube')) parsedData.youtubeUrl = v;
          if (k.includes('지형') || k.toLowerCase() === 'terrain') parsedData.terrain = v.split(/[\s,]+/);
        });
        if (parsedData.name) itemsToProcess.push(parsedData);
      }

      if (itemsToProcess.length === 0) {
        btn.disabled = false;
        statusEl.innerText = '';
        return alert('유효한 박지 정보를 찾을 수 없습니다. 이름과 주소를 확인해주세요.');
      }

      let successCount = 0;
      const nowTimestamp = Date.now();

      for (let i = 0; i < itemsToProcess.length; i++) {
        const item = itemsToProcess[i];
        const name = item.name || `박지_${Date.now()}`;
        const entryPoint = item.entryPoint || item.address || name;
        
        statusEl.innerText = `🔍 (${i+1}/${itemsToProcess.length}) '${name}' 위치 좌표 검색 중...`;

        let coords = null;
        if (item.lat && item.lng) {
          coords = { lat: parseFloat(item.lat), lng: parseFloat(item.lng) };
        } else {
          coords = await searchCoordsByQuery(entryPoint);
          if (!coords) coords = await searchCoordsByQuery(name);
        }
        if (!coords) coords = { lat: map.getCenter().lat(), lng: map.getCenter().lng() };

        let elevation = item.elevation || await getElevation(coords.lat, coords.lng);
        const check = autoDetectDroneStatus(coords.lat, coords.lng);
        const res = detectRegionAndCity(coords.lat, coords.lng, name, entryPoint);

        const ytList = item.youtubeUrls || (item.youtubeUrl ? [item.youtubeUrl] : []);
        const newSpotId = item.id ? String(item.id).trim() : String(nowTimestamp + i);

        newlyAddedSpotMeta[newSpotId] = nowTimestamp;
        localStorage.setItem('okbm_new_spot_meta', JSON.stringify(newlyAddedSpotMeta));

        const newSpot = {
          id: newSpotId,
          name: name,
          elevation: elevation,
          entryPoint: entryPoint,
          lat: coords.lat,
          lng: coords.lng,
          region: item.region || res.region,
          cityName: item.cityName || res.cityName,
          desc: item.desc || '추천 백패킹 박지',
          distance: String(item.distance || '').replace(/km/i, '').trim(),
          youtubeUrls: Array.isArray(ytList) ? ytList : [ytList],
          blogUrl: item.blogUrl || '',
          instaId: item.instaId || 'oklionnature',
          terrain: Array.isArray(item.terrain) ? item.terrain : (item.terrain ? [item.terrain] : ['데크']),
          difficulty: String(item.difficulty || '3'),
          droneStatus: item.droneStatus || check.status,
          searchCount: 1,
          createdAt: nowTimestamp
        };

        spots.unshift(newSpot);
        successCount++;

        statusEl.innerText = `☁️ (${i+1}/${itemsToProcess.length}) '${name}' 구글 시트 저장 중...`;
        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'ADD', spot: newSpot })
          });
        } catch (err) {
          console.warn('시트 전송 실패:', err);
        }
      }

      renderSpots();

      if (spots.length > 0) {
        centerMapOnSpot(spots[0].lat, spots[0].lng);
      }

      btn.disabled = false;
      closeBulkImportModal();
      alert(`🎉 총 ${successCount}개의 박지가 등록되었습니다! (3일간 NEW! 표시 활성화)`);
    }

    async function fetchSpotsFromGoogleSheet() {
      const badge = document.getElementById('syncStatusBadge');
      if (badge) {
        badge.style.display = 'inline-block';
        badge.style.opacity = '1';
        badge.style.background = '#0284c7';
        badge.innerText = '⚡ 시트 동기화 중...';
      }

      const csvUrl = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GOOGLE_SHEET_GID}&_t=${Date.now()}`;

      try {
        const response = await fetch(csvUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('시트 응답 없음');
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            const rows = results.data;
            if (rows && rows.length > 0) {
              spots = rows.filter(r => r.name && r.lat && r.lng).map((row, idx) => {
                const lat = parseFloat(row.lat) || 0;
                const lng = parseFloat(row.lng) || 0;
                const rawYt = row.youtubeUrls || row.youtubeUrl || '';
                const ytList = rawYt ? rawYt.split(/[\n,]+/).map(u => u.trim()).filter(u => u) : [];
                
                let terrainList = ['데크'];
                if (row.terrain && String(row.terrain).trim()) {
                  terrainList = String(row.terrain).split(/[\n,]+/).map(t => {
                    let cleanT = t.trim();
                    if (cleanT === '바위') cleanT = '돌박지';
                    return cleanT;
                  }).filter(t => t);
                } else {
                  const combined = (row.name + ' ' + (row.desc || '')).toLowerCase();
                  const autoT = [];
                  if (combined.includes('계곡') || combined.includes('물굽이')) autoT.push('계곡');
                  if (combined.includes('동굴') || combined.includes('굴')) autoT.push('동굴');
                  if (combined.includes('섬') || combined.includes('도') || combined.includes('해변')) autoT.push('섬');
                  if (combined.includes('돌박지') || combined.includes('바위') || combined.includes('암릉')) autoT.push('돌박지');
                  if (combined.includes('노지')) autoT.push('노지');
                  if (combined.includes('데크') || combined.includes('활공장')) autoT.push('데크');
                  if (autoT.length > 0) terrainList = autoT;
                }

                const res = detectRegionAndCity(lat, lng, row.name, row.entryPoint);
                const spotId = row.id ? String(row.id).trim() : String(Date.now() + idx);
                const savedViews = parseInt(localStorage.getItem(`okbm_views_${spotId}`)) || parseInt(localStorage.getItem(`okbm_views_${row.name}`)) || 0;

                const createdAt = row.createdAt ? parseInt(row.createdAt) : (newlyAddedSpotMeta[spotId] || 0);

                return {
                  id: spotId,
                  name: row.name || '무명 박지',
                  elevation: row.elevation || '',
                  entryPoint: row.entryPoint || '들머리 정보 미입력',
                  lat: lat,
                  lng: lng,
                  region: res.region,
                  cityName: res.cityName,
                  desc: row.desc || '',
                  youtubeUrls: ytList,
                  blogUrl: row.blogUrl || '',
                  instaId: row.instaId || 'oklionnature',
                  terrain: terrainList,
                  difficulty: row.difficulty || '3',
                  distance: row.distance || '',
                  droneStatus: row.droneStatus || autoDetectDroneStatus(lat, lng).status,
                  searchCount: savedViews,
                  createdAt: createdAt
                };
              });

              if (badge) {
                badge.style.background = '#15803d';
                badge.innerText = `✅ 시트 연동 완료 (${spots.length}개)`;
              }
            }
            renderSpots();
            setTimeout(() => {
              if (badge) {
                badge.style.opacity = '0';
                setTimeout(() => badge.style.display = 'none', 400);
              }
            }, 2500);
          }
        });
      } catch (error) {
        console.error('시트 동기화 실패:', error);
        if (badge) {
          badge.style.background = '#ef4444';
          badge.innerText = `❌ 시트 로드 실패`;
        }
      }
    }
