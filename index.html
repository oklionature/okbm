<script>
(function inlineHydrateCriticalUI() {
    try {
      var cachedHeroCover = localStorage.getItem('okbm_hero_cover_url');
      if (cachedHeroCover && cachedHeroCover.startsWith('http')) {
        var quickImg = document.getElementById('heroCoverImg');
        if (quickImg) {
          quickImg.src = cachedHeroCover;
          quickImg.style.opacity = '1';
        }
      }

      var token = localStorage.getItem('user_auth_token');
      var rawProfile = localStorage.getItem('user_profile');
      var profile = rawProfile ? JSON.parse(rawProfile) : null;
      var isLogged = !!(token && token.trim().length > 0 && profile && profile.id);

      var headerBtn = document.getElementById('headerAuthBtn');
      var headerText = document.getElementById('headerAuthText');
      var headerIcon = document.getElementById('headerAuthIcon');

      if (isLogged && profile && profile.nickname) {
        if (headerBtn) headerBtn.classList.add('logged-in');
        if (headerText) headerText.innerText = profile.nickname;
        if (headerIcon) {
          headerIcon.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px; height:13px; margin-right:2px; fill:#fde047; color:#fde047; flex-shrink:0; display:inline-block; vertical-align:-1px;"><path d="M12,1 Q12,12 1,12 Q12,12 12,23 Q12,12 23,12 Q12,12 12,23 Q12,12 12,1 Z"/><circle cx="12" cy="12" r="1.5" fill="#ffffff"/></svg>';
        }
      }

      var rawFeeds = localStorage.getItem('okbm_cached_community_feeds');
      var rawPhotosMap = localStorage.getItem('okbm_phone_photos_map');
      var rawStarCounts = localStorage.getItem('okbm_feed_stars_counts');

      var parsedFeeds = rawFeeds ? JSON.parse(rawFeeds) : [];
      var photosMap = rawPhotosMap ? JSON.parse(rawPhotosMap) : {};
      var starCounts = rawStarCounts ? JSON.parse(rawStarCounts) : {};

      // 🌟 [명예의 전당 인라인 수화]: 전국 별점을 가장 많이 받은 1위 피드를 최우선 히어로 후보로 채택
      var candidate = null;
      if (Array.isArray(parsedFeeds) && parsedFeeds.length > 0) {
        var sortedFeeds = parsedFeeds.slice().filter(function(f) { return f && f.isPublished !== false; }).sort(function(a, b) {
          var sA = Number(starCounts[a.id] || a.likes || 0);
          var sB = Number(starCounts[b.id] || b.likes || 0);
          if (sB !== sA) return sB - sA;
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
        candidate = sortedFeeds[0];
      }

      if (!candidate) return;

      var cId = String(candidate.id || '').trim();
      var cleanCId = cId.split(';')[0].trim();
      var cDate = String(candidate.date || '').trim();
      var altDate = cDate.replace(/[-/]/g, '.');

      var photoUrl = '';
      var mappedPhotos = (cleanCId && photosMap[cleanCId]) || (cId && photosMap[cId]) || (cDate && photosMap[cDate]) || (altDate && photosMap[altDate]);

      if (Array.isArray(mappedPhotos) && mappedPhotos.length > 0) {
        photoUrl = mappedPhotos[0];
      } else if (typeof mappedPhotos === 'string' && mappedPhotos.length > 10) {
        photoUrl = mappedPhotos;
      } else if (Array.isArray(candidate.photos) && candidate.photos.length > 0) {
        photoUrl = candidate.photos[0];
      } else if (candidate.photo_url && String(candidate.photo_url).trim().length > 10) {
        photoUrl = candidate.photo_url;
      } else if (candidate.photo) {
        photoUrl = candidate.photo;
      } else if (candidate.fieldPhoto) {
        photoUrl = candidate.fieldPhoto;
      }

      if (photoUrl && typeof photoUrl === 'string') {
        photoUrl = photoUrl.replace(/^["']|["']$/g, '').trim();
        if (photoUrl.includes('drive.google.com')) {
          var idMatch = photoUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/) || photoUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (idMatch && idMatch[1]) {
            photoUrl = 'https://lh3.googleusercontent.com/d/' + idMatch[1] + '=w1200';
          }
        }
      }

      var title = candidate.spot || candidate.spotName || '';
      var memo = candidate.memo || candidate.oneLineMemo || '';
      var author = candidate.author || '낭만백패커';
      var weight = candidate.weightKg ? (candidate.weightKg + 'kg') : '';
      var elev = candidate.elevation ? (String(candidate.elevation).includes('m') ? candidate.elevation : candidate.elevation + 'm') : '';

      if (photoUrl) {
        var img = document.getElementById('heroCoverImg');
        if (img) {
          img.decoding = 'async';
          img.src = photoUrl;
          img.onload = function() { img.style.opacity = '1'; };
          if (img.complete) { img.style.opacity = '1'; }
        }
      }
      if (title) {
        var tEl = document.getElementById('heroMainTitle');
        if (tEl) tEl.innerText = title;
      }
      if (memo) {
        var qEl = document.getElementById('heroQuoteText');
        if (qEl) qEl.innerText = '“' + memo + '”';
      }
      if (author) {
        var aEl = document.getElementById('heroAuthorText');
        if (aEl) aEl.innerText = author;
      }
      if (weight) {
        var wEl = document.getElementById('heroWeightBadge');
        if (wEl) wEl.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px; height:12px;" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 2h12v6H6zM4 8h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/></svg> ' + weight;
      }
      if (elev) {
        var eEl = document.getElementById('heroElevBadge');
        if (eEl) eEl.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px; height:12px;" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg> ' + elev;
      }
    } catch (e) {}
  })();
</script>

    window.smoothNavigate = function(url, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic(10);
      var currentPath = window.location.pathname;
      var targetPath = url.split('?')[0];

      // 동일 페이지 클릭 시 리로드 없이 맨 위로 스무스 이동
      if ((targetPath.includes('index.html') || targetPath === '/' || targetPath === '') && (currentPath.includes('index.html') || currentPath.endsWith('/'))) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // 화면 깜빡임/툴바 요동 없이 텔레포트 전환 (뒤로가기 완벽 보존)
      document.body.style.pointerEvents = 'none';
      document.body.style.opacity = '0.92';
      setTimeout(function() {
        window.location.assign(url);
      }, 30);
    };

   function safeGetJSON(key, defaultVal) {
      try {
        var item = localStorage.getItem(key);
        return item ? JSON.parse(item) : defaultVal;
      } catch (e) {
        return defaultVal;
      }

    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function triggerHaptic(duration) {
      if (typeof window !== 'undefined' && 'navigator' in window && typeof navigator.vibrate === 'function') {
        try {
          if (navigator.userActivation ? navigator.userActivation.hasBeenActive : true) {
            navigator.vibrate(duration || 12);
          }
        } catch (e) {}
      }
    }

    function showToast(msg, typeOrDuration, maybeDuration) {
      var dur = 2200;
      if (typeof typeOrDuration === 'number') dur = typeOrDuration;
      else if (typeof maybeDuration === 'number') dur = maybeDuration;

      var container = document.getElementById('romanticToastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'romanticToastContainer';
        container.style.cssText = 'position:fixed; bottom:calc(68px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); z-index:9999999; display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; width:max-content; max-width:90vw;';
        document.body.appendChild(container);
      }
      var toast = document.createElement('div');
      toast.style.cssText = 'background:rgba(10,14,23,0.96); border:1px solid rgba(255,255,255,0.22); color:#ffffff; font-size:0.75rem; font-weight:800; padding:9px 16px; border-radius:24px; box-shadow:0 12px 35px rgba(0,0,0,0.9); display:flex; align-items:center; gap:5px;';
      toast.innerHTML = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, dur);
    }

    function fetchFromIndexedDBDirect(key) {
      return new Promise(function(resolve) {
        if (typeof indexedDB === 'undefined') return resolve(null);
        var req = indexedDB.open('okbm_vault_db', 1);
        req.onsuccess = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('packing_vault')) return resolve(null);
          var tx = db.transaction('packing_vault', 'readonly');
          var store = tx.objectStore('packing_vault');
          var getReq = store.get(key);
          getReq.onsuccess = function() { resolve(getReq.result ? getReq.result.data : null); };
          getReq.onerror = function() { resolve(null); };
        };
        req.onerror = function() { resolve(null); };
      });
    }

    function extractCleanGearsFromRecord(record) {
      if (!record) return [];
      var rawItems = record.items || record.gears || [];
      if (typeof rawItems === 'string') {
        try { rawItems = JSON.parse(rawItems); } catch(e) { rawItems = []; }
      }
      if (!Array.isArray(rawItems) || rawItems.length === 0) {
        var selectedMulti = safeGetJSON('okbm_selected_gears_multi', {});
        if (selectedMulti && typeof selectedMulti === 'object') {
          rawItems = [];
          Object.keys(selectedMulti).forEach(function(k) {
            (selectedMulti[k] || []).forEach(function(it) { if (it) rawItems.push(it); });
          });
        }
      }

      if (!Array.isArray(rawItems)) return [];

      return rawItems.map(function(it) {
        if (typeof it === 'string') {
          var match = it.match(/^(.*?)\s*\((\d+)g\)$/);
          return match ? { name: match[1], weight: parseInt(match[2], 10) } : { name: it, weight: 0 };
        }
        return {
          name: it.name || it.itemName || '배낭 장비',
          weight: Number(it.weight || it.weight_g || 0)
        };
      }).filter(function(it) { return it.name && it.name.trim().length > 0; });
    }

        results = record.photos.filter(Boolean);
      } else if (record.photo_url && String(record.photo_url).trim().length > 10) {
        results = [String(record.photo_url).trim()];
      } else if (record.photos_json && String(record.photos_json).includes('http')) {
        var matchedJsonUrls = String(record.photos_json).match(/https?:\/\/[^\s"',\]\)]+/g);
        if (matchedJsonUrls && matchedJsonUrls.length > 0) results = matchedJsonUrls;
      } else if (record.photo && String(record.photo).trim().length > 10) {
        results = [String(record.photo).trim()];
      } else if (record.fieldPhoto && String(record.fieldPhoto).trim().length > 10) {
        results = [String(record.fieldPhoto).trim()];
      }

      if (results.length === 0) {

        if (window.__memoryStore && window.__memoryStore['okbm_phone_photos_map']) {

          results = [foundList];

        var cleanUrl = url.replace(/^["']|["']$/g, '').trim();

        // 1. 박지 마스터 DB에서 1:1 정식 레코드 인출

        var terrainStr = terrainList.join(' ').toLowerCase();

    function initSmartHeaderScrollEngine() {
      var header = document.querySelector('.netflix-integrated-header');
      if (!header || header._scrollEngineBound) return;
      header._scrollEngineBound = true;

      var lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
      var ticking = false;

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(function() {
            var currentScrollY = window.pageYOffset || document.documentElement.scrollTop;

            if (currentScrollY <= 15) {
              header.classList.remove('header-hidden');
            } else if (currentScrollY > lastScrollY && currentScrollY > 70) {
              header.classList.add('header-hidden');
            } else if (currentScrollY < lastScrollY) {
              header.classList.remove('header-hidden');
            }

            lastScrollY = currentScrollY;
            ticking = false;
          });
          ticking = true;
        }

      var target = new Date(parts[0], parts[1] - 1, parts[2]);
      var now = new Date();
      now.setHours(0,0,0,0);

          var pItem = photosToUpload[i];

    function renderTripPhotoStack() {
      var wrapper = document.getElementById('tripPhotoStackWrapper');
      var dots = document.getElementById('tripPhotoIndicators');
      if (!wrapper) return;

      var photos = window.__tempTripCreatePhotos || [];
      var total = photos.length;

      if (total === 0) {
        wrapper.innerHTML = `
          <div onclick="document.getElementById('tripPhotoFileInput').click()" style="width:100%; height:100%; border-radius:12px; border:1.5px dashed rgba(255,255,255,0.25); background:rgba(255,255,255,0.03); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(4px, 1vh, 8px); cursor:pointer; box-sizing:border-box;">
            <span style="font-size:clamp(1.6rem, 4.5vw, 2.1rem); line-height:1;"><svg viewBox="0 0 24 24" style="width:28px; height:28px;" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg></span>
            <span style="font-size:clamp(0.64rem, 1.9vw, 0.70rem); color:#cbd5e1; text-align:center; line-height:1.35;">세로 3:4 텐풍<br>사진 첨부 (최대 3장)</span>
          </div>
        `;
        if (dots) dots.innerHTML = '';
        return;
      }

      if (window.__currentTripCreatePhotoIdx >= total) {
        window.__currentTripCreatePhotoIdx = 0;
      }

      var stackHtml = '';
      for (var i = 0; i < total; i++) {
        var offset = (i - window.__currentTripCreatePhotoIdx + total) % total;
        var scale = 1 - (offset * 0.05);
        var translateY = offset * -6;
        var zIndex = 10 - offset;
        var opacity = 1 - (offset * 0.25);

        stackHtml += `
          <div class="trip-photo-stack-card" data-card-idx="${i}" style="position:absolute; inset:0; width:100% !important; height:100% !important; border-radius:12px; overflow:hidden; border:1.5px solid rgba(255,255,255,0.2); box-shadow:0 8px 24px rgba(0,0,0,0.85); background:#070a12; transform:scale(${scale}) translateY(${translateY}px); z-index:${zIndex}; opacity:${opacity}; transition:all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor:pointer; box-sizing:border-box;">
            <img src="${photos[i]}" style="width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;" />
            <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.6) 100%); pointer-events:none;"></div>
            
            ${offset === 0 ? `
              <div style="position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:flex-end; align-items:center; z-index:5;">
                <button type="button" onclick="removeTripCreatePhoto(${i}, event)" style="width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,0.85); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;">✕</button>
              </div>
              <div style="position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:0.58rem; color:#cbd5e1; font-weight:800; text-shadow:0 1px 3px #000; pointer-events:none;">
                터치 시 다음 사진 ➔
              </div>
            ` : ''}
          </div>
        `;
      }

      wrapper.innerHTML = stackHtml;

      if (dots) {
        var dotsHtml = photos.map(function(p, idx) {
          var isActive = (idx === window.__currentTripCreatePhotoIdx);
          return `<div style="width:${isActive ? '16px' : '5px'}; height:5px; border-radius:3px; background:${isActive ? '#ffffff' : 'rgba(255,255,255,0.25)'}; transition:all 0.2s ease;"></div>`;
        }).join('');

        if (total < 3) {
          dotsHtml += `<button type="button" onclick="document.getElementById('tripPhotoFileInput').click()" style="background:rgba(255,255,255,0.08); border:1px dashed rgba(255,255,255,0.25); color:#fff; font-size:0.56rem; font-weight:800; padding:1px 6px; border-radius:10px; cursor:pointer; margin-left:6px;">+ 추가</button>`;
        }
        dots.innerHTML = dotsHtml;
      }

      bindPhotoStackSwipeGestures(wrapper);
    }

    function bindPhotoStackSwipeGestures(wrapper) {
      if (!wrapper || wrapper._stackBound) return;
      wrapper._stackBound = true;

      var startX = 0, startY = 0;
      wrapper.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      wrapper.addEventListener('touchend', function(e) {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        var diffX = e.changedTouches[0].clientX - startX;
        var diffY = e.changedTouches[0].clientY - startY;
        var total = (window.__tempTripCreatePhotos || []).length;
        if (total <= 1) return;

        if (Math.abs(diffX) > 25 || (Math.abs(diffX) < 10 && Math.abs(diffY) < 10)) {
          triggerHaptic(8);
          cycleTripPhotoToBack();
        }
      }, { passive: true });

      wrapper.addEventListener('click', function(e) {
        if (e.target.closest('button')) return;
        var total = (window.__tempTripCreatePhotos || []).length;
        if (total > 1) {
          triggerHaptic(8);
          cycleTripPhotoToBack();
        }
      });
    }

    function cycleTripPhotoToBack() {
      var total = (window.__tempTripCreatePhotos || []).length;
      if (total <= 1) return;
      window.__currentTripCreatePhotoIdx = (window.__currentTripCreatePhotoIdx + 1) % total;
      renderTripPhotoStack();
    }

    function removeTripCreatePhoto(idx, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic(10);
      window.__tempTripCreatePhotos.splice(idx, 1);
      if (window.__currentTripCreatePhotoIdx >= window.__tempTripCreatePhotos.length) {
        window.__currentTripCreatePhotoIdx = Math.max(0, window.__tempTripCreatePhotos.length - 1);
      }
      renderTripPhotoStack();
    }

    async function handleTripMultiPhotoUpload(e) {
      var files = Array.from(e.target.files || []);
      e.target.value = '';
      if (files.length === 0) return;

      var currentPhotos = window.__tempTripCreatePhotos || [];
      var available = 3 - currentPhotos.length;
      if (available <= 0) {
        showToast('사진은 최대 3장까지만 등록 가능합니다.', 'warn');
        return;
      }

      var toProcess = files.slice(0, available);
      triggerHaptic(10);
      if (typeof window.showPhotoLoadingModal === 'function') {
        window.showPhotoLoadingModal(1, toProcess.length);
      }

      var valids = [];
      for (var i = 0; i < toProcess.length; i++) {
        if (typeof window.showPhotoLoadingModal === 'function') {
          window.showPhotoLoadingModal(i + 1, toProcess.length);
        }
        var b64 = (typeof window.processSinglePhotoSmart === 'function')
          ? await window.processSinglePhotoSmart(toProcess[i])
          : '';
        if (b64 && b64.length > 50) valids.push(b64);
      }

      if (typeof window.hidePhotoLoadingModal === 'function') {
        window.hidePhotoLoadingModal();
      }

      window.__tempTripCreatePhotos = (window.__tempTripCreatePhotos || []).concat(valids).slice(0, 3);
      window.__currentTripCreatePhotoIdx = 0;
      renderTripPhotoStack();
      triggerHaptic(12);
    }

    window.__tripPickerYear = 0;
    window.__tripPickerMonth = 0;
    window.__tripPickerSelectedDate = '';

    window.openTripDatePickerModal = function() {

      var old = document.getElementById('tripDatePickerModal');

      if (parts && parts.length >= 3) {
        window.__tripPickerYear = parseInt(parts[0], 10);
        window.__tripPickerMonth = parseInt(parts[1], 10);
        window.__tripPickerSelectedDate = window.__tripPickerYear + '.' + String(window.__tripPickerMonth).padStart(2, '0') + '.' + String(parseInt(parts[2], 10)).padStart(2, '0');

        window.__tripPickerYear = now.getFullYear();
        window.__tripPickerMonth = now.getMonth() + 1;
        window.__tripPickerSelectedDate = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');
      }

      var pickerModal = document.createElement('div');
      pickerModal.id = 'tripDatePickerModal';
      pickerModal.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:2000080 !important; display:flex; justify-content:center; align-items:center; padding:16px; box-sizing:border-box;';
      pickerModal.onclick = function(e) { if (e.target === pickerModal) pickerModal.remove(); };

      pickerModal.innerHTML = `
        <div style="width:100%; max-width:340px; background:#0a0d14; border:1.5px solid rgba(56,189,248,0.5); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 24px 60px rgba(0,0,0,0.95); box-sizing:border-box;" onclick="event.stopPropagation();">

    window.renderTripDatePickerCalendar = function() {
      var year = window.__tripPickerYear;
      var month = window.__tripPickerMonth;
      var titleEl = document.getElementById('tripPickerMonthTitle');
      var gridEl = document.getElementById('tripPickerDaysGrid');
      var hintEl = document.getElementById('tripPickerScheduleHint');
      if (!gridEl) return;

      if (titleEl) titleEl.innerText = year + '년 ' + month + '월';

      var now = new Date();
      var todayStr = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');

      var historyList = window.interactiveHistory || safeGetJSON('okbm_packing_history', []);
      var planMemosObj = safeGetJSON('okbm_plan_memos', {}) || {};

      var firstDayIndex = new Date(year, month - 1, 1).getDay();
      var lastDay = new Date(year, month, 0).getDate();

      var daysHtml = '';
      for (var b = 0; b < firstDayIndex; b++) {
        daysHtml += '<div style="height:28px;"></div>';
      }

      for (var d = 1; d <= lastDay; d++) {
        var dateKey = year + '.' + String(month).padStart(2, '0') + '.' + String(d).padStart(2, '0');
        var isSelected = (dateKey === window.__tripPickerSelectedDate);
        var isToday = (dateKey === todayStr);

        var completedRecord = (historyList || []).find(function(h) {
          return h && (h.date === dateKey || (h.date && h.date.replace(/[-/]/g, '.') === dateKey));
        });
        var hasMemo = Boolean(planMemosObj[dateKey] && planMemosObj[dateKey].trim().length > 0);

        var bg = 'rgba(255,255,255,0.025)';
        var color = '#ffffff';
        var border = '1px solid rgba(255,255,255,0.06)';
        var marker = '';

        if (isSelected) {
          bg = '#0284c7'; color = '#ffffff'; border = '1px solid #38bdf8';
        } else if (isToday) {
          border = '1px solid #38bdf8'; color = '#38bdf8';
        } else if (completedRecord) {
          marker = '<span style="position:absolute; bottom:1px; font-size:6px; color:#f59e0b;">★</span>';
          color = '#fde047';
        } else if (hasMemo) {
          marker = '<span style="position:absolute; bottom:1px; font-size:6px; color:#34d399;">⚑</span>';
          color = '#34d399';
        }

        daysHtml += `
          <div onclick="window.selectTripPickerDate('${dateKey}');" style="position:relative; height:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-size:0.75rem; font-weight:800; border-radius:6px; cursor:pointer; background:${bg}; color:${color}; border:${border}; box-sizing:border-box;">
            ${d}
            ${marker}
          </div>
        `;
      }

      gridEl.innerHTML = daysHtml;

      if (hintEl) {
        var sDate = window.__tripPickerSelectedDate;
        var foundRec = (historyList || []).find(function(h) { return h && (h.date === sDate || (h.date && h.date.replace(/[-/]/g, '.') === sDate)); });
        var foundMemo = planMemosObj[sDate] || '';

        if (foundRec) {
          hintEl.innerHTML = '<span style="color:#fde047; font-weight:800;">★ [' + sDate + '] 이미 다녀온 출발: ' + escapeHtml(foundRec.spot || '백패킹') + ' (' + (foundRec.weightKg || '0.00') + 'kg)</span>';
        } else if (foundMemo) {
          hintEl.innerHTML = '<span style="color:#34d399; font-weight:800;">⚑ [' + sDate + '] 기존 계획: ' + escapeHtml(foundMemo.slice(0, 38)) + '...</span>';
        } else {
          hintEl.innerHTML = '<span style="color:#94a3b8;">✓ [' + sDate + '] 비어있는 일정입니다. 원정대 출발일로 적합합니다!</span>';
        }

    function initIndexDockGestures() {
      var dock = document.getElementById('mainDualDockContainer');
      if (!dock || dock._swipeBound) return;
      dock._swipeBound = true;

      var startX = 0, startY = 0;
      dock.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      dock.addEventListener('touchmove', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        var diffX = Math.abs(e.touches[0].clientX - startX);
        var diffY = Math.abs(e.touches[0].clientY - startY);
        if (diffX > diffY && e.cancelable) e.preventDefault();
      }, { passive: false });

      dock.addEventListener('touchend', function(e) {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        var diffX = e.changedTouches[0].clientX - startX;
        var diffY = e.changedTouches[0].clientY - startY;
        if (Math.abs(diffX) > 28 && Math.abs(diffX) > Math.abs(diffY)) {
          window.toggleIndexDualDock();
        }
      }, { passive: true });
    }

    window.processSinglePhotoSmart = function(file) {
      return new Promise(function(resolve) {
        var directUrl = URL.createObjectURL(file);
        var directImg = new Image();

        var tryCompress = function(imageObj) {
          try {
            var canvas = document.createElement('canvas');
            var MAX_SIZE = 1200;
            var w = imageObj.width, h = imageObj.height;
            if (w > h) {
              if (w > MAX_SIZE) { h = Math.round(h * (MAX_SIZE / w)); w = MAX_SIZE; }
            } else {
              if (h > MAX_SIZE) { w = Math.round(w * (MAX_SIZE / h)); h = MAX_SIZE; }
            }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(imageObj, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (e) {
            resolve('');
          }
        };

        directImg.onload = function() {
          URL.revokeObjectURL(directUrl);
          tryCompress(directImg);
        };

        directImg.onerror = async function() {
          URL.revokeObjectURL(directUrl);
          if (typeof heic2any !== 'undefined') {
            try {
              var convertedBlob = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
              var safeBlob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
              var fallbackUrl = URL.createObjectURL(safeBlob);
              var fallbackImg = new Image();
              fallbackImg.onload = function() {
                URL.revokeObjectURL(fallbackUrl);
                tryCompress(fallbackImg);
              };
              fallbackImg.onerror = function() {
                URL.revokeObjectURL(fallbackUrl);
                resolve('');
              };
              fallbackImg.src = fallbackUrl;
            } catch (err) {
              resolve('');
            }
          } else {
            resolve('');
          }
        };

        directImg.src = directUrl;
      });
    };

  async function loadPortalSpotData() {
      // ⚡ 로컬 캐시 즉시 인출 (0.001초 지연 없는 렌더링)
      var cachedSpots = safeGetJSON('okbm_spots_cache', []);
      if (Array.isArray(cachedSpots) && cachedSpots.length > 0) {
        registeredSpots = cachedSpots;
        if (typeof renderSecretSpotTrailerRail === 'function') {
          renderSecretSpotTrailerRail();
        }
      }

      // 📁 구글 스프레드시트 정본 시트1 (gid=0) 인출
      var url = 'https://docs.google.com/spreadsheets/d/' + window.GOOGLE_SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + window.GOOGLE_SHEET_MAIN_GID + '&_t=' + Date.now();
      try {
        var res = await fetch(url);
        if (!res.ok) return;
        var csvText = await res.text();
        if (typeof Papa === 'undefined') return;

        Papa.parse(csvText, {
          header: true, skipEmptyLines: true,
          complete: function(results) {
            if (results.data && results.data.length > 0) {
              registeredSpots = results.data.map(function(row) {
                var sMain = (row.spot_main || row.name || row.fullName || row['박지명'] || '').trim();
                var sCity = (row.cityName || row.region || row['지역'] || '전국').trim();
                var sTerrainRaw = row.terrain || row['지형'] || row['지형태그'] || '';
                var tArr = Array.isArray(sTerrainRaw) ? sTerrainRaw : String(sTerrainRaw).split(',').map(function(t) { return t.trim(); }).filter(Boolean);

                return {
                  id: String(row.id || row.spotId || sMain).trim(),
                  name: sMain,
                  spot_main: sMain,
                  fullName: sMain,
                  cityName: sCity,
                  region: sCity,
                  elevation: String(row.elevation || row['고도'] || '').trim(),
                  difficulty: String(row.difficulty || row['난이도'] || '3').trim(),
                  distance: row.distance_km ? (row.distance_km + 'km') : (row.distance || ''),
                  terrain: tArr,
                  desc: (row.desc_summary || row.desc || row['설명'] || '자연 속에서 즐기는 조용한 하룻밤.').trim(),
                  desc_summary: (row.desc_summary || row.desc || row['설명'] || '자연 속에서 즐기는 조용한 하룻밤.').trim(),
                  lat: row.lat || '',
                  lng: row.lng || ''
                };
              }).filter(function(s) { return s.name.length > 0; });

              // 💾 로컬 캐시 즉시 업데이트 & 테마 스팟 레일 자동 갱신
              if (registeredSpots.length > 0) {
                localStorage.setItem('okbm_spots_cache', JSON.stringify(registeredSpots));
                if (typeof renderSecretSpotTrailerRail === 'function') {
                  renderSecretSpotTrailerRail();
                }
              }
            }
          }
        });
      } catch (e) {}
    }

        } else {
          isEdgeTracking = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!isEdgeTracking || !e.touches || e.touches.length !== 1) return;
        var diffX = e.touches[0].clientX - touchStartX;
        var diffY = Math.abs(e.touches[0].clientY - touchStartY);
        if (diffX > 65 && diffX > diffY * 1.5) {
          isEdgeTracking = false;
          triggerHaptic(12);
          window.closeTopmostModal();
        }
      }, { passive: true });

      document.addEventListener('touchend', function() { isEdgeTracking = false; }, { passive: true });
      document.addEventListener('touchcancel', function() { isEdgeTracking = false; }, { passive: true });
    })();

    window.addEventListener('popstate', function() {
      if (window.modalCloseStack.length > 0) {
        window.closeTopmostModal();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var wrapModal = function(openName, closeName, modalId) {
        var origOpen = window[openName];
        var origClose = window[closeName];
        if (typeof origOpen === 'function') {
          window[openName] = function() {
            var res = origOpen.apply(this, arguments);
            window.registerModalOpen(modalId, origClose);
            return res;
          };
        }
        if (typeof origClose === 'function') {
          window[closeName] = function() {
            window.unregisterModalClose(modalId);
            return origClose.apply(this, arguments);
          };
        }
      };

    wrapModal('openPlanModal', 'closePlanModal', 'romanticPlanModal');
      wrapModal('openHistoryModal', 'closeHistoryModal', 'romanticHistoryModal');
      wrapModal('openUserProfileModal', 'closeUserProfileModal', 'userProfileModalOverlay');
      wrapModal('openGearPresetModal', 'closeGearPresetModal', 'gearPresetModal');
      wrapModal('openPackShareModal', 'closePackShareModal', 'packShareModalOverlay');
      wrapModal('openPhotoStudio', 'closePhotoStudio', 'photoStudioOverlay');
      wrapModal('openVideoDetailModal', 'closeVideoDetailModal', 'videoDetailModal');

      if (window.Capacitor && window.Capacitor.Plugins) {
        var App = window.Capacitor.Plugins.App;
        if (App) {
          var lastBackTime = 0;
          App.addListener('backButton', function(data) {
            if (window.closeTopmostModal()) return;

            if (window.history.length > 1 && data.canGoBack) {
              window.history.back();
              return;
            }

            var currentTime = Date.now();
            if (currentTime - lastBackTime < 2000) {
              App.exitApp();
            } else {
              lastBackTime = currentTime;
              showToast("'뒤로' 버튼을 한 번 더 누르면 앱이 종료됩니다.", 2000);
            }
          });
        }
      }
    });
  </script>
</body>
</html>
