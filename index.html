<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>대한민국 낭만 백패킹 로드 | 지도 (4.0ver)</title>
  
  <!-- Naver Maps Open API -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=nokunumn03&submodules=geocoder"></script>
  <!-- CSV Parser -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --google-bg-deep: #0b0e14;
      --google-bg-surface: #141824;
      --google-bg-card: #1c2233;
      --google-bg-card-hover: #262e44;
      --google-border: rgba(255, 255, 255, 0.08);
      --google-border-glow: rgba(56, 189, 248, 0.35);
      --google-border-subtle: #1e2638;
      --google-text-primary: #f8fafc;
      --google-text-secondary: #94a3b8;
      --google-text-tertiary: #64748b;
      --google-accent-blue: #38bdf8;
      --google-accent-teal: #2dd4bf;
      --google-accent-emerald: #10b981;
      --google-accent-rose: #f43f5e;
      --google-accent-amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { 
      width: 100%; 
      max-width: 100vw;
      height: 100%; 
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Noto Sans KR', -apple-system, sans-serif; 
      background-color: var(--google-bg-deep); 
      color: var(--google-text-primary);
    }
    
    .header {
      width: 100%;
      min-height: 48px;
      background-color: rgba(11, 14, 20, 0.98);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 14px;
      z-index: 1000;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
      border-bottom: 1px solid var(--google-border);
      user-select: none;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
    
    .header-title-box {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      text-decoration: none;
    }
    .main-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: clamp(1.05rem, 1.8vw, 1.45rem);
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #ffffff 10%, #bae6fd 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .main-title .flag-icon, .main-title .backpack-icon {
      -webkit-text-fill-color: initial;
      font-size: 1.15rem;
    }
    .sub-en-title {
      font-family: 'Alex Brush', cursive;
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2dd4bf 20%, #38bdf8 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .sync-status-badge {
      background: rgba(2, 132, 199, 0.85);
      color: #ffffff;
      font-size: 0.66rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    
    .header-right { display: flex; align-items: center; gap: 8px; }

    .header-btn {
      background: var(--google-bg-card);
      border: 1px solid var(--google-border);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--google-text-primary);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    .header-btn:hover { background: var(--google-bg-card-hover); color: #ffffff; }

    /* 검색창 */
    .search-container { position: relative; display: flex; align-items: center; width: 320px; }
    .search-input {
      width: 100%;
      padding: 7px 34px 7px 14px;
      border-radius: 18px;
      border: 1px solid var(--google-border);
      background: var(--google-bg-surface);
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--google-accent-blue); background: var(--google-bg-deep); }
    .search-btn-icon {
      position: absolute;
      right: 11px;
      background: none;
      border: none;
      color: var(--google-text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .search-dropdown {
      position: absolute;
      top: 38px;
      left: 0; right: 0;
      background: rgba(20, 24, 36, 0.98);
      backdrop-filter: blur(14px);
      color: var(--google-text-primary);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.85);
      list-style: none;
      max-height: 320px;
      overflow-y: auto;
      display: none;
      z-index: 3000;
      border: 1px solid var(--google-border-glow);
    }
    .dropdown-header {
      padding: 8px 12px;
      background-color: var(--google-bg-deep);
      font-size: 0.74rem;
      font-weight: bold;
      color: var(--google-accent-blue);
      border-bottom: 1px solid var(--google-border-subtle);
      display: flex;
      justify-content: space-between;
    }
    .dropdown-item {
      padding: 9px 12px;
      border-bottom: 1px solid var(--google-border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .dropdown-item:hover { background: var(--google-bg-card-hover); }

    .container {
      display: flex;
      width: 100%;
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    
    /* 사이드바 */
    .sidebar {
      width: 380px;
      max-width: 100%;
      height: 100%;
      background-color: var(--google-bg-surface);
      border-right: 1px solid var(--google-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 1000;
      overflow-x: hidden;
      transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .sidebar.pc-collapsed { margin-left: -380px !important; }

    .pc-sidebar-toggle-btn {
      position: absolute;
      top: 50%;
      left: 380px;
      transform: translateY(-50%);
      width: 22px;
      height: 48px;
      background: rgba(20, 24, 36, 0.95);
      border: 1px solid var(--google-border-glow);
      border-left: none;
      border-radius: 0 8px 8px 0;
      color: var(--google-accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1100;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .sidebar.pc-collapsed ~ .pc-sidebar-toggle-btn { left: 0 !important; }

    .sidebar-header {
      padding: 6px 10px;
      min-height: 38px;
      font-weight: 700;
      font-size: 0.8rem;
      background-color: var(--google-bg-deep);
      border-bottom: 1px solid var(--google-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .filter-wrapper {
      background: var(--google-bg-deep);
      border-bottom: 1px solid var(--google-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 5px 8px;
      flex-shrink: 0;
    }
    .region-filter-bar {
      display: flex;
      overflow-x: auto;
      gap: 4px;
      align-items: center;
    }
    .filter-btn {
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--google-border);
      background: var(--google-bg-card);
      color: var(--google-text-secondary);
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
    }

    .spot-list { flex: 1; overflow-y: auto; list-style: none; background: var(--google-bg-surface); }
    .region-group { border-bottom: 1px solid var(--google-border-subtle); }
    .region-group-title {
      padding: 6px 10px;
      background-color: var(--google-bg-deep);
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--google-text-secondary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .spot-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--google-border-subtle);
      border-left: 2px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: var(--google-bg-surface);
    }
    .spot-item:hover { background-color: var(--google-bg-card); }
    .spot-item.active-spot {
      background-color: var(--google-bg-card-hover) !important;
      border-left: 2px solid var(--google-accent-blue) !important;
    }
    .spot-name { font-size: 0.84rem; font-weight: 700; color: var(--google-accent-blue); }

    #map { flex: 1; height: 100%; position: relative; background: var(--google-bg-deep); }
    
    .compact-info-window {
      padding: 10px 12px;
      width: min(280px, calc(100vw - 30px)) !important;
      max-height: min(340px, 55dvh);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(20, 24, 36, 0.98) !important;
      backdrop-filter: blur(14px) !important;
      color: var(--google-text-primary);
      border-radius: 14px !important;
      border: 1px solid var(--google-border-glow) !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85) !important;
    }
    .compact-title { font-size: 0.88rem; font-weight: 800; color: var(--google-accent-blue); }
    .compact-entry-link {
      font-size: 0.68rem;
      color: #7dd3fc;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 7px;
      border-radius: 6px;
      text-decoration: none;
      display: block;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .sub-en-title, .header-desktop-only, .pc-sidebar-toggle-btn { display: none !important; }
      .search-container { width: 140px; }
      .sidebar {
        position: absolute;
        top: 0; left: 0; right: 0;
        width: 100% !important;
        height: calc(100% - 50px) !important;
        z-index: 300;
        transform: translateY(0);
        transition: transform 0.3s;
      }
      .sidebar.collapsed { transform: translateY(-130%) !important; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <a href="index.html" class="header-title-box" title="메인 포털로 이동">
        <span class="main-title">
          <span class="flag-icon">🇰🇷</span>
          대한민국 낭만 백패킹 로드
          <span class="backpack-icon">🎒</span>
        </span>
        <span class="sub-en-title">Korea Romantic Backpacking Road</span>
      </a>
      <span class="sync-status-badge" id="syncStatusBadge">⚡ 동기화 완료</span>
    </div>
    
    <div class="header-right">
      <a href="index.html" class="header-btn">🏠 홈으로</a>
      <button type="button" class="header-btn header-desktop-only" onclick="resetMapView()">🔄 초기화</button>
      
      <div class="search-container">
        <input type="text" id="topSearchInput" class="search-input" placeholder="산/계곡/섬/봉우리 검색" onkeyup="if(event.key==='Enter') executeSearch()" />
        <button type="button" class="search-btn-icon" onclick="executeSearch()">🔍</button>
        <ul id="searchDropdown" class="search-dropdown"></ul>
      </div>
    </div>
  </header>

  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>📍 박지 목록 <strong id="spotCount" style="color:var(--google-accent-blue);">0개</strong></span>
        <span style="font-size:0.66rem; color:var(--google-text-tertiary);">4.0ver</span>
      </div>
      
      <div class="filter-wrapper">
        <div class="region-filter-bar">
          <button class="filter-btn active" onclick="filterByRegion('ALL')">전체</button>
          <button class="filter-btn" onclick="filterByRegion('서울/인천')">서울/인천</button>
          <button class="filter-btn" onclick="filterByRegion('경기')">경기</button>
          <button class="filter-btn" onclick="filterByRegion('강원')">강원</button>
          <button class="filter-btn" onclick="filterByRegion('충청')">충청</button>
          <button class="filter-btn" onclick="filterByRegion('전라')">전라</button>
          <button class="filter-btn" onclick="filterByRegion('경상')">경상</button>
          <button class="filter-btn" onclick="filterByRegion('제주')">제주</button>
        </div>
      </div>

      <div class="spot-list" id="spotList"></div>
    </aside>

    <div class="pc-sidebar-toggle-btn" id="pcSidebarToggleBtn" onclick="togglePcSidebar()" title="사이드바 접기/열기">
      ◀
    </div>
    
    <main id="map"></main>
  </div>

  <script>
    const GOOGLE_SHEET_ID = '1NwU__GxGKdTBhiifJmCQd3KB03U-v5xrI4zvLaXR_y4';
    const GOOGLE_SHEET_GID = '0';
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzW0vRtj-S_BEW0OzFTm7PV7zVyNLWJEas9-S7F9CnOTn817-pO8WODR9l5FEEE3bYu/exec';

    const DEFAULT_MAP_CENTER = new naver.maps.LatLng(36.5, 127.8);
    const DEFAULT_MAP_ZOOM = 8;

    let spots = [];
    let spotMarkerMap = new Map();
    let currentRegionFilter = 'ALL';
    let isPcSidebarCollapsed = false;

    const map = new naver.maps.Map('map', {
      center: DEFAULT_MAP_CENTER,
      zoom: DEFAULT_MAP_ZOOM,
      zoomControl: true,
      zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER }
    });

    const infoWindow = new naver.maps.InfoWindow({ borderWidth: 0, disableAnchor: true, backgroundColor: 'transparent' });

    function togglePcSidebar() {
      isPcSidebarCollapsed = !isPcSidebarCollapsed;
      document.getElementById('sidebar').classList.toggle('pc-collapsed', isPcSidebarCollapsed);
      document.getElementById('pcSidebarToggleBtn').innerText = isPcSidebarCollapsed ? '▶' : '◀';
      setTimeout(() => naver.maps.Event.trigger(map, 'resize'), 300);
    }

    function createCustomMarkerIcon(spot) {
      const d = parseInt(spot.difficulty, 10) || 3;
      const color = d <= 2 ? '#10b981' : (d >= 4 ? '#f43f5e' : '#f59e0b');
      return {
        content: `
          <div style="cursor:pointer; transform:translate(-50%, -100%);">
            <svg viewBox="0 0 24 34" width="22" height="29">
              <path fill="${color}" stroke="#ffffff" stroke-width="1.8" d="M12 0C5.373 0 0 5.373 0 12c0 9 12 22 12 22s12-13 12-22c0-6.627-5.373-12-12-12z"/>
              <circle fill="#ffffff" cx="12" cy="11" r="4"/>
            </svg>
          </div>
        `,
        anchor: new naver.maps.Point(0, 0)
      };
    }

    function focusSpotOnMap(spot) {
      if (!spot) return;

      // 마커 하이라이트
      spotMarkerMap.forEach(m => m.setZIndex(100));
      const marker = spotMarkerMap.get(String(spot.id));
      if (marker) marker.setZIndex(999999);

      // 사이드바 포커스
      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active-spot'));
      const activeCard = document.getElementById(`spotItem_${spot.id}`);
      if (activeCard) {
        activeCard.classList.add('active-spot');
        const container = activeCard.closest('.region-items-container');
        if (container) container.style.display = 'block';
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 모바일인 경우 사이드바 접고 지도로 바로 보기
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('collapsed');
      }

      // 팝업 열기
      infoWindow.setContent(`
        <div class="compact-info-window">
          <div class="compact-title">${spot.name}</div>
          <a href="https://map.naver.com/p/search/${encodeURIComponent(spot.entryPoint || spot.name)}" target="_blank" rel="noopener noreferrer" class="compact-entry-link">🚗 들머리 네비 안내 ↗</a>
          <div style="font-size:0.7rem; color:#94a3b8; white-space:pre-line;">📝 ${spot.desc || '추천 박지'}</div>
        </div>
      `);
      infoWindow.open(map, marker || new naver.maps.LatLng(spot.lat, spot.lng));

      // 부드러운 카메라 이동
      map.morph(new naver.maps.LatLng(spot.lat, spot.lng), 13, { duration: 350 });
    }

    /* 시트 로딩 및 URL 파라미터 즉시 실행 */
    async function fetchSpotsFromGoogleSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GOOGLE_SHEET_GID}&_t=${Date.now()}`;
      try {
        const res = await fetch(url);
        const csv = await res.text();
        Papa.parse(csv, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            spots = results.data.map((row, idx) => ({
              id: row.id || String(idx),
              name: row.name || row.산 || row.박지명 || '무명 박지',
              lat: parseFloat(row.lat || row.위도) || 37.5,
              lng: parseFloat(row.lng || row.경도) || 127.0,
              region: row.region || '경기',
              entryPoint: row.entryPoint || row.들머리 || '',
              desc: row.desc || row.특징 || '',
              difficulty: row.difficulty || '3'
            })).filter(s => s.lat !== 0 && s.lng !== 0);

            renderSpots();

            // 🔥 [먹통 해결 핵심] 시트가 로드되자마자 즉시 파라미터 체크 & 팝업 오픈!
            const urlParams = new URLSearchParams(window.location.search);
            const targetSpotName = urlParams.get('spot') || urlParams.get('q');
            
            if (targetSpotName) {
              const cleanTarget = decodeURIComponent(targetSpotName).trim().toLowerCase();
              const found = spots.find(s => 
                s.name.toLowerCase().includes(cleanTarget) || 
                cleanTarget.includes(s.name.toLowerCase())
              );
              
              if (found) {
                // 0.2초 대기 후 정확하게 팝업 오픈
                setTimeout(() => focusSpotOnMap(found), 200);
              } else {
                const input = document.getElementById('topSearchInput');
                if (input) input.value = targetSpotName;
                executeSearch();
              }
            }
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    function renderSpots() {
      spotMarkerMap.forEach(m => m.setMap(null));
      spotMarkerMap.clear();

      const spotListEl = document.getElementById('spotList');
      spotListEl.innerHTML = '';
      document.getElementById('spotCount').innerText = `${spots.length}개`;

      const regions = ["서울/인천", "경기", "강원", "충청", "전라", "경상", "제주"];
      regions.forEach(reg => {
        const list = spots.filter(s => currentRegionFilter === 'ALL' || s.region.includes(reg));
        if (list.length === 0) return;

        const groupDiv = document.createElement('div');
        groupDiv.className = 'region-group';
        groupDiv.innerHTML = `
          <div class="region-group-title" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'">
            <span>📌 ${reg}</span>
            <span>${list.length}개 ▼</span>
          </div>
          <div class="region-items-container"></div>
        `;

        const container = groupDiv.querySelector('.region-items-container');
        list.forEach(spot => {
          const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(spot.lat, spot.lng),
            map: map,
            icon: createCustomMarkerIcon(spot)
          });
          spotMarkerMap.set(String(spot.id), marker);
          naver.maps.Event.addListener(marker, 'click', () => focusSpotOnMap(spot));

          const item = document.createElement('div');
          item.className = 'spot-item';
          item.id = `spotItem_${spot.id}`;
          item.innerHTML = `
            <div class="spot-name">${spot.name}</div>
            <div style="font-size:0.66rem; color:#7dd3fc;">🚗 ${spot.entryPoint || '들머리 정보 미입력'}</div>
          `;
          item.addEventListener('click', () => focusSpotOnMap(spot));
          container.appendChild(item);
        });

        spotListEl.appendChild(groupDiv);
      });
    }

    function executeSearch() {
      const q = document.getElementById('topSearchInput').value.trim().toLowerCase();
      if (!q) return;
      const target = spots.find(s => s.name.toLowerCase().includes(q) || (s.desc && s.desc.toLowerCase().includes(q)));
      if (target) {
        focusSpotOnMap(target);
      }
    }

    function filterByRegion(reg) {
      currentRegionFilter = reg;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(reg==='ALL'?'전체':reg)));
      renderSpots();
    }

    function resetMapView() {
      map.morph(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM, { duration: 300 });
      infoWindow.close();
      document.getElementById('sidebar').classList.remove('collapsed');
    }

    fetchSpotsFromGoogleSheet();
