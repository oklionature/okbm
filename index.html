<script>
(function inlineHydrateCriticalUI() {
    try {
      var cachedHeroCover = localStorage.getItem('okbm_hero_cover_url');
      if (cachedHeroCover && cachedHeroCover.startsWith('http')) {
        var quickImg = document.getElementById('heroCoverImg');
        if (quickImg) {
          quickImg.src = cachedHeroCover;
          quickImg.style.opacity = '1';
        }
      }

      var token = localStorage.getItem('user_auth_token');
      var rawProfile = localStorage.getItem('user_profile');
      var profile = rawProfile ? JSON.parse(rawProfile) : null;
      var isLogged = !!(token && token.trim().length > 0 && profile && profile.id);

      var headerBtn = document.getElementById('headerAuthBtn');
      var headerText = document.getElementById('headerAuthText');
      var headerIcon = document.getElementById('headerAuthIcon');

      if (isLogged && profile && profile.nickname) {
        if (headerBtn) headerBtn.classList.add('logged-in');
        if (headerText) headerText.innerText = profile.nickname;
        if (headerIcon) {
          headerIcon.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px; height:13px; margin-right:2px; fill:#fde047; color:#fde047; flex-shrink:0; display:inline-block; vertical-align:-1px;"><path d="M12,1 Q12,12 1,12 Q12,12 12,23 Q12,12 23,12 Q12,12 12,23 Q12,12 12,1 Z"/><circle cx="12" cy="12" r="1.5" fill="#ffffff"/></svg>';
        }
      }

      var rawFeeds = localStorage.getItem('okbm_cached_community_feeds');
      var rawPhotosMap = localStorage.getItem('okbm_phone_photos_map');
      var rawStarCounts = localStorage.getItem('okbm_feed_stars_counts');

      var parsedFeeds = rawFeeds ? JSON.parse(rawFeeds) : [];
      var photosMap = rawPhotosMap ? JSON.parse(rawPhotosMap) : {};
      var starCounts = rawStarCounts ? JSON.parse(rawStarCounts) : {};

      // 🌟 [명예의 전당 인라인 수화]: 전국 별점을 가장 많이 받은 1위 피드를 최우선 히어로 후보로 채택
      var candidate = null;
      if (Array.isArray(parsedFeeds) && parsedFeeds.length > 0) {
        var sortedFeeds = parsedFeeds.slice().filter(function(f) { return f && f.isPublished !== false; }).sort(function(a, b) {
          var sA = Number(starCounts[a.id] || a.likes || 0);
          var sB = Number(starCounts[b.id] || b.likes || 0);
          if (sB !== sA) return sB - sA;
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
        candidate = sortedFeeds[0];
      }

      if (!candidate) return;

      var cId = String(candidate.id || '').trim();
      var cleanCId = cId.split(';')[0].trim();
      var cDate = String(candidate.date || '').trim();
      var altDate = cDate.replace(/[-/]/g, '.');

      var photoUrl = '';
      var mappedPhotos = (cleanCId && photosMap[cleanCId]) || (cId && photosMap[cId]) || (cDate && photosMap[cDate]) || (altDate && photosMap[altDate]);

      if (Array.isArray(mappedPhotos) && mappedPhotos.length > 0) {
        photoUrl = mappedPhotos[0];
      } else if (typeof mappedPhotos === 'string' && mappedPhotos.length > 10) {
        photoUrl = mappedPhotos;
      } else if (Array.isArray(candidate.photos) && candidate.photos.length > 0) {
        photoUrl = candidate.photos[0];
      } else if (candidate.photo_url && String(candidate.photo_url).trim().length > 10) {
        photoUrl = candidate.photo_url;
      } else if (candidate.photo) {
        photoUrl = candidate.photo;
      } else if (candidate.fieldPhoto) {
        photoUrl = candidate.fieldPhoto;
      }

      if (photoUrl && typeof photoUrl === 'string') {
        photoUrl = photoUrl.replace(/^["']|["']$/g, '').trim();
        if (photoUrl.includes('drive.google.com')) {
          var idMatch = photoUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/) || photoUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (idMatch && idMatch[1]) {
            photoUrl = 'https://lh3.googleusercontent.com/d/' + idMatch[1] + '=w1200';
          }
        }
      }

      var title = candidate.spot || candidate.spotName || '';
      var memo = candidate.memo || candidate.oneLineMemo || '';
      var author = candidate.author || '낭만백패커';
      var weight = candidate.weightKg ? (candidate.weightKg + 'kg') : '';
      var elev = candidate.elevation ? (String(candidate.elevation).includes('m') ? candidate.elevation : candidate.elevation + 'm') : '';

      if (photoUrl) {
        var img = document.getElementById('heroCoverImg');
        if (img) {
          img.decoding = 'async';
          img.src = photoUrl;
          img.onload = function() { img.style.opacity = '1'; };
          if (img.complete) { img.style.opacity = '1'; }
        }
      }
      if (title) {
        var tEl = document.getElementById('heroMainTitle');
        if (tEl) tEl.innerText = title;
      }
      if (memo) {
        var qEl = document.getElementById('heroQuoteText');
        if (qEl) qEl.innerText = '“' + memo + '”';
      }
      if (author) {
        var aEl = document.getElementById('heroAuthorText');
        if (aEl) aEl.innerText = author;
      }
      if (weight) {

     // 🏷️ 박지 마스터 DB 정식 지형 태그(terrain) & 도메인 팩트 기반 정밀 필터링

        // 1. 박지 마스터 DB에서 1:1 정식 레코드 인출
        var mSpot = spotPool.find(function(s) {
          if (!s) return false;
          var sName = String(s.name || s.spot_main || '').replace(/\s*\(.*?\)/g, '').trim().toLowerCase();
          return sName && (sName === cleanName || sName === pureKeyword || cleanName.includes(sName) || sName.includes(pureKeyword));
        });

        // 2. 마스터 DB의 정식 지형(terrain), 난이도 인출
        var terrainList = [];
        if (mSpot && mSpot.terrain) {

        var terrainStr = terrainList.join(' ').toLowerCase();
        var difficulty = mSpot ? (parseInt(mSpot.difficulty, 10) || 3) : 3;

        // 3. 지형 속성 플래그 (중복 분류 방지용)
        var isDeck = terrainStr.includes('데크') || cleanName.includes('데크') || rawName.includes('데크');
        var isEasyAccess = terrainStr.includes('임도') || terrainStr.includes('차박') || terrainStr.includes('주차장') || cleanName.includes('육백마지기');

        if (themeKey === 'easy') {
          // 초보/퇴근박: 난이도 1~2급, 육백마지기 등 차박/임도 명소, 노지, 잔디, 활공장, 헬기장
          return difficulty <= 2 || isEasyAccess || terrainStr.includes('노지') || terrainStr.includes('잔디') || terrainStr.includes('활공장') || terrainStr.includes('헬기장');
        } else if (themeKey === 'island') {
          // 오션/섬: 섬, 해변, 모래, 바다 지형 및 굴업도/자월도 등 ~도 단위 섬 완벽 수용
          var hasIslandWord = terrainStr.includes('섬') || terrainStr.includes('해변') || terrainStr.includes('모래') || terrainStr.includes('바다') || terrainStr.includes('해수욕장') || terrainStr.includes('해안');
          var isIslandName = /(굴업|자월|덕적|승봉|대이작|소이작|백령|대청|소청|연평|선재|영흥|교동|석모|강화|신도|시도|모도|장봉|울릉|독도|제주|비양|우도|추자|가파|마라|보길|완도|청산|흑산|홍도|거문|금오|안도|연도|돌산|백야|하화|상화|개도|사도|초도|손죽|거제|남해|욕지|연화|매물|소매물|비진|한산|사량|수우|두미|조도|관매|선유|무녀|장자|관리|방축|말도|야미|신시|어청|위도|삽시|원산|고대|장고|효자|외연|호도|녹도|풍도|육도)도/.test(cleanName) || cleanName.includes('섬');
          return hasIslandWord || isIslandName;
        } else if (themeKey === 'alpine') {

          if (isDeck || isEasyAccess) return false;
          return terrainStr.includes('암릉') || terrainStr.includes('너덜') || terrainStr.includes('돌박지') || terrainStr.includes('바위') || terrainStr.includes('마당바위') || terrainStr.includes('슬랩');

   window.handleHeroTouchEnd = function(e) {
      if (!e.changedTouches || e.changedTouches.length !== 1) return;
      var diffX = Math.abs(e.changedTouches[0].clientX - heroTouchStartX);
      var diffY = Math.abs(e.changedTouches[0].clientY - heroTouchStartY);

      window.addEventListener('scroll', function() {
        if (!ticking) {
          window.requestAnimationFrame(function() {
            var currentScrollY = window.pageYOffset || document.documentElement.scrollTop;

            if (currentScrollY <= 15) {

    window.syncTripToCloudSheet = function(tripData) {
      if (!tripData) return;
      var gasUrl = window.GAS_API_URL || GAS_API_URL;
      if (!gasUrl || gasUrl.includes('구글시트_배포_URL')) return;

      var photosToUpload = (Array.isArray(tripData.photos) && tripData.photos.length > 0) ? tripData.photos : [];

      (async function() {
        var finalDriveUrls = [];
        for (var i = 0; i < photosToUpload.length; i++) {
          var pItem = photosToUpload[i];
          if (typeof pItem === 'string' && pItem.startsWith('data:') && typeof window.uploadSinglePhotoToDrive === 'function') {
            var singleUrl = await window.uploadSinglePhotoToDrive(pItem, 'trip_' + tripData.tripId + '_' + i + '.jpg');
            finalDriveUrls.push((singleUrl && singleUrl.startsWith('http')) ? singleUrl : pItem);
            await new Promise(function(res) { setTimeout(res, 350); });
          } else {
            finalDriveUrls.push(pItem);
          }
        }

        if (finalDriveUrls.length > 0) {
          tripData.photos = finalDriveUrls;
          tripData.photo = finalDriveUrls[0];
        }

        var payload = {
          action: 'CREATE_TRIP',
          trip: {
            tripId: tripData.tripId,
            spotName: tripData.spotName,
            date: tripData.date,
            carpoolInfo: tripData.carpoolInfo,
            maxCapacity: tripData.maxCapacity || 4,
            currentJoined: tripData.currentJoined || 1,
            participants: JSON.stringify(tripData.participants || []),
            gearShare: tripData.gearShare,
            openChatUrl: tripData.openChatUrl,
            photos: JSON.stringify(tripData.photos || []),
            authorName: tripData.authorName,
            desc: tripData.desc,
            isActive: 'TRUE',
            createdAt: tripData.createdAt
          }
        };

        fetch(gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).then(function(res) {
          return res.json();
        }).then(function(data) {
          if (data && data.status === 'SUCCESS') {
            console.log('✅ [Trip] 구글 시트 원정대 동행 등록 100% 완료');
          }
        }).catch(function(err) {});
      })();
    };

    async function loadTripsFromGoogleSheet() {
      var TRIPS_GID = '1029159607';
      var sheetId = window.GOOGLE_SHEET_ID || '1NwU__GxGKdTBhiifJmCQd3KB03U-v5xrI4zvLaXR_y4';
      var gvizUrl = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:csv&gid=' + TRIPS_GID + '&_t=' + Date.now();

      try {
        var res = await fetch(gvizUrl);
        if (!res.ok) return;
        var csvText = await res.text();
        if (typeof Papa === 'undefined') return;

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (results.data && results.data.length > 0) {
              var savedMap = safeGetJSON('okbm_trip_photos_map', {});
              var loaded = [];
              results.data.forEach(function(row) {
                var isActiveRaw = String(row.isActive || 'TRUE').toUpperCase();
                if (isActiveRaw === 'FALSE') return;
                var spot = row.spotName || '';
                var dateStr = row.date || '';
                if (!spot || !dateStr) return;

                var tId = String(row.tripId || ('trip_' + spot.replace(/\s+/g, '') + '_' + dateStr.replace(/\D/g, ''))).trim();

                if (window.__tombstoneTripIds && window.__tombstoneTripIds.has(tId)) return;

                var localPhotos = savedMap[tId];

                var rawPhotos = String(row.photos || row.photo || '').trim();
                var photoArr = [];

                if (Array.isArray(localPhotos) && localPhotos.length > 0) {
                  photoArr = localPhotos;
                } else if (typeof localPhotos === 'string' && localPhotos.length > 10) {
                  photoArr = [localPhotos];
                } else if (rawPhotos.match(/https?:\/\/[^\s"',\]\)]+/g)) {
                  photoArr = rawPhotos.match(/https?:\/\/[^\s"',\]\)]+/g).map(function(u) {
                    var clean = u.replace(/^["']|["']$/g, '').trim();
                    return clean.includes('drive.google.com/thumbnail') ? clean.replace(/sz=w\d+/g, 'sz=w1200') : clean;
                  });
                } else if (rawPhotos.startsWith('http')) {
                  photoArr = [rawPhotos.replace(/^["']|["']$/g, '').trim()];
                }

                var rawParticipants = String(row.participants || '').trim();
                var participantArr = [];
                if (rawParticipants.startsWith('[') && rawParticipants.endsWith(']')) {
                  try { participantArr = JSON.parse(rawParticipants); } catch(e) { participantArr = []; }
                }

                var maxCap = parseInt(row.maxCapacity || row.maxMembers, 10) || 4;
                var curJoin = parseInt(row.currentJoined, 10) || (participantArr.length > 0 ? participantArr.length : 1);

                loaded.push({
                  tripId: tId,
                  spotName: spot,
                  date: dateStr,
                  carpoolInfo: row.carpoolInfo || '',
                  maxCapacity: maxCap,
                  currentJoined: curJoin,
                  participants: participantArr.length > 0 ? participantArr : [{ userId: 'host', nickname: row.authorName || '방장', isHost: true }],
                  gearShare: row.gearShare || '',
                  openChatUrl: row.openChatUrl || 'https://open.kakao.com',
                  photo: photoArr[0] || '',
                  photos: photoArr,
                  authorName: row.authorName || '낭만백패커',
                  desc: row.desc || '',
                  isActive: 'TRUE',
                  createdAt: row.createdAt || ''
                });
              });

              if (loaded.length > 0) {
                window.TRIP_JOINS_DATABASE = loaded;
                renderHomeTripJoinSlider();
              }
            }
          }
        });
      } catch (err) {}
    }

              <div style="position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:flex-end; align-items:center; z-index:5;">
                <button type="button" onclick="removeTripCreatePhoto(${i}, event)" style="width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,0.85); border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;">✕</button>
              </div>
              <div style="position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:0.58rem; color:#cbd5e1; font-weight:800; text-shadow:0 1px 3px #000; pointer-events:none;">
                
              </div>
            ` : ''}
          </div>
        `;
      }

      wrapper.innerHTML = stackHtml;

      if (dots) {
        var dotsHtml = photos.map(function(p, idx) {
          var isActive = (idx === window.__currentTripCreatePhotoIdx);
          return `<div style="width:${isActive ? '16px' : '5px'}; height:5px; border-radius:3px; background:${isActive ? '#ffffff' : 'rgba(255,255,255,0.25)'}; transition:all 0.2s ease;"></div>`;
        }).join('');

        if (total < 3) {
          dotsHtml += `<button type="button" onclick="document.getElementById('tripPhotoFileInput').click()" style="background:rgba(255,255,255,0.08); border:1px dashed rgba(255,255,255,0.25); color:#fff; font-size:0.56rem; font-weight:800; padding:1px 6px; border-radius:10px; cursor:pointer; margin-left:6px;">+ 추가</button>`;
        }
        dots.innerHTML = dotsHtml;
      }

      bindPhotoStackSwipeGestures(wrapper);
    }

    function bindPhotoStackSwipeGestures(wrapper) {
      if (!wrapper || wrapper._stackBound) return;
      wrapper._stackBound = true;

      var startX = 0, startY = 0;
      wrapper.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      wrapper.addEventListener('touchend', function(e) {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        var diffX = e.changedTouches[0].clientX - startX;
        var diffY = e.changedTouches[0].clientY - startY;
        var total = (window.__tempTripCreatePhotos || []).length;
        if (total <= 1) return;

        if (Math.abs(diffX) > 25 || (Math.abs(diffX) < 10 && Math.abs(diffY) < 10)) {
          triggerHaptic(8);
          cycleTripPhotoToBack();
        }
      }, { passive: true });

      wrapper.addEventListener('click', function(e) {
        if (e.target.closest('button')) return;
        var total = (window.__tempTripCreatePhotos || []).length;
        if (total > 1) {
          triggerHaptic(8);
          cycleTripPhotoToBack();
        }
      });
    }

    function cycleTripPhotoToBack() {
      var total = (window.__tempTripCreatePhotos || []).length;
      if (total <= 1) return;
      window.__currentTripCreatePhotoIdx = (window.__currentTripCreatePhotoIdx + 1) % total;
      renderTripPhotoStack();
    }

    function removeTripCreatePhoto(idx, e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      triggerHaptic(10);
      window.__tempTripCreatePhotos.splice(idx, 1);
      if (window.__currentTripCreatePhotoIdx >= window.__tempTripCreatePhotos.length) {
        window.__currentTripCreatePhotoIdx = Math.max(0, window.__tempTripCreatePhotos.length - 1);
      }
      renderTripPhotoStack();
    }

    async function handleTripMultiPhotoUpload(e) {
      var files = Array.from(e.target.files || []);
      e.target.value = '';
      if (files.length === 0) return;

      var currentPhotos = window.__tempTripCreatePhotos || [];
      var available = 3 - currentPhotos.length;
      if (available <= 0) {
        showToast('사진은 최대 3장까지만 등록 가능합니다.', 'warn');
        return;
      }

      var toProcess = files.slice(0, available);
      triggerHaptic(10);
      if (typeof window.showPhotoLoadingModal === 'function') {
        window.showPhotoLoadingModal(1, toProcess.length);
      }

      var valids = [];
      for (var i = 0; i < toProcess.length; i++) {
        if (typeof window.showPhotoLoadingModal === 'function') {
          window.showPhotoLoadingModal(i + 1, toProcess.length);
        }
        var b64 = (typeof window.processSinglePhotoSmart === 'function')
          ? await window.processSinglePhotoSmart(toProcess[i])
          : '';
        if (b64 && b64.length > 50) valids.push(b64);
      }

      if (typeof window.hidePhotoLoadingModal === 'function') {
        window.hidePhotoLoadingModal();
      }

      window.__tempTripCreatePhotos = (window.__tempTripCreatePhotos || []).concat(valids).slice(0, 3);
      window.__currentTripCreatePhotoIdx = 0;
      renderTripPhotoStack();
      triggerHaptic(12);
    }

    window.changeTripPickerMonth = function(delta) {
      window.__tripPickerMonth += delta;
      if (window.__tripPickerMonth < 1) { window.__tripPickerMonth = 12; window.__tripPickerYear--; }
      else if (window.__tripPickerMonth > 12) { window.__tripPickerMonth = 1; window.__tripPickerYear++; }
      window.renderTripDatePickerCalendar();
      triggerHaptic(8);
    };

    window.renderTripDatePickerCalendar = function() {
      var year = window.__tripPickerYear;
      var month = window.__tripPickerMonth;
      var titleEl = document.getElementById('tripPickerMonthTitle');
      var gridEl = document.getElementById('tripPickerDaysGrid');
      var hintEl = document.getElementById('tripPickerScheduleHint');
      if (!gridEl) return;

      if (titleEl) titleEl.innerText = year + '년 ' + month + '월';

      var now = new Date();
      var todayStr = now.getFullYear() + '.' + String(now.getMonth() + 1).padStart(2, '0') + '.' + String(now.getDate()).padStart(2, '0');

      var historyList = window.interactiveHistory || safeGetJSON('okbm_packing_history', []);
      var planMemosObj = safeGetJSON('okbm_plan_memos', {}) || {};

      var firstDayIndex = new Date(year, month - 1, 1).getDay();
      var lastDay = new Date(year, month, 0).getDate();

      var daysHtml = '';
      for (var b = 0; b < firstDayIndex; b++) {
        daysHtml += '<div style="height:28px;"></div>';
      }

      for (var d = 1; d <= lastDay; d++) {
        var dateKey = year + '.' + String(month).padStart(2, '0') + '.' + String(d).padStart(2, '0');
        var isSelected = (dateKey === window.__tripPickerSelectedDate);
        var isToday = (dateKey === todayStr);

        var completedRecord = (historyList || []).find(function(h) {
          return h && (h.date === dateKey || (h.date && h.date.replace(/[-/]/g, '.') === dateKey));
        });
        var hasMemo = Boolean(planMemosObj[dateKey] && planMemosObj[dateKey].trim().length > 0);

        var bg = 'rgba(255,255,255,0.025)';
        var color = '#ffffff';
        var border = '1px solid rgba(255,255,255,0.06)';
        var marker = '';

        if (isSelected) {
          bg = '#0284c7'; color = '#ffffff'; border = '1px solid #38bdf8';
        } else if (isToday) {
          border = '1px solid #38bdf8'; color = '#38bdf8';
        } else if (completedRecord) {
          marker = '<span style="position:absolute; bottom:1px; font-size:6px; color:#f59e0b;">★</span>';
          color = '#fde047';
        } else if (hasMemo) {
          marker = '<span style="position:absolute; bottom:1px; font-size:6px; color:#34d399;">⚑</span>';
          color = '#34d399';
        }

        daysHtml += `
          <div onclick="window.selectTripPickerDate('${dateKey}');" style="position:relative; height:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Space Grotesk', sans-serif; font-size:0.75rem; font-weight:800; border-radius:6px; cursor:pointer; background:${bg}; color:${color}; border:${border}; box-sizing:border-box;">
            ${d}
            ${marker}
          </div>
        `;
      }

      gridEl.innerHTML = daysHtml;

      if (hintEl) {
        var sDate = window.__tripPickerSelectedDate;
        var foundRec = (historyList || []).find(function(h) { return h && (h.date === sDate || (h.date && h.date.replace(/[-/]/g, '.') === sDate)); });
        var foundMemo = planMemosObj[sDate] || '';

        if (foundRec) {
          hintEl.innerHTML = '<span style="color:#fde047; font-weight:800;">★ [' + sDate + '] 이미 다녀온 출발: ' + escapeHtml(foundRec.spot || '백패킹') + ' (' + (foundRec.weightKg || '0.00') + 'kg)</span>';
        } else if (foundMemo) {
          hintEl.innerHTML = '<span style="color:#34d399; font-weight:800;">⚑ [' + sDate + '] 기존 계획: ' + escapeHtml(foundMemo.slice(0, 38)) + '...</span>';
        } else {
          hintEl.innerHTML = '<span style="color:#94a3b8;">✓ [' + sDate + '] 비어있는 일정입니다. 원정대 출발일로 적합합니다!</span>';
        }
      }
    };

    window.selectTripPickerDate = function(dateKey) {

      window.renderTripDatePickerCalendar();
      triggerHaptic(10);
    };

    window.confirmTripDateSelection = function() {
      var input = document.getElementById('tripInputDate');
      if (input && window.__tripPickerSelectedDate) {
        input.value = window.__tripPickerSelectedDate;
      }
      var modal = document.getElementById('tripDatePickerModal');
      if (modal) modal.remove();
      triggerHaptic(12);
    };

    function handleTripSpotSearch(query) {
      var dropdown = document.getElementById('tripSpotDropdown');
      if (!dropdown) return;
      var q = (query || '').trim().toLowerCase();
      var pool = (typeof registeredSpots !== 'undefined' && Array.isArray(registeredSpots) && registeredSpots.length > 0)
        ? registeredSpots : (safeGetJSON('okbm_spots_cache', []) || []);

      var matched = q ? pool.filter(function(s) {
        return (s.name || '').toLowerCase().includes(q) || (s.region || '').toLowerCase().includes(q);
      }).slice(0, 15) : pool.slice(0, 15);

      if (matched.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      dropdown.innerHTML = matched.map(function(s) {
        var spotName = s.fullName || s.name;
        return `<div class="spot-dropdown-item" onclick="selectTripSpot('${escapeHtml(spotName)}');">
          <span>${escapeHtml(spotName)}</span>
          <span style="font-size:0.60rem; color:#94a3b8;">${escapeHtml(s.region || '')}</span>
        </div>`;
      }).join('');
      dropdown.style.display = 'block';
    }

    window.selectTripSpot = function(spotName) {
      var input = document.getElementById('tripInputSpot');
      var dropdown = document.getElementById('tripSpotDropdown');
      if (input) input.value = spotName;
      if (dropdown) dropdown.style.display = 'none';
      triggerHaptic(8);
    };

    function submitNewTripJoin() {
      var spot = document.getElementById('tripInputSpot')?.value.trim();
      var date = document.getElementById('tripInputDate')?.value.trim();
      var maxCap = parseInt(document.getElementById('tripSelectMaxCapacity')?.value, 10) || 4;
      var carpool = document.getElementById('tripInputCarpool')?.value.trim();
      var gearShare = document.getElementById('tripInputGearShare')?.value.trim();
      var chatUrl = document.getElementById('tripInputChatUrl')?.value.trim();
      var desc = document.getElementById('tripInputDesc')?.value.trim();

      if (!spot || !date) {
        showToast('박지와 날짜는 필수 입력 항목입니다.', 'warn');
        return;
      }

      var profile = safeGetJSON('user_profile', null);
      var nick = (profile && profile.nickname) ? profile.nickname : '낭만백패커';
      var userId = (profile && profile.id) ? String(profile.id).trim() : ('user_' + Date.now());
      var photoList = (window.__tempTripCreatePhotos && window.__tempTripCreatePhotos.length > 0) ? window.__tempTripCreatePhotos.slice() : [];
      var tripId = 'trip_' + Date.now();

      if (photoList.length > 0) {
        var savedMap = (typeof window.safeGetStorage === 'function') 
          ? window.safeGetStorage('okbm_trip_photos_map', {}) 
          : safeGetJSON('okbm_trip_photos_map', {});
        savedMap[tripId] = photoList;
        if (typeof window.safeSetStorage === 'function') {
          window.safeSetStorage('okbm_trip_photos_map', savedMap);
        } else if (typeof window.saveToIndexedDB === 'function') {
          window.saveToIndexedDB('okbm_trip_photos_map', savedMap);
        }
      }

      var defaultPhoto = 'https://images.unsplash.com/photo-1510312305653-8ed496efae75?auto=format&fit=crop&w=900&q=80';
      var mainPhoto = (photoList.length > 0) ? photoList[0] : defaultPhoto;

      var pad = function(n) { return String(n).padStart(2, '0'); };
      var d = new Date();
      var timeStr = d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '. ' + pad(d.getHours()) + ':' + pad(d.getMinutes());

      var newTrip = {
        tripId: tripId,
        spotName: spot,
        date: date,
        carpoolInfo: carpool || '',
        maxCapacity: maxCap,
        currentJoined: 1,
        participants: [
          { userId: userId, nickname: nick, isHost: true, joinedAt: Date.now() }
        ],
        gearShare: gearShare || '',
        openChatUrl: chatUrl || 'https://open.kakao.com',
        photo: mainPhoto,
        photos: photoList.length > 0 ? photoList : [defaultPhoto],
        authorName: nick,
        desc: desc || '함께 안전하고 즐거운 클린 백패킹을 떠나요!',
        isActive: 'TRUE',
        createdAt: timeStr
      };

      window.TRIP_JOINS_DATABASE.unshift(newTrip);
      renderHomeTripJoinSlider();

      // 🏛️ [낭만플랜 개인 달력 정식 양식 주입] okbm_plan_spots & okbm_plan_memos 완벽 연동
      var planSpots = safeGetJSON('okbm_plan_spots', {});
      var existingSpots = Array.isArray(planSpots[date]) ? planSpots[date] : (planSpots[date] && planSpots[date].name ? [planSpots[date]] : []);
      existingSpots = existingSpots.filter(function(s) { return !s.tripId || s.tripId !== tripId; });
      existingSpots.push({
        name: spot,
        tripId: tripId,
        isTrip: true,
        isHost: true,
        elevation: ''
      });
      planSpots[date] = existingSpots;
      localStorage.setItem('okbm_plan_spots', JSON.stringify(planSpots));

      var planMemos = safeGetJSON('okbm_plan_memos', {});
      var cleanMemoText = '[낭만 원정대 주최] ' + spot + ' (정원 ' + maxCap + '명) · ' + (carpool || '집결') + (desc ? ('\n' + desc) : '');
      planMemos[date] = planMemos[date] ? (cleanMemoText + '\n---\n' + planMemos[date]) : cleanMemoText;
      localStorage.setItem('okbm_plan_memos', JSON.stringify(planMemos));

      triggerHaptic(15);
      var modal = document.getElementById('tripCreateModal');
      if (modal) modal.remove();

      showToast('원정대 등록 완료! 낭만플랜 달력에 일정이 자동 연동되었습니다.', 'success');

      if (typeof window.syncTripToCloudSheet === 'function') {
        window.syncTripToCloudSheet(newTrip);
      }
      if (typeof syncUserDataToCloud === 'function') {
        syncUserDataToCloud();
      }
      if (typeof window.renderPlanStage === 'function') {
        window.renderPlanStage();
      }
    }

    function joinTripAndOpenPlan(tripId) {
      var token = localStorage.getItem('user_auth_token');
      var rawProfile = localStorage.getItem('user_profile');
      var profile = rawProfile ? JSON.parse(rawProfile) : null;
      if (!token || !profile || !profile.id) {
        triggerHaptic(10);
        var detailModal = document.getElementById('tripDetailSheetModal');
        if (detailModal) detailModal.remove();
        showToast('원정대 참가는 로그인 후 가능합니다.', 'warn');
        if (typeof openLoginModal === 'function') openLoginModal();
        return;
      }
      var trip = (window.TRIP_JOINS_DATABASE || []).find(function(t) { return String(t.tripId) === String(tripId); });
      if (!trip) return;
      var profileData = safeGetJSON('user_profile', null);
      var nick = (profileData && profileData.nickname) ? profileData.nickname : '낭만대원';
      var userId = (profileData && profileData.id) ? String(profileData.id).trim() : ('user_' + Date.now());

      trip.participants = trip.participants || [];
      var exists = trip.participants.some(function(p) { return p.userId === userId || p.nickname === nick; });
      if (!exists) {
        trip.participants.push({ userId: userId, nickname: nick, isHost: false, joinedAt: Date.now() });
        trip.currentJoined = trip.participants.length;
      }

      // 🏛️ [낭만플랜 개인 달력 정식 양식 주입] 참가자 개인 달력에 원정대 일정 0ms 자동 안착
      var planSpots = safeGetJSON('okbm_plan_spots', {});
      var existingSpots = Array.isArray(planSpots[trip.date]) ? planSpots[trip.date] : (planSpots[trip.date] && planSpots[trip.date].name ? [planSpots[trip.date]] : []);
      existingSpots = existingSpots.filter(function(s) { return !s.tripId || s.tripId !== trip.tripId; });
      existingSpots.push({
        name: trip.spotName,
        tripId: trip.tripId,
        isTrip: true,
        isHost: false,
        elevation: ''
      });
      planSpots[trip.date] = existingSpots;
      localStorage.setItem('okbm_plan_spots', JSON.stringify(planSpots));

      var planMemos = safeGetJSON('okbm_plan_memos', {});
      var cleanJoinMemo = '[낭만 원정대 참가] ' + trip.spotName + ' (방장: ' + (trip.authorName || '방장') + ')';
      planMemos[trip.date] = planMemos[trip.date] ? (cleanJoinMemo + '\n---\n' + planMemos[trip.date]) : cleanJoinMemo;
      localStorage.setItem('okbm_plan_memos', JSON.stringify(planMemos));

      var modal = document.getElementById('tripDetailSheetModal');
      if (modal) modal.remove();

      triggerHaptic(15);
      showToast('참가 완료! 낭만플랜 달력에 일정이 등록되었습니다.', 'success');
      renderHomeTripJoinSlider();

      if (typeof window.syncTripToCloudSheet === 'function') {

    // ⚡ 제10헌법 미디어 초경량 압축 규격 (MAX_WIDTH 1200, quality 0.82, 메모리 누수 0%)
    window.processSinglePhotoSmart = function(file) {
      return new Promise(function(resolve) {
        var blobUrl = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function() {
          URL.revokeObjectURL(blobUrl);
          var maxW = 1200;
          var w = img.width;
          var h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.onerror = async function() {
          URL.revokeObjectURL(blobUrl);
          if (typeof heic2any !== 'undefined') {
            try {
              var converted = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.82 });
              var safeBlob = Array.isArray(converted) ? converted[0] : converted;
              var hUrl = URL.createObjectURL(safeBlob);
              var hImg = new Image();
              hImg.onload = function() {
                URL.revokeObjectURL(hUrl);
                var maxW = 1200;
                var hw = hImg.width, hh = hImg.height;
                if (hw > maxW) { hh = Math.round((hh * maxW) / hw); hw = maxW; }
                var cv = document.createElement('canvas');
                cv.width = hw; cv.height = hh;
                cv.getContext('2d').drawImage(hImg, 0, 0, hw, hh);
                resolve(cv.toDataURL('image/jpeg', 0.82));
              };
              hImg.onerror = function() { URL.revokeObjectURL(hUrl); resolve(''); };
              hImg.src = hUrl;
              return;
            } catch (err) {}
          }
          resolve('');
        };
        img.src = blobUrl;
      });
    };

  function initStarlightEngines() {
      var metallicColors = ['#ffffff', '#f8fafc', '#cbd5e1'];
      var makeSubtleDotStar = function(top, left, size, opacity, dur, delay) {
        return '<div style="position:absolute; top:' + top + '%; left:' + left + '%; width:' + size + 'px; height:' + size + 'px; border-radius:50%; background:#ffffff; opacity:' + opacity + '; transform:translateZ(0); will-change:opacity; animation:slowCelestialPulse ' + dur + 's infinite ease-in-out ' + delay + 's;"></div>';
      };
      var makeCrossStar = function(top, left, size, color, dur, delay) {
        return '<svg viewBox="0 0 24 24" style="position:absolute; top:' + top + '%; left:' + left + '%; width:' + size + 'px; height:' + size + 'px; color:' + color + '; fill:currentColor; transform:translateZ(0); will-change:opacity; animation:slowCelestialTwinkle ' + dur + 's infinite ease-in-out ' + delay + 's;"><path d="M12,2 Q12,12 2,12 Q12,12 12,22 Q12,12 22,12 Q12,12 12,2 Z"/><circle cx="12" cy="12" r="1.2" fill="#ffffff"/></svg>';
      };

      var globalLayer = document.getElementById('globalAppMilkyWayLayer');
      if (globalLayer) {
        var html = '';
        for (var i = 0; i < 10; i++) {
          var top = Math.floor(Math.random() * 94) + 3, left = Math.floor(Math.random() * 94) + 3;
          var dur = (Math.random() * 2.0 + 4.5).toFixed(1), delay = (Math.random() * 4).toFixed(1);
          if (i % 4 === 0) html += makeCrossStar(top, left, 3, metallicColors[i % metallicColors.length], dur, delay);
          else html += makeSubtleDotStar(top, left, 1.5, 0.25, dur, delay);
        }

  async function loadPortalSpotData() {
      // ⚡ 로컬 캐시 즉시 인출 (0.001초 지연 없는 렌더링)
      var cachedSpots = safeGetJSON('okbm_spots_cache', []);
      if (Array.isArray(cachedSpots) && cachedSpots.length > 0) {
        registeredSpots = cachedSpots;
        if (typeof renderSecretSpotTrailerRail === 'function') {
          renderSecretSpotTrailerRail();
        }
      }

      // 📁 구글 스프레드시트 정본 시트1 (gid=0) 인출
      var url = 'https://docs.google.com/spreadsheets/d/' + window.GOOGLE_SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + window.GOOGLE_SHEET_MAIN_GID + '&_t=' + Date.now();
      try {
        var res = await fetch(url);
        if (!res.ok) return;
        var csvText = await res.text();
        if (typeof Papa === 'undefined') return;

        Papa.parse(csvText, {
          header: true, skipEmptyLines: true,
          complete: function(results) {
            if (results.data && results.data.length > 0) {
              registeredSpots = results.data.map(function(row) {
                var sMain = (row.spot_main || row.name || row.fullName || row['박지명'] || '').trim();
                var sCity = (row.cityName || row.region || row['지역'] || '전국').trim();
                var sTerrainRaw = row.terrain || row['지형'] || row['지형태그'] || '';
                var tArr = Array.isArray(sTerrainRaw) ? sTerrainRaw : String(sTerrainRaw).split(',').map(function(t) { return t.trim(); }).filter(Boolean);

                return {
                  id: String(row.id || row.spotId || sMain).trim(),
                  name: sMain,
                  spot_main: sMain,
                  fullName: sMain,
                  cityName: sCity,
                  region: sCity,
                  elevation: String(row.elevation || row['고도'] || '').trim(),
                  difficulty: String(row.difficulty || row['난이도'] || '3').trim(),
                  distance: row.distance_km ? (row.distance_km + 'km') : (row.distance || ''),
                  terrain: tArr,
                  desc: (row.desc_summary || row.desc || row['설명'] || '자연 속에서 즐기는 조용한 하룻밤.').trim(),
                  desc_summary: (row.desc_summary || row.desc || row['설명'] || '자연 속에서 즐기는 조용한 하룻밤.').trim(),
                  lat: row.lat || '',
                  lng: row.lng || ''
                };
              }).filter(function(s) { return s.name.length > 0; });

              // 💾 로컬 캐시 즉시 업데이트 & 테마 스팟 레일 자동 갱신
              if (registeredSpots.length > 0) {
                localStorage.setItem('okbm_spots_cache', JSON.stringify(registeredSpots));
                if (typeof renderSecretSpotTrailerRail === 'function') {
                  renderSecretSpotTrailerRail();
                }
              }
            }
          }
        });
      } catch (e) {}
    }

  <script>

    window.modalCloseStack = [];

    window.registerModalOpen = function(modalId, closeFn) {
      window.modalCloseStack = window.modalCloseStack.filter(function(m) { return m.id !== modalId; });
      window.modalCloseStack.push({ id: modalId, close: closeFn });
      if (typeof history !== 'undefined' && history.pushState) {
        history.pushState({ modalOpen: modalId }, '');
      }
    };

    window.unregisterModalClose = function(modalId) {
      window.modalCloseStack = window.modalCloseStack.filter(function(m) { return m.id !== modalId; });
    };

    window.closeTopmostModal = function() {
      if (window.modalCloseStack && window.modalCloseStack.length > 0) {
        var top = window.modalCloseStack.pop();
        if (top && typeof top.close === 'function') {
          top.close();
          return true;
        }
      }
      return false;
    };

    (function initEdgeSwipeDismiss() {
      var touchStartX = 0, touchStartY = 0, isEdgeTracking = false;

      document.addEventListener('touchstart', function(e) {
        if (!window.modalCloseStack || window.modalCloseStack.length === 0) return;
        if (!e.touches || e.touches.length !== 1) return;
        var x = e.touches[0].clientX;
        if (x <= 30) {
          touchStartX = x;
          touchStartY = e.touches[0].clientY;
          isEdgeTracking = true;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!isEdgeTracking || !e.touches || e.touches.length !== 1) return;
        var diffX = e.touches[0].clientX - touchStartX;
        var diffY = Math.abs(e.touches[0].clientY - touchStartY);
        if (diffX > 60 && diffX > diffY * 1.5) {
          isEdgeTracking = false;
          triggerHaptic(12);
          window.closeTopmostModal();
        }
      }, { passive: true });

      document.addEventListener('touchend', function() { isEdgeTracking = false; }, { passive: true });
      document.addEventListener('touchcancel', function() { isEdgeTracking = false; }, { passive: true });
    })();

    window.addEventListener('popstate', function() {
      if (window.modalCloseStack.length > 0) {
        window.closeTopmostModal();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      var wrapModal = function(openName, closeName, modalId) {
        var origOpen = window[openName];
        var origClose = window[closeName];
        if (typeof origOpen === 'function') {
          window[openName] = function() {
            var res = origOpen.apply(this, arguments);
            window.registerModalOpen(modalId, origClose);
            return res;
          };
        }
        if (typeof origClose === 'function') {
          window[closeName] = function() {
            window.unregisterModalClose(modalId);
            return origClose.apply(this, arguments);
          };
        }
      };

  wrapModal('openPlanModal', 'closePlanModal', 'romanticPlanModal');
      wrapModal('openHistoryModal', 'closeHistoryModal', 'romanticHistoryModal');
      wrapModal('openUserProfileModal', 'closeUserProfileModal', 'userProfileModalOverlay');
      wrapModal('openGearPresetModal', 'closeGearPresetModal', 'gearPresetModal');
      wrapModal('openPackShareModal', 'closePackShareModal', 'packShareModalOverlay');
      wrapModal('openPhotoStudio', 'closePhotoStudio', 'photoStudioOverlay');
      wrapModal('openVideoDetailModal', 'closeVideoDetailModal', 'videoDetailModal');

  

      if (window.Capacitor && window.Capacitor.Plugins) {
        var App = window.Capacitor.Plugins.App;
        if (App) {
          var lastBackTime = 0;
          App.addListener('backButton', function(data) {
            if (window.closeTopmostModal()) return;

            if (window.history.length > 1 && data.canGoBack) {
              window.history.back();
              return;
            }

            var currentTime = Date.now();
            if (currentTime - lastBackTime < 2000) {
              App.exitApp();
            } else {
              lastBackTime = currentTime;
              showToast("'뒤로' 버튼을 한 번 더 누르면 앱이 종료됩니다.", 2000);
            }
          });
        }
      }
    });
  </script>
