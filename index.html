      document.querySelectorAll('.btn-edit').forEach(btn => btn.style.display = isAdminMode ? 'block' : 'none');
      document.querySelectorAll('.btn-quick-add').forEach(btn => btn.style.display = isAdminMode ? 'inline-block' : 'none');
      document.getElementById('adminDataTools').style.display = isAdminMode ? 'flex' : 'none';
      
      const sheetLink = document.getElementById('sheetEditLink');
      if (sheetLink) sheetLink.style.display = isAdminMode ? 'inline-flex' : 'none';

      const syncBtn = document.getElementById('btnSyncSheet');
      if (syncBtn) syncBtn.style.display = isAdminMode ? 'inline-block' : 'none';
    }

    function cleanYouTubeUrl(url) {
      if (!url) return '';
      const match = url.match(/^.*(?:youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      if (match && match[1].length === 11) return `https://www.youtube.com/watch?v=${match[1]}`;
      return url;
    }

    function getMediaLinksHtml(spot) {
      let html = '<div class="spot-action-line">';
      
      const ytList = spot.youtubeUrls || (spot.youtubeUrl ? [spot.youtubeUrl] : []);
      ytList.slice(0, 2).forEach((url, i) => {
        if (url && url.trim()) {
          html += `<a href="${cleanYouTubeUrl(url.trim())}" target="_blank" rel="noopener noreferrer" class="link-btn btn-yt" onclick="event.stopPropagation();">▶ 영상${ytList.length > 1 ? i + 1 : ''}</a>`;
        }
      });
      
      if (spot.blogUrl && spot.blogUrl.trim()) {
        html += `<a href="${spot.blogUrl.trim()}" target="_blank" rel="noopener noreferrer" class="link-btn btn-blog" onclick="event.stopPropagation();">📝 블로그</a>`;
      }
      
      const instaUser = spot.instaId && spot.instaId.trim() ? spot.instaId.trim() : "oklionnature";
      const cleanUser = instaUser.replace('@', '').replace(/https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
      
      const instaIconSvg = `<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`;

      html += `
        <a href="https://instagram.com/${cleanUser}" target="_blank" rel="noopener noreferrer" class="link-btn btn-insta" onclick="event.stopPropagation();" title="등록자 인스타그램 (@${cleanUser})">
          ${instaIconSvg}등록자
        </a>
      `;

      const check = autoDetectDroneStatus(spot.lat, spot.lng);
      const droneTag = getDroneBadgeHtml(check.status, check.reason);
      html += droneTag;

      html += '</div>';
      return html;
    }

    function getSpotRatingMeta(spotId) {
      const cList = spotComments[spotId] || [];
      if (cList.length === 0) return null;
      const validRatings = cList.map(c => parseInt(c.rating) || 5);
      const avg = (validRatings.reduce((a, b) => a + b, 0) / validRatings.length).toFixed(1);
      return { avg, count: cList.length };
    }

    function getMetaBadgesHtml(spot) {
      let html = '<div class="spot-meta-badges">';
      if (spot.terrain && spot.terrain.length > 0) {
        spot.terrain.forEach(t => {
          if (t.includes('데크') || t.includes('활공장')) html += `<span class="meta-tag tag-terrain-deck">🪵 데크</span>`;
          else if (t.includes('돌박지') || t.includes('바위') || t.includes('돌')) html += `<span class="meta-tag tag-terrain-rock">🪨 돌박지</span>`;
          else if (t.includes('노지') || t.includes('땅')) html += `<span class="meta-tag tag-terrain-soil">🏕️ 노지</span>`;
          else if (t.includes('섬') || t.includes('해변') || t.includes('바다')) html += `<span class="meta-tag tag-terrain-island">🏝️ 섬</span>`;
          else if (t.includes('계곡') || t.includes('물가') || t.includes('강변')) html += `<span class="meta-tag tag-terrain-valley">🌊 계곡</span>`;
          else if (t.includes('동굴') || t.includes('굴')) html += `<span class="meta-tag tag-terrain-cave">🦇 동굴</span>`;
          else if (t.includes('기타')) html += `<span class="meta-tag tag-terrain-etc">✨ 기타</span>`;
        });
      }
      const diffStars = '⭐'.repeat(parseInt(spot.difficulty) || 3);
      html += `<span class="meta-tag tag-diff">난이도 ${diffStars}</span>`;
      if (spot.distance && String(spot.distance).trim()) {
        html += `<span class="meta-tag tag-dist">🚶 거리: ${String(spot.distance).trim().replace(/km$/i, '')}km</span>`;
      }
      const rMeta = getSpotRatingMeta(spot.id);
      if (rMeta) {
        html += `<span class="meta-tag tag-rating">★ ${rMeta.avg} (${rMeta.count})</span>`;
      }
      html += '</div>';
      return html;
    }

    function getCommentsHtml(spotId) {
      const cList = spotComments[spotId] || [];
      let listHtml = '';
      if (cList.length === 0) {
        listHtml = '<li style="color:#94a3b8; font-size:0.68rem;">첫 평점과 후기를 남겨보세요!</li>';
      } else {
        cList.forEach((c) => {
          const stars = '★'.repeat(parseInt(c.rating) || 5);
          listHtml += `
            <li class="comment-item">
              <div style="flex:1;">
                <span class="comment-author">${c.author}</span>
                <span class="comment-rating-stars">${stars}</span>: 
                <span class="comment-text">${c.text}</span>
              </div>
            </li>
          `;
        });
      }

      return `
        <div class="comments-section" id="commentSection_${spotId}" onclick="event.stopPropagation();">
          <div class="comments-title">
            <span>💬 방문 후기 (${cList.length})</span>
          </div>
          <ul class="comments-list" id="commentList_${spotId}">${listHtml}</ul>
          <div class="comment-form">
            <div class="comment-form-row">
              <select class="comment-select-rating" id="cRating_${spotId}">
                <option value="5" selected>⭐ 5점 (최고)</option>
                <option value="4">⭐ 4점 (좋음)</option>
                <option value="3">⭐ 3점 (보통)</option>
                <option value="2">⭐ 2점 (아쉬움)</option>
                <option value="1">⭐ 1점 (비추)</option>
              </select>
              <input type="text" class="comment-input-author" id="cAuthor_${spotId}" placeholder="닉네임" />
            </div>
            <div class="comment-form-row">
              <input type="text" class="comment-input-text" id="cText_${spotId}" placeholder="후기 작성..." onkeyup="if(event.keyCode===13) addComment('${spotId}')" />
              <button type="button" class="comment-btn-submit" id="cBtnSubmit_${spotId}" onclick="addComment('${spotId}')">등록</button>
            </div>
          </div>
        </div>
      `;
    }

    let isCommentSubmitting = false;

    async function addComment(spotId) {
      if (isCommentSubmitting) return;

      const authorEl = document.getElementById(`cAuthor_${spotId}`);
      const textEl = document.getElementById(`cText_${spotId}`);
      const ratingEl = document.getElementById(`cRating_${spotId}`);
      const submitBtn = document.getElementById(`cBtnSubmit_${spotId}`);

      if (!textEl) return;
      const text = textEl.value.trim();
      if (!text) return alert('후기 내용을 입력해주세요.');

      const author = (authorEl && authorEl.value.trim()) ? authorEl.value.trim() : '백패커';
      const rating = ratingEl ? parseInt(ratingEl.value) : 5;

      isCommentSubmitting = true;
      if (submitBtn) submitBtn.disabled = true;

      const newComment = {
        author: author,
        text: text,
        rating: rating,
        date: new Date().toLocaleDateString()
      };

      if (!spotComments[spotId]) spotComments[spotId] = [];
      spotComments[spotId].push(newComment);
      localStorage.setItem('okbm_comments', JSON.stringify(spotComments));

      const targetSpot = spots.find(s => String(s.id) === String(spotId));
      if (targetSpot) {
        const markerIdx = spots.findIndex(s => String(s.id) === String(spotId));
        const marker = currentMarkers[markerIdx];
        infoWindow.setContent(generateInfoWindowHtml(targetSpot));
        if (marker) infoWindow.open(map, marker);
      }
      renderSpots();

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'ADD_COMMENT',
            spotId: spotId,
            comment: newComment
          })
        });
      } catch (err) {
        console.warn('댓글 서버 전송 실패:', err);
      }

      setTimeout(() => {
        isCommentSubmitting = false;
        const newBtn = document.getElementById(`cBtnSubmit_${spotId}`);
        if (newBtn) newBtn.disabled = false;
      }, 300);
    }

    function generateInfoWindowHtml(spot) {
      const metaBadgesHtml = getMetaBadgesHtml(spot);
      const mediaLinksHtml = getMediaLinksHtml(spot);
      const commentsHtml = getCommentsHtml(spot.id);
      const statusBadges = getSpotStatusBadges(spot);
      
      const cleanAddress = (spot.entryPoint || spot.name).replace(/\n/g, ' ').trim();
      const naverMapSearchUrl = `https://map.naver.com/v5/search/${encodeURIComponent(cleanAddress)}`;

      return `
        <div class="compact-info-window" style="position: relative; padding-right: 18px;">
          <div class="compact-title">
            <span>${spot.name}</span>
            ${spot.elevation ? '<span style="font-size:0.75rem; color:#15803d;">(' + spot.elevation + ')</span>' : ''}
            ${statusBadges}
          </div>
          <button type="button" onclick="infoWindow.close()" style="position: absolute; top: 6px; right: 6px; background: #e2e8f0; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; cursor: pointer; font-weight: bold; color: #334155;">✕</button>
          ${metaBadgesHtml}
          <div class="spot-coords-text">📍 ${spot.lat}, ${spot.lng}</div>
          <a href="${naverMapSearchUrl}" target="_blank" rel="noopener noreferrer" class="compact-entry-link" title="클릭 시 네이버 지도로 이동">🚗 들머리: ${spot.entryPoint} ↗</a>
          <div class="compact-desc">📝 특징:\n${spot.desc}</div>
          ${mediaLinksHtml}
          ${commentsHtml}
        </div>
      `;
    }

    function incrementSpotCount(spotId, name) {
      const target = spots.find(s => String(s.id) === String(spotId) || s.name === name);
      const keyById = `okbm_views_${spotId}`;
      const keyByName = `okbm_views_${name}`;
      
      let views = parseInt(localStorage.getItem(keyById)) || parseInt(localStorage.getItem(keyByName)) || (target ? (target.searchCount || 0) : 0);
      views += 1;
      
      localStorage.setItem(keyById, views);
      localStorage.setItem(keyByName, views);
      
      if (target) {
        target.searchCount = views;
      }
    }

    function showTopRankings() {
      const inputVal = document.getElementById('topSearchInput').value.trim();
      if (inputVal) return;
      const dropdown = document.getElementById('searchDropdown');
      dropdown.innerHTML = '<div class="dropdown-header"><span>🔥 실시간 인기 박지 TOP 5</span><span>클릭/조회수 순</span></div>';
      dropdown.style.display = 'block';

      const sorted = [...spots].sort((a, b) => {
        const countA = a.searchCount || parseInt(localStorage.getItem(`okbm_views_${a.id}`)) || parseInt(localStorage.getItem(`okbm_views_${a.name}`)) || 0;
        const countB = b.searchCount || parseInt(localStorage.getItem(`okbm_views_${b.id}`)) || parseInt(localStorage.getItem(`okbm_views_${b.name}`)) || 0;
        return countB - countA;
      }).slice(0, 5);

      sorted.forEach((item, idx) => {
        const currentCount = item.searchCount || parseInt(localStorage.getItem(`okbm_views_${item.id}`)) || parseInt(localStorage.getItem(`okbm_views_${item.name}`)) || 0;
        const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-etc';
        const li = document.createElement('li');
        li.className = 'dropdown-item';
        li.innerHTML = `
          <div class="top-rank-row">
            <div class="top-rank-left">
              <span class="rank-badge ${rankClass}">${idx + 1}</span>
              <span class="top-spot-title">${item.name}</span>
              <span class="top-spot-city">📍 ${item.cityName || '대한민국'}</span>
            </div>
            <div class="top-spot-views">${currentCount}회</div>
          </div>
        `;
        li.addEventListener('click', () => {
          incrementSpotCount(item.id, item.name);
          centerMapOnSpot(item.lat, item.lng);
          const targetMarker = currentMarkers[spots.findIndex(s => String(s.id) === String(item.id))];
          infoWindow.setContent(generateInfoWindowHtml(item));
          infoWindow.open(map, targetMarker || new naver.maps.LatLng(item.lat, item.lng));
          dropdown.style.display = 'none';
        });
        dropdown.appendChild(li);
      });
    }

    function handleSearchInput(e) {
      if (e.keyCode === 13) executeSearch();
      else if (!e.target.value.trim()) showTopRankings();
    }

    // =========================================================================
    // 📋 [박지 목록 렌더링 & 마커 호버 이벤트 추가]
    // =========================================================================
    function renderSpots(forceOpenRegion = null) {
      const openedRegions = new Set();
      document.querySelectorAll('.region-group').forEach(group => {
        const titleEl = group.querySelector('.region-group-title span:first-child');
        const containerEl = group.querySelector('.region-items-container');
        if (titleEl && containerEl && containerEl.style.display !== 'none') {
          openedRegions.add(titleEl.innerText.replace('📌', '').trim());
        }
      });
      if (forceOpenRegion) {
        openedRegions.add(forceOpenRegion);
      }

      currentMarkers.forEach(m => m.setMap(null));
      currentMarkers = [];

      const spotListEl = document.getElementById('spotList');
      spotListEl.innerHTML = '';

      const targetOrder = ["서울/인천", "경기", "강원", "충청", "전라", "경상", "제주"];
      const grouped = {};
      targetOrder.forEach(r => grouped[r] = []);

      spots.sort((a, b) => a.name.localeCompare(b.name, 'ko'));

      let visibleCount = 0;

      spots.forEach((spot) => {
        if (!spot.region || !spot.cityName) {
          const res = detectRegionAndCity(spot.lat, spot.lng, spot.name, spot.entryPoint);
          if (!spot.region) spot.region = res.region;
          if (!spot.cityName) spot.cityName = res.cityName;
        }

        if (currentTerrainFilter !== 'ALL') {
          const tList = spot.terrain || [];
          const matched = tList.some(t => {
            if (currentTerrainFilter === '데크') return t.includes('데크') || t.includes('활공장');
            if (currentTerrainFilter === '돌박지') return t.includes('돌박지') || t.includes('바위') || t.includes('돌');
            if (currentTerrainFilter === '노지') return t.includes('노지') || t.includes('땅');
            if (currentTerrainFilter === '섬') return t.includes('섬') || t.includes('해변') || t.includes('바다');
            if (currentTerrainFilter === '계곡') return t.includes('계곡') || t.includes('물가') || t.includes('강변');
            if (currentTerrainFilter === '동굴') return t.includes('동굴') || t.includes('굴');
            return t.includes(currentTerrainFilter);
          });
          if (!matched) return;
        }

        const r = spot.region || '경기';
        if (!grouped[r]) grouped[r] = [];
        grouped[r].push(spot);
        visibleCount++;
      });

      document.getElementById('spotCount').innerText = `${visibleCount}개`;

      targetOrder.forEach(regionKey => {
        const items = grouped[regionKey];
        if (!items || items.length === 0) return;
        if (currentRegionFilter !== 'ALL' && currentRegionFilter !== regionKey) return;

        const shouldBeOpen = (currentRegionFilter === regionKey) || (currentTerrainFilter !== 'ALL') || openedRegions.has(regionKey);

        const groupDiv = document.createElement('div');
        groupDiv.className = 'region-group';

        const groupTitle = document.createElement('div');
        groupTitle.className = 'region-group-title';
        groupTitle.innerHTML = `<span>📌 ${regionKey}</span><span style="color:#64748b; font-size:0.75rem;">${items.length}개 ${shouldBeOpen ? '<b style="color:#0f766e;">▼</b>' : '▶'}</span>`;
        if (shouldBeOpen) groupTitle.style.borderLeftColor = '#0f766e';

        const groupItemsContainer = document.createElement('div');
        groupItemsContainer.className = 'region-items-container';
        groupItemsContainer.style.display = shouldBeOpen ? 'block' : 'none';

        groupTitle.addEventListener('click', () => {
          const isClosed = groupItemsContainer.style.display === 'none';
          groupItemsContainer.style.display = isClosed ? 'block' : 'none';
          groupTitle.querySelector('span:last-child').innerHTML = `${items.length}개 ${isClosed ? '<b style="color:#0f766e;">▼</b>' : '▶'}`;
          groupTitle.style.borderLeftColor = isClosed ? '#0f766e' : 'transparent';
        });

        items.forEach((spot) => {
          const position = new naver.maps.LatLng(spot.lat, spot.lng);
          
          const markerIcon = createCustomMarkerIcon(spot.difficulty);
          const marker = new naver.maps.Marker({
            position: position,
            map: map,
            title: spot.name,
            icon: markerIcon,
            draggable: isAdminMode
          });
          currentMarkers.push(marker);

          // ⭐ 지도상 마커 호버 시 박지 이름 툴팁 즉각 표시
          naver.maps.Event.addListener(marker, 'mouseover', function(e) {
            const diffStars = '⭐'.repeat(parseInt(spot.difficulty) || 3);
            const content = `
              <div style="padding: 5px 9px; color: #f8fafc; font-size: 0.74rem; line-height: 1.25; white-space: nowrap; pointer-events: none; text-align: center;">
                <strong style="color: #38bdf8; font-size: 0.8rem;">📍 ${spot.name}</strong>
                ${spot.elevation ? `<span style="color: #86efac; font-size: 0.7rem;">(${spot.elevation})</span>` : ''}<br>
                <span style="color: #cbd5e1; font-size: 0.68rem;">난이도 ${diffStars}</span>
              </div>
            `;
            markerHoverInfoWindow.setContent(content);
            markerHoverInfoWindow.open(map, marker);
          });

          naver.maps.Event.addListener(marker, 'mouseout', function() {
            markerHoverInfoWindow.close();
          });

          naver.maps.Event.addListener(marker, 'dragend', function() {
            if (!isAdminMode) return;
            const movedLatLng = marker.getPosition();
            const newLat = parseFloat(movedLatLng.lat().toFixed(6));
            const newLng = parseFloat(movedLatLng.lng().toFixed(6));

            const dragConfirmHtml = `
              <div class="compact-info-window" style="position: relative; padding-right: 18px;">
                <div class="compact-title" style="color:#0f766e;">📍 '${spot.name}' 위치 이동</div>
                <button type="button" onclick="infoWindow.close()" style="position: absolute; top: 6px; right: 6px; background: #e2e8f0; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; cursor: pointer; font-weight: bold; color: #334155;">✕</button>
                <div style="font-size:0.72rem; color:#ef4444; font-weight:bold;">새 좌표로 위치를 변경하시겠습니까?</div>
                <div class="spot-coords-text">위도: ${newLat}<br>경도: ${newLng}</div>
                <button type="button" class="btn-save-location" onclick="saveUpdatedLocation('${spot.id}', ${newLat}, ${newLng})">💾 이 위치로 즉시 저장</button>
              </div>
            `;
            infoWindow.setContent(dragConfirmHtml);
            infoWindow.open(map, marker);
          });

          const metaBadgesHtml = getMetaBadgesHtml(spot);
          const mediaLinksHtml = getMediaLinksHtml(spot);
          const statusBadges = getSpotStatusBadges(spot);

          naver.maps.Event.addListener(marker, 'click', () => {
            markerHoverInfoWindow.close();
            incrementSpotCount(spot.id, spot.name);
            centerMapOnSpot(spot.lat, spot.lng);
            infoWindow.setContent(generateInfoWindowHtml(spot));
            infoWindow.open(map, marker);
          });

          const firstLineDesc = (spot.desc || '').split('\n')[0].trim();

          const li = document.createElement('div');
          li.className = 'spot-item';
          li.innerHTML = `
            <div class="spot-header-row">
              <div class="spot-name-wrapper">
                <span class="spot-name">${spot.name}</span>
                ${spot.elevation ? `<span style="font-size:0.74rem; color:#15803d; font-weight:normal;">(${spot.elevation})</span>` : ''}
                ${statusBadges}
              </div>
            </div>
            ${metaBadgesHtml}
            ${firstLineDesc ? `<div class="spot-desc-single" title="${spot.desc}">📝 ${firstLineDesc}</div>` : ''}
            ${mediaLinksHtml}
            <div class="spot-action-btns">
              <button class="btn-edit" onclick="editSpotById(event, '${spot.id}')">수정</button>
              <button class="btn-del" onclick="deleteSpotById(event, '${spot.id}')">삭제</button>
            </div>
          `;

          li.addEventListener('click', () => {
            incrementSpotCount(spot.id, spot.name);
            
            if (window.innerWidth <= 768) {
              const sidebar = document.getElementById('sidebar');
              const btn = document.getElementById('bottomToggleBtn');
              isSidebarCollapsed = true;
              sidebar.classList.add('collapsed');
              btn.innerText = '▲ 박지 목록 열기';
            }

            centerMapOnSpot(spot.lat, spot.lng);
            infoWindow.setContent(generateInfoWindowHtml(spot));
            infoWindow.open(map, marker);
          });

          groupItemsContainer.appendChild(li);
        });

        groupDiv.appendChild(groupTitle);
        groupDiv.appendChild(groupItemsContainer);
        spotListEl.appendChild(groupDiv);
      });

      updateAdminUI();
    }

    function editSpotById(event, spotId) {
      event.stopPropagation();
      const idx = spots.findIndex(s => String(s.id) === String(spotId));
      if (idx !== -1) openEditModal(idx);
    }

    function deleteSpotById(event, spotId) {
      event.stopPropagation();
      const idx = spots.findIndex(s => String(s.id) === String(spotId));
      if (idx !== -1) deleteSpot(event, idx);
    }

    async function executeSearch() {
      const query = document.getElementById('topSearchInput').value.trim();
      if (!query) return;
      const dropdown = document.getElementById('searchDropdown');
      dropdown.innerHTML = '<li class="dropdown-item" style="color:#64748b;">🔍 산/계곡/관광지 검색 중...</li>';
      dropdown.style.display = 'block';

      let results = [];
      const seenCoords = new Set();

      const internalMatches = spots.filter(s => 
        s.name.toLowerCase().includes(query.toLowerCase()) || 
        (s.desc && s.desc.toLowerCase().includes(query.toLowerCase())) ||
        (s.entryPoint && s.entryPoint.toLowerCase().includes(query.toLowerCase()))
      );

      internalMatches.forEach(spot => {
        const key = `${spot.lat.toFixed(4)},${spot.lng.toFixed(4)}`;
        seenCoords.add(key);
        results.push({
          title: `[등록박지] ${spot.name}`,
          sub: spot.entryPoint,
          lat: spot.lat,
          lng: spot.lng,
          isInternal: true,
          spotObj: spot
        });
      });

      naver.maps.Service.geocode({ query: query }, async function(status, response) {
        if (status === naver.maps.Service.Status.OK && response.v2.addresses.length > 0) {
          response.v2.addresses.forEach(item => {
            const lat = parseFloat(item.y);
            const lng = parseFloat(item.x);
            const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
            if (!seenCoords.has(key)) {
              seenCoords.add(key);
              results.push({ 
                title: item.roadAddress || item.jibunAddress, 
                sub: '도로명/지번 주소',
                lat: lat.toFixed(6), 
                lng: lng.toFixed(6) 
              });
            }
          });
        }

        try {
          const poiRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=kr&limit=5&accept-language=ko,ko-KR`);
          const poiData = await poiRes.json();
          if (poiData && poiData.length > 0) {
            poiData.forEach(item => {
              const lat = parseFloat(item.lat);
              const lng = parseFloat(item.lon);
              const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
              if (!seenCoords.has(key)) {
                seenCoords.add(key);
                const cleanSub = formatKoreanSubAddress(item.display_name.split(',').slice(1, 3).join(' ').trim(), lat, lng);
                results.push({
                  title: item.display_name.split(',')[0],
                  sub: cleanSub,
                  lat: lat.toFixed(6),
                  lng: lng.toFixed(6)
                });
              }
            });
          }
        } catch (e) {}

        try {
          const pRes = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=4&lang=default`);
          const pData = await pRes.json();
          if (pData && pData.features) {
            pData.features.forEach(f => {
              const coords = f.geometry.coordinates;
              const lat = coords[1];
              const lng = coords[0];
              const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
              if (!seenCoords.has(key)) {
                seenCoords.add(key);
                const rawSub = [f.properties.state, f.properties.city, f.properties.district].filter(Boolean).join(' ');
                const cleanSub = formatKoreanSubAddress(rawSub, lat, lng);
                results.push({
                  title: f.properties.name || query,
                  sub: cleanSub || '자연지형/명소',
                  lat: lat.toFixed(6),
                  lng: lng.toFixed(6)
                });
              }
            });
          }
        } catch (e) {}

        renderSearchResults(results);
      });
    }

    function renderSearchResults(results) {
      const dropdown = document.getElementById('searchDropdown');
      dropdown.innerHTML = '<div class="dropdown-header"><span>🔍 검색 결과</span><span>' + results.length + '건</span></div>';
      if (results.length === 0) {
        dropdown.innerHTML += '<li class="dropdown-item" style="color:#ef4444;">검색 결과가 없습니다. 산/계곡/관광지 이름이나 주소를 더 자세히 입력해보세요.</li>';
        return;
      }

      results.forEach(item => {
        const check = autoDetectDroneStatus(parseFloat(item.lat), parseFloat(item.lng));
        const autoDroneTag = getDroneBadgeHtml(check.status, check.reason);
        const li = document.createElement('li');
        li.className = 'dropdown-item';
        li.innerHTML = `
          <div class="dropdown-info">
            <div><strong style="color:${item.isInternal ? '#0f766e' : '#1e293b'};">${item.title}</strong> ${item.sub ? `<span style="font-size:0.75rem; color:#64748b;">(${item.sub})</span>` : ''}</div>
            <div style="margin-top:4px;">${autoDroneTag}</div>
          </div>
          <button type="button" class="btn-quick-add" style="display:${isAdminMode && !item.isInternal ? 'inline-block' : 'none'};">➕ 등록</button>
        `;
        li.querySelector('.dropdown-info').addEventListener('click', () => {
          centerMapOnSpot(parseFloat(item.lat), parseFloat(item.lng));
          if (tempSearchMarker) tempSearchMarker.setMap(null);

          if (item.isInternal && item.spotObj) {
            incrementSpotCount(item.spotObj.id, item.spotObj.name);
            const markerIdx = spots.findIndex(s => String(s.id) === String(item.spotObj.id));
            infoWindow.setContent(generateInfoWindowHtml(item.spotObj));
            infoWindow.open(map, currentMarkers[markerIdx]);
          } else {
            tempSearchMarker = new naver.maps.Marker({ 
              position: new naver.maps.LatLng(item.lat, item.lng), 
              map: map, 
              animation: naver.maps.Animation.DROP 
            });
          }
          dropdown.style.display = 'none';
        });

        if (isAdminMode && !item.isInternal) {
          li.querySelector('.btn-quick-add').addEventListener('click', (e) => {
            e.stopPropagation();
            openAddModal(item.title, item.lat, item.lng, check.status, item.title);
            dropdown.style.display = 'none';
          });
        }
        dropdown.appendChild(li);
      });
    }

    async function openAddModal(defaultName, lat, lng, droneStatus, address) {
      modalMode = 'ADD';
      modalPendingData = { lat: parseFloat(lat), lng: parseFloat(lng), droneStatus: droneStatus, address: address || '' };
      document.getElementById('modalTitle').innerText = '📍 새 박지 등록';
      document.getElementById('modalInputName').value = defaultName || '';
      document.getElementById('modalInputEntry').value = address || '';
      document.getElementById('modalInputDesc').value = '추천 백패킹 박지';
      document.getElementById('modalInputYoutube').value = '';
      document.getElementById('modalInputBlog').value = '';
      document.getElementById('modalInputInsta').value = 'oklionnature';
      document.getElementById('modalInputDistance').value = '';
      
      document.getElementById('chkDeck').checked = true;
      document.getElementById('chkRock').checked = false;
      document.getElementById('chkSoil').checked = false;
      document.getElementById('chkIsland').checked = false;
      document.getElementById('chkValley').checked = false;
      document.getElementById('chkCave').checked = false;
      document.getElementById('chkEtc').checked = false;

      document.getElementById('modalSelectDiff').value = '3';
      document.getElementById('customModalOverlay').style.display = 'flex';
      const elev = await getElevation(lat, lng);
      document.getElementById('modalInputElevation').value = elev;
      setTimeout(() => document.getElementById('modalInputName').focus(), 50);
    }

    function openEditModal(index) {
      modalMode = 'EDIT';
      modalEditIndex = index;
      const target = spots[index];
      document.getElementById('modalTitle').innerText = `✏️ '${target.name}' 수정`;
      document.getElementById('modalInputName').value = target.name;
      document.getElementById('modalInputElevation').value = target.elevation || '';
      document.getElementById('modalInputEntry').value = target.entryPoint || '';
      document.getElementById('modalInputDesc').value = target.desc;
      document.getElementById('modalInputDistance').value = target.distance || '';
      const ytList = Array.isArray(target.youtubeUrls) ? target.youtubeUrls : (target.youtubeUrl ? [target.youtubeUrl] : []);
      document.getElementById('modalInputYoutube').value = ytList.join('\n');
      document.getElementById('modalInputBlog').value = target.blogUrl || '';
      document.getElementById('modalInputInsta').value = target.instaId || 'oklionnature';
      
      const tList = target.terrain || [];
      document.getElementById('chkDeck').checked = tList.includes('데크') || tList.includes('활공장');
      document.getElementById('chkRock').checked = tList.includes('돌박지') || tList.includes('바위') || tList.includes('돌');
      document.getElementById('chkSoil').checked = tList.includes('노지') || tList.includes('땅');
      document.getElementById('chkIsland').checked = tList.includes('섬') || tList.includes('해변') || tList.includes('바다');
      document.getElementById('chkValley').checked = tList.includes('계곡') || tList.includes('물가') || tList.includes('강변');
      document.getElementById('chkCave').checked = tList.includes('동굴') || tList.includes('굴');
      document.getElementById('chkEtc').checked = tList.includes('기타');

      document.getElementById('modalSelectDiff').value = target.difficulty || '3';
      document.getElementById('customModalOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('modalInputName').focus(), 50);
    }

    function closeCustomModal() {
      document.getElementById('customModalOverlay').style.display = 'none';
    }

    async function saveCustomModal() {
      const name = document.getElementById('modalInputName').value.trim();
      const elevation = document.getElementById('modalInputElevation').value.trim();
      const entryPoint = document.getElementById('modalInputEntry').value.trim() || '들머리 정보 미입력';
      const desc = document.getElementById('modalInputDesc').value.trim() || '추천 백패킹 박지';
      const distance = document.getElementById('modalInputDistance').value.trim();
      const rawYt = document.getElementById('modalInputYoutube').value.trim();
      const youtubeUrls = rawYt ? rawYt.split('\n').map(u => u.trim()).filter(u => u).slice(0, 3) : [];
      const blogUrl = document.getElementById('modalInputBlog').value.trim();
      const instaId = document.getElementById('modalInputInsta').value.trim() || 'oklionnature';

      const terrain = [];
      if (document.getElementById('chkDeck').checked) terrain.push('데크');
      if (document.getElementById('chkRock').checked) terrain.push('돌박지');
      if (document.getElementById('chkSoil').checked) terrain.push('노지');
      if (document.getElementById('chkIsland').checked) terrain.push('섬');
      if (document.getElementById('chkValley').checked) terrain.push('계곡');
      if (document.getElementById('chkCave').checked) terrain.push('동굴');
      if (document.getElementById('chkEtc').checked) terrain.push('기타');

      const difficulty = document.getElementById('modalSelectDiff').value;
      if (!name) return alert('산(박지) 이름을 입력해주세요.');

      if (modalMode === 'ADD') {
        const res = detectRegionAndCity(modalPendingData.lat, modalPendingData.lng, name, entryPoint);
        const newSpotId = String(Date.now());
        const nowTimestamp = Date.now();

        newlyAddedSpotMeta[newSpotId] = nowTimestamp;
        localStorage.setItem('okbm_new_spot_meta', JSON.stringify(newlyAddedSpotMeta));

        const newSpot = {
          id: newSpotId,
          name, elevation, entryPoint,
          lat: modalPendingData.lat, lng: modalPendingData.lng,
          region: res.region, cityName: res.cityName,
          desc, distance, youtubeUrls, blogUrl, instaId,
          terrain: terrain.length > 0 ? terrain : ['데크'],
          difficulty, droneStatus: modalPendingData.droneStatus,
          searchCount: 1,
          createdAt: nowTimestamp
        };
        spots.unshift(newSpot);
        renderSpots(newSpot.region);
        centerMapOnSpot(newSpot.lat, newSpot.lng);

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'ADD', spot: newSpot })
          });
          alert(`✅ '${newSpot.name}' 박지가 구글 시트에 등록되었습니다! (3일간 NEW! 표시 활성화)`);
        } catch (err) {
          console.warn('구글 시트 저장 통신 실패:', err);
        }

      } else if (modalMode === 'EDIT') {
        const target = spots[modalEditIndex];
        const res = detectRegionAndCity(target.lat, target.lng, name, entryPoint);
        target.name = name;
        target.elevation = elevation;
        target.entryPoint = entryPoint;
        target.desc = desc;
        target.distance = distance;
        target.youtubeUrls = youtubeUrls;
        target.blogUrl = blogUrl;
        target.instaId = instaId;
        target.terrain = terrain.length > 0 ? terrain : ['데크'];
        target.difficulty = difficulty;
        target.region = res.region;
        target.cityName = res.cityName;

        renderSpots(target.region);

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ 
              action: 'UPDATE', 
              id: target.id, 
              spot: target 
            })
          });
          alert(`✅ '${target.name}'의 수정사항이 구글 시트에 완벽히 반영되었습니다.`);
        } catch (err) {
          console.warn('구글 시트 수정 전송 실패:', err);
        }
      }
      closeCustomModal();
    }

    naver.maps.Event.addListener(map, 'click', function(e) {
      if (!isAdminMode) return;
      const lat = e.coord.lat();
      const lng = e.coord.lng();
      const check = autoDetectDroneStatus(lat, lng);
      naver.maps.Service.reverseGeocode({
        coords: new naver.maps.LatLng(lat, lng),
        orders: [naver.maps.Service.OrderType.ADDR, naver.maps.Service.OrderType.ROAD_ADDR].join(',')
      }, function(status, response) {
        let addr = '';
        if (status === naver.maps.Service.Status.OK && response.v2.address) {
          addr = response.v2.address.jibunAddress || response.v2.address.roadAddress;
        }
        openAddModal("새 박지 위치", lat, lng, check.status, addr);
      });
    });

    function editSpot(event, index) {
      event.stopPropagation();
      openEditModal(index);
    }

    async function deleteSpot(event, index) {
      event.stopPropagation();
      const targetSpot = spots[index];
      
      if (!confirm(`'${targetSpot.name}' 박지를 정말 삭제하시겠습니까?\n(구글 시트에서도 영구 삭제됩니다)`)) {
        return;
      }

      const deletedId = targetSpot.id;
      const deletedName = targetSpot.name;
      
      spots.splice(index, 1);
      delete spotComments[deletedId];
      delete newlyAddedSpotMeta[deletedId];
      localStorage.setItem('okbm_comments', JSON.stringify(spotComments));
      localStorage.setItem('okbm_new_spot_meta', JSON.stringify(newlyAddedSpotMeta));

      infoWindow.close();
      renderSpots();

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'DELETE', id: deletedId, name: deletedName })
        });
        alert(`'${deletedName}' 박지가 구글 시트에서 삭제되었습니다.`);
      } catch (err) {
        console.warn('구글 시트 삭제 통신 실패:', err);
      }
    }

    function resetMapView() {
      map.setCenter(DEFAULT_MAP_CENTER);
      map.setZoom(DEFAULT_MAP_ZOOM);
      infoWindow.close();
      markerHoverInfoWindow.close();
      droneHoverInfoWindow.close();
      if (tempSearchMarker) {
        tempSearchMarker.setMap(null);
        tempSearchMarker = null;
      }
      currentTerrainFilter = 'ALL';
      document.querySelectorAll('.terrain-filter-btn').forEach(b => b.classList.toggle('active', b.innerText.includes('전체')));
      filterByRegion('ALL');
    }

    function filterByRegion(region) {
      currentRegionFilter = region;
      document.querySelectorAll('.region-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === (region === 'ALL' ? '전체' : region));
      });
      renderSpots(region !== 'ALL' ? region : null);
    }

    function filterByTerrain(terrain) {
      currentTerrainFilter = terrain;
      document.querySelectorAll('.terrain-filter-btn').forEach(btn => {
        if (terrain === 'ALL') {
          btn.classList.toggle('active', btn.innerText.includes('전체'));
        } else {
          btn.classList.toggle('active', btn.innerText.includes(terrain));
        }
      });
      renderSpots();
    }

    // ⭐ 드론 규제 공역 마우스 호버 시 즉각 툴팁 표시 & 이유 폰트 50% 축소
    function toggleDroneOverlay() {
      isDroneOverlayOn = !isDroneOverlayOn;
      const btn = document.getElementById('droneLayerBtn');
      btn.classList.toggle('active', isDroneOverlayOn);

      if (!isDroneOverlayOn) {
        droneOverlays.forEach(o => o.setMap(null));
        droneOverlays = [];
        droneHoverInfoWindow.close();
        return;
      }

      restrictedZones.forEach(zone => {
        const isStrictBan = (zone.type === 'border' || zone.type === 'nuke' || zone.type === 'p73' || zone.type === 'mil_ban');
        const circle = new naver.maps.Circle({
          map: map,
          center: new naver.maps.LatLng(zone.lat, zone.lng),
          radius: zone.radius,
          fillColor: isStrictBan ? '#ef4444' : '#f59e0b',
          fillOpacity: isStrictBan ? 0.22 : 0.16,
          strokeColor: isStrictBan ? '#dc2626' : '#d97706',
          strokeWeight: 1.5,
          clickable: true
        });

        naver.maps.Event.addListener(circle, 'mouseover', function(e) {
          const content = `
            <div style="padding: 5px 8px; color: #f8fafc; line-height: 1.25; white-space: nowrap; pointer-events: none;">
              <strong style="color: ${isStrictBan ? '#f87171' : '#fde047'}; font-size: 0.78rem;">[${isStrictBan ? '🚫 비행금지구역' : '⚠️ 관제/훈련공역'}] ${zone.name}</strong><br>
              <span style="color: #cbd5e1; font-size: 0.55rem; opacity: 0.9;">🚨 이유: ${zone.desc || '드론 비행 및 촬영 승인 필수 구역'}</span>
            </div>
          `;
          droneHoverInfoWindow.setContent(content);
          droneHoverInfoWindow.open(map, e.coord);
        });

        naver.maps.Event.addListener(circle, 'mousemove', function(e) {
          droneHoverInfoWindow.setPosition(e.coord);
        });

        naver.maps.Event.addListener(circle, 'mouseout', function() {
          droneHoverInfoWindow.close();
        });

        droneOverlays.push(circle);
      });

      nationalParks.forEach(park => {
        const circle = new naver.maps.Circle({
          map: map,
          center: new naver.maps.LatLng(park.lat, park.lng),
          radius: park.radius,
          fillColor: '#ef4444',
          fillOpacity: 0.2,
          strokeColor: '#dc2626',
          strokeWeight: 1.5,
          clickable: true
        });

        naver.maps.Event.addListener(circle, 'mouseover', function(e) {
          const content = `
            <div style="padding: 5px 8px; color: #f8fafc; line-height: 1.25; white-space: nowrap; pointer-events: none;">
              <strong style="color: #f87171; font-size: 0.78rem;">[🚫 국립공원 비행금지] ${park.name}</strong><br>
              <span style="color: #cbd5e1; font-size: 0.55rem; opacity: 0.9;">🚨 이유: ${park.desc}</span>
            </div>
          `;
          droneHoverInfoWindow.setContent(content);
          droneHoverInfoWindow.open(map, e.coord);
        });

        naver.maps.Event.addListener(circle, 'mousemove', function(e) {
          droneHoverInfoWindow.setPosition(e.coord);
        });

        naver.maps.Event.addListener(circle, 'mouseout', function() {
          droneHoverInfoWindow.close();
        });

        droneOverlays.push(circle);
      });
    }

    function toggleMobileSidebar() {
      isSidebarCollapsed = !isSidebarCollapsed;
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('bottomToggleBtn');
      if (isSidebarCollapsed) {
        sidebar.classList.add('collapsed');
        btn.innerText = '▲ 박지 목록 열기';
      } else {
        sidebar.classList.remove('collapsed');
        btn.innerText = '▼ 박지 목록 닫기';
      }
    }

    function exportDataBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(spots, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `okbm_spots_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            spots = imported;
            renderSpots();
            alert('데이터가 성공적으로 복원되었습니다.');
          } else if (imported && Array.isArray(imported.spots)) {
            spots = imported.spots;
            if (imported.comments) {
              spotComments = imported.comments;
              localStorage.setItem('okbm_comments', JSON.stringify(spotComments));
            }
            renderSpots();
            alert('데이터가 성공적으로 복원되었습니다.');
          } else {
            alert('유효하지 않은 백업 파일입니다.');
          }
        } catch (err) {
          alert('JSON 파일 파싱 실패');
        }
      };
      reader.readAsText(file);
    }

    window.addEventListener('resize', () => {
      renderSpots();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container') && !e.target.closest('.custom-modal-overlay')) {
        document.getElementById('searchDropdown').style.display = 'none';
      }
    });

    fetchSpotsFromGoogleSheet();
    fetchCommentsFromSheet();
  </script>
