<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>낭만루트 에디토리얼 팩 목업</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #ffffff;
      --mute: rgba(255,255,255,0.72);
      --dim: rgba(255,255,255,0.46);
      --en: 'Space Grotesk', sans-serif;
      --kr: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(800px 360px at 12% -8%, rgba(255,255,255,0.05), transparent 50%),
        #07090e;
      color: #f8fafc;
      font-family: var(--kr);
      padding: 28px 16px 72px;
    }
    .page { width: min(480px, 100%); margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .head img { width: 26px; height: 26px; object-fit: contain; }
    .head h1 { font-size: 1.02rem; font-weight: 900; letter-spacing: -0.4px; }
    .sub { color: #94a3b8; font-size: 0.74rem; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }

    .stage {
      background: #05070c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.5);
    }
    .poster-scale {
      width: 100%;
      aspect-ratio: 1080 / 1440;
      overflow: hidden;
      position: relative;
    }
    .poster {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1440px;
      transform-origin: top left;
      overflow: hidden;
      background: #000;
      color: var(--ink);
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 42%;
      display: block;
      pointer-events: none;
    }
    .fade-top {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 38%;
      background: linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.12) 55%, transparent 100%);
      pointer-events: none;
    }
    .fade-bot {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 46%;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.08) 18%, rgba(0,0,0,0.55) 52%, rgba(0,0,0,0.86) 78%, rgba(0,0,0,0.94) 100%);
      pointer-events: none;
    }

    .layer { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

    .top {
      position: absolute;
      top: 52px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .lnt {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--en);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: rgba(255,255,255,0.86);
      text-shadow: 0 1px 6px rgba(0,0,0,0.55);
    }
    .lnt svg { width: 16px; height: 16px; flex-shrink: 0; }
    .meta { text-align: right; }
    .meta .date {
      font-family: var(--en);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 1.4px;
      color: #fff;
    }
    .meta .spot {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-family: var(--kr);
      font-size: 21px;
      font-weight: 700;
      color: #fff;
    }
    .meta .spot svg { width: 19px; height: 19px; }

    .hero {
      min-width: 0;
    }
    .hero .label {
      font-family: var(--en);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3.6px;
      color: rgba(255,255,255,0.78);
    }
    .hero .kg {
      margin-top: 10px;
      font-family: var(--en);
      font-size: 118px;
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 0.88;
      color: #fff;
    }
    .hero .kg b {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 8px;
    }
    .hero .count {
      margin-top: 14px;
      font-family: var(--en);
      font-size: 48px;
      font-weight: 600;
      letter-spacing: 1px;
      line-height: 1;
      color: #fff;
    }
    .hero .lnt {
      margin-top: 16px;
    }

    .bottom {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 48px;
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 28px;
      align-items: end;
    }
    .dock {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
    }
    .cats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      row-gap: 28px;
      column-gap: 12px;
      align-items: start;
    }
    .cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      color: #fff;
      min-width: 0;
    }
    .cell svg {
      display: block;
      margin: 0 0 10px;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7));
    }
    .cell .maker,
    .cell .name,
    .cell .w {
      width: 100%;
      text-align: left;
    }
    .cell .maker {
      font-family: var(--kr);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.1px;
      line-height: 1.2;
      color: rgba(255,255,255,0.78);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell .name {
      margin-top: 3px;
      font-family: var(--kr);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.2px;
      line-height: 1.2;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell .w {
      margin-top: 4px;
      font-family: var(--en);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: #fff;
    }
    .fulllogo {
      grid-column: 2;
      height: 100px;
      width: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.55));
    }
    .note {
      margin-top: 14px;
      color: #64748b;
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="head">
      <img src="logo.png" alt="" />
      <h1>에디토리얼 팩 목업</h1>
    </div>
    <p class="sub">제조사·제품명·무게는 아이콘 아래 가운데로 맞췄습니다. 상단은 LNT와 날짜, 하단 오른쪽은 풀로고입니다.</p>
    <div class="stage">
      <div class="poster-scale">
        <div class="poster" id="poster"></div>
      </div>
    </div>
    <p class="note">3:4 포스터. 앱에는 아직 넣지 않았습니다.</p>
  </div>

  <script>
    function icon(id) {
      return '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" aria-hidden="true"><use href="#' + id + '"/></svg>';
    }

    var ITEMS = [
      { id: 'tent', brand: '노스페이스', name: 'Mountain 25', w: 3997 },
      { id: 'sleeping-bag', brand: '씨투써밋', name: 'Spark 0F', w: 1111 },
      { id: 'mat', brand: '니모', name: 'Tensor', w: 399 },
      { id: 'backpack', brand: '오스프리', name: 'Exos 48', w: 1256 },
      { id: 'clothing', brand: '아크테릭스', name: 'Beta AR', w: 455 },
      { id: 'cooking', brand: '소토', name: 'WindMaster', w: 67 },
      { id: 'food', brand: 'Peak Refuel', name: 'Pesto Pasta', w: 447 },
      { id: 'other', brand: '페츨', name: 'Actik Core', w: 88 }
    ];
    var totalG = ITEMS.reduce(function (s, it) { return s + it.w; }, 0);
    var weightKg = (totalG / 1000).toFixed(2);

    var cells = ITEMS.map(function (it) {
      return '' +
        '<div class="cell">' +
          icon(it.id) +
          '<div class="maker">' + it.brand + '</div>' +
          '<div class="name">' + it.name + '</div>' +
          '<div class="w">' + (it.w / 1000).toFixed(2) + ' kg</div>' +
        '</div>';
    }).join('');

    document.getElementById('poster').innerHTML = '' +
      '<img class="photo" src="preview-camp.jpg" alt="샘플 캠핑 사진" />' +
      '<div class="fade-top"></div>' +
      '<div class="fade-bot"></div>' +
      '<div class="layer">' +
        '<div class="top">' +
          '<div class="hero">' +
            '<div class="label">BACKPACKING RECORD</div>' +
            '<div class="kg">' + weightKg + '<b>KG</b></div>' +
            '<div class="count">' + ITEMS.length + ' ITEMS</div>' +
            '<div class="lnt">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c0-6 3.2-9.2 8-11-1.2 5.4-4.4 8.2-8 11z"/><path d="M12 21C12 15 8.8 11.8 4 10c1.2 5.4 4.4 8.2 8 11z"/><path d="M12 21V8"/><path d="M12 8c1.6-2.8 4.2-4 7-4"/></svg>' +
              'Leave No Trace' +
            '</div>' +
          '</div>' +
          '<div class="meta">' +
            '<div class="date">2026.09.19</div>' +
            '<div class="spot">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-7.2 7-12a7 7 0 1 0-14 0c0 4.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.2"/></svg>' +
              '설악산' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="bottom">' +
          '<div class="dock"><div class="cats">' + cells + '</div></div>' +
          '<img class="fulllogo" src="fulllogo.png" alt="낭만루트" />' +
        '</div>' +
      '</div>';

    function fitPoster() {
      var box = document.querySelector('.poster-scale');
      var poster = document.getElementById('poster');
      if (!box || !poster) return;
      poster.style.transform = 'scale(' + (box.clientWidth / 1080) + ')';
    }
    fitPoster();
    window.addEventListener('resize', fitPoster);
  </script>
</body>
</html>
