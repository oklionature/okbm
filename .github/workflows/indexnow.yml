name: indexnow

# 사람이 검색용 페이지를 직접 올렸을 때 바뀐 주소를 네이버에 알린다.
# (자동 갱신 봇이 올린 것은 spot-pages.yml 안에서 알린다)
on:
  push:
    branches: [main]
    paths:
      - "spot/**"
      - "theme/**"
      - "region/**"
      - "city/**"
      - "stats/**"
      - "guide/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notify Naver
        run: |
          # 배포가 끝날 때까지 잠깐 기다린 뒤 알린다.
          sleep 90
          python3 scripts/indexnow.py "${{ github.event.before }}..${{ github.sha }}" || echo "IndexNow 알림 실패"
