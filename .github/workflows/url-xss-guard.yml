name: url-xss-guard

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ban unsanitized src/href interpolation
        run: python3 scripts/check-unsafe-url-interpolation.py
