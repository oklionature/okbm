    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function parseEntryPoint(rawEntry) {
      if (!rawEntry) return { navAddress: '', guide: '' };
      const str = String(rawEntry).trim();
      const parts = str.split(/[,]+/);
      const navAddress = parts[0].trim();
      const guide = parts.slice(1).map(p => p.trim()).filter(Boolean).join(', ');
      return { navAddress, guide };
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function autoDetectDroneStatus(lat, lng) {
      if (!lat || !lng) return { status: 'ok', reason: '자유 비행 구역 (150m 고도제한 준수 / 촬영 시 원스톱 허가 권장)' };

      for (const park of nationalParks) {
        if (getDistanceMeters(lat, lng, park.lat, park.lng) <= park.radius) {
          return { status: 'no', reason: `[국립공원 비행금지] ${park.name} (자연공원법에 의해 비행·촬영 엄격 금지)` };
        }
      }

      for (const zone of restrictedZones) {
        if (getDistanceMeters(lat, lng, zone.lat, zone.lng) <= zone.radius) {
          if (zone.type === 'border') return { status: 'no', reason: `[휴전선 접경 비행금지] ${zone.name} (군사작전상 민간드론 비행 불가)` };
          if (zone.type === 'p73') return { status: 'no', reason: `[수도권 비행금지공역 P-73] 서울 핵심부 드론 비행 절대 금지` };
          if (zone.type === 'nuke' || zone.type === 'mil_ban') return { status: 'no', reason: `[국가중요시설 비행금지] ${zone.name}` };
          if (zone.type === 'mil') return { status: 'warn', reason: `[군사작전 관제공역] ${zone.name} (드론원스톱 비행 및 촬영 사전승인 필수)` };
          if (zone.type === 'air') return { status: 'warn', reason: `[공항 관제권] ${zone.name} 반경 9.3km (드론원스톱 사전승인 필수)` };
        }
      }

      return { status: 'ok', reason: '자유 비행 구역 (최대고도 150m 이하 비행 가능 / 상업·공개 촬영 시 사전허가 권장)' };
    }

    function detectRegionAndCity(lat, lng, name = '', entryPoint = '') {
      const t = (name + ' ' + entryPoint).toLowerCase();

      if (t.includes('통영') || t.includes('수우도') || t.includes('거제') || t.includes('남해') || t.includes('사천')) {
        let city = '경상';
        if (t.includes('통영') || t.includes('수우도')) city = '경남 통영시';
        else if (t.includes('거제')) city = '경남 거제시';
        return { region: '경상', cityName: city };
      }

      const isJejuUdo = (t.includes('제주') && t.includes('우도')) || (t.includes('우도') && !t.includes('수우도'));
      if (t.includes('제주') || t.includes('서귀포') || isJejuUdo || t.includes('한라산') || t.includes('오름')) {
        return { region: '제주', cityName: t.includes('서귀포') ? '제주 서귀포시' : '제주시' };
      }

      if (t.includes('서울') || t.includes('인천') || t.includes('옹진') || t.includes('강화') || t.includes('굴업도') || t.includes('자월도') || t.includes('덕적도')) {
        return { region: '서울/인천', cityName: t.includes('서울') ? '서울' : '인천 옹진군' };
      }
      if (t.includes('경기') || t.includes('남양주') || t.includes('양평') || t.includes('이천') || t.includes('가평') || t.includes('포천') || t.includes('용인')) {
        let city = '경기';
        ['남양주시','양평군','이천시','용인시','광주시','여주시','가평군','포천시','안성시'].forEach(c => { if(t.includes(c.slice(0,2))) city = '경기 ' + c; });
        return { region: '경기', cityName: city };
      }
      if (t.includes('강원') || t.includes('정선') || t.includes('평창') || t.includes('영월') || t.includes('원주') || t.includes('춘천') || t.includes('홍천') || t.includes('강릉') || t.includes('인제') || t.includes('고성')) {
        let city = '강원';
        ['정선군','홍천군','평창군','영월군','원주시','춘천시','강릉시','인제군','양구군','화천군','철원군','고성군'].forEach(c => { if(t.includes(c.slice(0,2))) city = '강원 ' + c; });
        return { region: '강원', cityName: city };
      }
      if (t.includes('충북') || t.includes('충남') || t.includes('충청') || t.includes('충주') || t.includes('단양')) return { region: '충청', cityName: '충청' };
      if (t.includes('경북') || t.includes('경남') || t.includes('경상') || t.includes('울릉도') || t.includes('부산') || t.includes('대구')) return { region: '경상', cityName: '경상' };
      if (t.includes('전북') || t.includes('전남') || t.includes('전라') || t.includes('신안') || t.includes('여수')) return { region: '전라', cityName: '전라' };

      if (lat < 34.0) return { region: '제주', cityName: '제주' };
      if (lat >= 36.95 && lat <= 38.3 && lng >= 126.5 && lng <= 127.8) return { region: '경기', cityName: '경기' };
      if (lat >= 37.0 && lng > 127.8) return { region: '강원', cityName: '강원' };
      if (lat >= 35.8 && lat < 37.0 && lng <= 127.9) return { region: '충청', cityName: '충청' };
      if (lat < 36.0 && lng > 127.8) return { region: '경상', cityName: '경상' };
      if (lat < 35.8 && lng <= 127.8) return { region: '전라', cityName: '전라' };
      return { region: '경기', cityName: '경기' };
    }

    async function getElevation(lat, lng) {
      if (!lat || !lng) return '450m';
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2500);

      try {
        const res = await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lng}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (data?.results?.length > 0) return `${Math.round(data.results[0].elevation)}m`;
      } catch (e) {
        clearTimeout(timeoutId);
      }
      return '450m';
    }

    async function searchCoordsByQuery(query) {
      if (!query?.trim()) return null;
      const cleanQ = query.trim();

      try {
        const res = await fetch(`${GAS_API_URL}?action=SEARCH_KAKAO&q=${encodeURIComponent(cleanQ)}&_t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (data.documents && data.documents.length > 0) {
            const doc = data.documents[0];
            return {
              lat: parseFloat(doc.y),
              lng: parseFloat(doc.x),
              title: doc.place_name,
              address: doc.address_name || doc.road_address_name
            };
          }
        }
      } catch (e) {}

      const naverResult = await new Promise((resolve) => {
        naver.maps.Service.geocode({ query: cleanQ }, (status, response) => {
          if (status === naver.maps.Service.Status.OK && response.v2?.addresses?.length > 0) {
            const item = response.v2.addresses[0];
            resolve({ lat: parseFloat(item.y), lng: parseFloat(item.x), title: item.roadAddress || item.jibunAddress });
          } else {
            resolve(null);
          }
        });
      });
      if (naverResult) return naverResult;

      return null;
    }

    /* 📱 [모바일 정밀 마커 & 정보창 정중앙 정렬 로직] */
    function smoothCenterMapOnSpot(lat, lng, keepCurrentZoom = true) {
      const isMobile = window.innerWidth <= 768;
      const targetLatLng = new naver.maps.LatLng(lat, lng);
      
      const currentZoom = map.getZoom();
      const targetZoom = (!keepCurrentZoom && currentZoom < 12) ? 13 : currentZoom;

      if (currentZoom !== targetZoom) {
        map.setZoom(targetZoom, false);
      }
      
      const proj = map.getProjection();
      if (!proj) {
        map.setCenter(targetLatLng);
        return;
      }

      const targetPoint = proj.fromCoordToOffset(targetLatLng);
      
      // 모바일: [마커]와 [마커 아래 정보창] 전체 세트가 화면 중앙에 오도록 카메라를 마커 아래 약 125px로 이동
      const offsetY = isMobile ? 125 : 0;
      const offsetX = isMobile ? 0 : 145;

      const cameraPoint = new naver.maps.Point(targetPoint.x + offsetX, targetPoint.y + offsetY);
      const cameraLatLng = proj.fromOffsetToCoord(cameraPoint);

      map.panTo(cameraLatLng, { duration: 320, easing: 'easeOutCubic' });
    }

    /* 📱 [정보창 팝업 오프셋]: 마커 핀 아래로 깔끔하게 배치 */
    function getResponsiveInfoWindowOffset() {
      const isMobile = window.innerWidth <= 768;
      if (isMobile) {
        return new naver.maps.Point(0, 12); // 마커 핀 끝점 바로 아래에 나란히 배치
      } else {
        return new naver.maps.Point(180, 145); // 데스크톱: 우측 뷰
      }
    }

    function focusSpotOnMap(spot, keepZoom = false) {
      incrementSpotCount(spot.id);
      
      const dd = document.getElementById('searchDropdown');
      if (dd) dd.style.display = 'none';

      spotMarkerMap.forEach(m => m.setZIndex(100));
      const marker = spotMarkerMap.get(String(spot.id));
      if (marker) marker.setZIndex(999999);

      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active-spot'));
      const activeCard = document.getElementById(`spotItem_${spot.id}`);
      if (activeCard) {
        activeCard.classList.add('active-spot');
        const container = activeCard.closest('.region-items-container');
        if (container && container.style.display === 'none') {
          container.style.display = 'block';
        }
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 모바일이면 사이드바 자동 닫기
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.add('collapsed');
        document.getElementById('bottomToggleBtn').innerText = '▲ 박지 목록 열기';
      }

      currentActiveSpot = spot;
      currentActiveMarker = marker || new naver.maps.LatLng(spot.lat, spot.lng);
      
      infoWindow.setOptions({
        pixelOffset: getResponsiveInfoWindowOffset()
      });
      infoWindow.setContent(generateInfoWindowHtml(spot));
      infoWindow.open(map, currentActiveMarker);

      smoothCenterMapOnSpot(spot.lat, spot.lng, keepZoom);
    }

    async function saveUpdatedLocation(spotId, newLat, newLng) {
      const targetSpot = spots.find(s => String(s.id) === String(spotId));
      if (!targetSpot) return alert('해당 박지 정보를 찾을 수 없습니다.');

      targetSpot.lat = parseFloat(newLat);
      targetSpot.lng = parseFloat(newLng);

      const check = autoDetectDroneStatus(targetSpot.lat, targetSpot.lng);
      targetSpot.droneStatus = check.status;
      const res = detectRegionAndCity(targetSpot.lat, targetSpot.lng, targetSpot.name, targetSpot.entryPoint);
      targetSpot.region = res.region;
      targetSpot.cityName = res.cityName;

      naver.maps.Service.reverseGeocode({
        coords: new naver.maps.LatLng(targetSpot.lat, targetSpot.lng),
        orders: [naver.maps.Service.OrderType.ADDR, naver.maps.Service.OrderType.ROAD_ADDR].join(',')
      }, async function(status, response) {
        if (status === naver.maps.Service.Status.OK && response.v2?.address) {
          const autoAddr = response.v2.address.jibunAddress || response.v2.address.roadAddress;
          if (autoAddr) targetSpot.entryPoint = autoAddr;
        }

        infoWindow.close();
        renderSpots(targetSpot.region);

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'UPDATE_LOCATION',
              id: targetSpot.id,
              name: targetSpot.name,
              lat: targetSpot.lat,
              lng: targetSpot.lng,
              region: targetSpot.region,
              cityName: targetSpot.cityName,
              droneStatus: targetSpot.droneStatus,
              entryPoint: targetSpot.entryPoint
            })
          });
          alert(`✅ '${targetSpot.name}' 위치가 저장되었습니다!\n(위도: ${newLat}, 경도: ${newLng})`);
        } catch (err) {
          console.error('시트 저장 에러:', err);
        }
      });
    }

    async function fetchSpotsFromGoogleSheet() {
      const badge = document.getElementById('syncStatusBadge');
      if (badge) {
        badge.style.display = 'inline-block';
        badge.style.opacity = '1';
        badge.style.background = 'rgba(2, 132, 199, 0.85)';
        badge.innerText = '⚡ 동기화 중...';
      }

      const endpoints = [
        `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GOOGLE_SHEET_GID}&_t=${Date.now()}`,
        `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/export?format=csv&gid=${GOOGLE_SHEET_GID}&_t=${Date.now()}`
      ];

      let csvText = null;
      for (const url of endpoints) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (response.ok) {
            csvText = await response.text();
            if (csvText && csvText.trim().length > 10) break;
          }
        } catch (e) {}
      }

      if (!csvText) {
        if (badge) {
          badge.style.background = '#e11d48';
          badge.innerText = `❌ 시트 실패`;
        }
        return;
      }

      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        transformHeader: function(h) {
          return h.replace(/^\uFEFF/, '').trim();
        },
        complete: function(results) {
          const rows = results.data;
          if (rows && rows.length > 0) {
            const mapped = [];
            rows.forEach((row, idx) => {
              const getVal = (...keys) => {
                for (const k of keys) {
                  for (const rk of Object.keys(row)) {
                    if (rk.toLowerCase().replace(/\s+/g, '') === k.toLowerCase().replace(/\s+/g, '')) {
                      return row[rk];
                    }
                  }
                }
                return '';
              };

              const name = getVal('name', '산', '산이름', '박지명', '박지이름', '명칭');
              const latStr = getVal('lat', '위도', 'latitude', 'y');
              const lngStr = getVal('lng', '경도', 'longitude', 'x');

              const lat = parseFloat(latStr) || 0;
              const lng = parseFloat(lngStr) || 0;
              if (!name || lat === 0 || lng === 0) return;

              const elevation = getVal('elevation', '고도', '해발');
              const entryPoint = getVal('entryPoint', '들머리', '주소', '입구', 'address') || '들머리 정보 미입력';
              const desc = getVal('desc', '특징', '설명', '비고') || '';
              const distance = getVal('distance', '거리');
              const difficulty = getVal('difficulty', '난이도') || '3';
              const rawYt = getVal('youtubeUrls', 'youtubeUrl', '유튜브', '영상');
              const ytList = rawYt ? String(rawYt).split(/[\n,]+/).map(u => u.trim()).filter(Boolean) : [];
              const blogUrl = getVal('blogUrl', '블로그');
              const instaId = getVal('instaId', '인스타', '인스타그램', '등록자') || 'oklionnature';
              const rawTerrain = getVal('terrain', '지형', '지형형태');

              let terrainList = ['데크'];
              if (rawTerrain && String(rawTerrain).trim()) {
                terrainList = String(rawTerrain).split(/[\n,]+/).map(t => t.trim() === '바위' ? '돌박지' : t.trim()).filter(Boolean);
              } else {
                const combined = (name + ' ' + desc).toLowerCase();
                const autoT = [];
                if (combined.includes('계곡')) autoT.push('계곡');
                if (combined.includes('동굴') || combined.includes('굴')) autoT.push('동굴');
                if (combined.includes('섬') || combined.includes('해변')) autoT.push('섬');
                if (combined.includes('돌박지') || combined.includes('바위')) autoT.push('돌박지');
                if (combined.includes('노지')) autoT.push('노지');
                if (combined.includes('데크') || combined.includes('활공장')) autoT.push('데크');
                if (autoT.length > 0) terrainList = autoT;
              }

              const res = detectRegionAndCity(lat, lng, name, entryPoint);
              const spotId = getVal('id') ? String(getVal('id')).trim() : String(Date.now() + idx);
              const savedViews = parseInt(localStorage.getItem(`okbm_views_${spotId}`), 10) || parseInt(localStorage.getItem(`okbm_views_${name}`), 10) || 0;
              const rawCreatedAt = getVal('createdAt', '생성일');
              const createdAt = rawCreatedAt ? parseInt(rawCreatedAt, 10) : 0;

              mapped.push({
                id: spotId,
                name: name || '무명 박지',
                elevation,
                entryPoint,
                lat, lng,
                region: res.region,
                cityName: res.cityName,
                desc,
                youtubeUrls: ytList,
                blogUrl,
                instaId,
                terrain: terrainList,
                difficulty,
                distance,
                droneStatus: getVal('droneStatus') || autoDetectDroneStatus(lat, lng).status,
                searchCount: savedViews,
                createdAt
              });
            });

            if (mapped.length > 0) {
              spots = mapped;
              if (badge) {
                badge.style.background = 'rgba(16, 185, 129, 0.85)';
                badge.innerText = `✅ 동기화 완료 (${spots.length}개)`;
              }
            }
          }
          renderSpots();

          const urlParams = new URLSearchParams(window.location.search);
          const spotParam = urlParams.get('spot');
          const qParam = urlParams.get('q');
          const targetName = spotParam || qParam;

          if (targetName) {
            const cleanTarget = decodeURIComponent(targetName).trim().toLowerCase();
            const foundSpot = spots.find(s => 
              s.name.toLowerCase().includes(cleanTarget) || 
              cleanTarget.includes(s.name.toLowerCase())
            );

            if (foundSpot) {
              setTimeout(() => {
                focusSpotOnMap(foundSpot, false);
              }, 250);
            } else {
              setTimeout(() => {
                const searchInput = document.getElementById('topSearchInput');
                if (searchInput) {
                  searchInput.value = targetName;
                  executeSearch();
                }
              }, 250);
            }
          }

          setTimeout(() => {
            if (badge) {
              badge.style.opacity = '0';
              setTimeout(() => badge.style.display = 'none', 400);
            }
          }, 2000);
        }
      });
    }

    function getSpotRatingMeta(spotId) {
      const cList = spotComments[spotId] || [];
      if (cList.length === 0) return null;
      const validRatings = cList.map(c => {
        let r = Number(c.rating) || 5;
        if (r > 5) r = 5;
        if (r < 1) r = 1;
        return r;
      });
      const avg = (validRatings.reduce((acc, cur) => acc + cur, 0) / validRatings.length).toFixed(1);
      return { avg, count: cList.length };
    }

    let isCommentSubmitting = false;

    async function addComment(spotId) {
      if (isCommentSubmitting) return;

      const authorEl = document.getElementById(`cAuthor_${spotId}`);
      const textEl = document.getElementById(`cText_${spotId}`);
      const ratingEl = document.getElementById(`cRating_${spotId}`);
      const submitBtn = document.getElementById(`cBtnSubmit_${spotId}`);

      const text = textEl?.value.trim();
      if (!text) return alert('후기 내용을 입력해주세요.');

      const author = authorEl?.value.trim() || '백패커';
      let rating = ratingEl ? parseInt(ratingEl.value, 10) : 5;
      if (rating > 5) rating = 5;
      if (rating < 1) rating = 1;

      isCommentSubmitting = true;
      if (submitBtn) submitBtn.disabled = true;

      const newComment = { author, text, rating, date: new Date().toLocaleDateString() };

      if (!spotComments[spotId]) spotComments[spotId] = [];
      spotComments[spotId].push(newComment);
      localStorage.setItem('okbm_comments', JSON.stringify(spotComments));

      const targetSpot = spots.find(s => String(s.id) === String(spotId));
      if (targetSpot) {
        infoWindow.setContent(generateInfoWindowHtml(targetSpot));
      }

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'ADD_COMMENT', spotId, comment: newComment })
        });
      } catch (err) {}

      setTimeout(() => {
        isCommentSubmitting = false;
        const newBtn = document.getElementById(`cBtnSubmit_${spotId}`);
        if (newBtn) newBtn.disabled = false;
      }, 300);
    }

      const { navAddress, guide } = parseEntryPoint(spot.entryPoint || spot.name);
      const searchTarget = navAddress || spot.name;
      const naverSearchUrl = getNaverMapSearchUrl(searchTarget);

      return `
        <div class="compact-info-window" style="position: relative;">

    function renderSpots(forceOpenRegion = null) {
      const openedRegions = new Set();
      document.querySelectorAll('.region-group').forEach(group => {
        const titleEl = group.querySelector('.region-group-title span:first-child');
        const containerEl = group.querySelector('.region-items-container');
        if (titleEl && containerEl?.style.display !== 'none') {
          openedRegions.add(titleEl.innerText.replace('📌', '').trim());
        }
      });
      if (forceOpenRegion) openedRegions.add(forceOpenRegion);

      spotMarkerMap.forEach(m => m.setMap(null));
      spotMarkerMap.clear();

      const spotListEl = document.getElementById('spotList');
      spotListEl.innerHTML = '';

      const targetOrder = ["서울/인천", "경기", "강원", "충청", "전라", "경상", "제주"];
      const grouped = Object.fromEntries(targetOrder.map(r => [r, []]));

      spots.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
      let visibleCount = 0;

      spots.forEach((spot) => {
        if (!spot.region || !spot.cityName) {
          const res = detectRegionAndCity(spot.lat, spot.lng, spot.name, spot.entryPoint);
          spot.region = spot.region || res.region;
          spot.cityName = spot.cityName || res.cityName;
        }

        if (currentTerrainFilter !== 'ALL') {
          const tList = spot.terrain || [];
          const matched = tList.some(t => {
            if (currentTerrainFilter === '데크') return t.includes('데크');
            if (currentTerrainFilter === '돌박지') return t.includes('돌박지') || t.includes('바위');
            if (currentTerrainFilter === '노지') return t.includes('노지');
            if (currentTerrainFilter === '섬') return t.includes('섬');
            if (currentTerrainFilter === '계곡') return t.includes('계곡');
            if (currentTerrainFilter === '동굴') return t.includes('동굴');
            return t.includes(currentTerrainFilter);
          });
          if (!matched) return;
        }

        const r = spot.region || '경기';
        if (grouped[r]) grouped[r].push(spot);
        visibleCount++;
      });

      document.getElementById('spotCount').innerText = `${visibleCount}개`;

      targetOrder.forEach(regionKey => {
        const items = grouped[regionKey];
        if (!items || items.length === 0) return;
        if (currentRegionFilter !== 'ALL' && currentRegionFilter !== regionKey) return;

        const shouldBeOpen = (currentRegionFilter === regionKey) || (currentTerrainFilter !== 'ALL') || openedRegions.has(regionKey);

        const groupItemsContainer = document.createElement('div');

        groupItemsContainer.style.display = shouldBeOpen ? 'block' : 'none';

        groupTitle.addEventListener('click', () => {

          groupTitle.querySelector('span:last-child').innerHTML = `${items.length}개 ${isClosed ? '<b style="color:var(--google-accent-blue);">▼</b>' : '▶'}`;
          groupTitle.style.borderLeftColor = isClosed ? '#0f766e' : 'transparent';

        items.forEach((spot) => {

    async function executeSearch() {
      const rawQuery = document.getElementById('topSearchInput').value.trim();
      if (!rawQuery) return;
      
      const dropdown = document.getElementById('searchDropdown');
      dropdown.innerHTML = '<li class="dropdown-item" style="color:var(--google-text-secondary);">🔍 전국 산/봉우리/명소 실시간 검색 중...</li>';
      dropdown.style.display = 'block';

      const results = [];
      const seenCoords = new Set();

      spots.filter(s => s.name.toLowerCase().includes(rawQuery.toLowerCase()) || 
                        s.desc?.toLowerCase().includes(rawQuery.toLowerCase()) || 
                        s.entryPoint?.toLowerCase().includes(rawQuery.toLowerCase()))
        .forEach(spot => {
          seenCoords.add(`${spot.lat.toFixed(4)},${spot.lng.toFixed(4)}`);
          results.push({ 
            title: `[등록박지] ${spot.name}`, 
            sub: spot.entryPoint, 
            lat: spot.lat, 
            lng: spot.lng, 
            isInternal: true, 
            spotObj: spot 
          });
        });

      try {
        const kRes = await fetch(`${GAS_API_URL}?action=SEARCH_KAKAO&q=${encodeURIComponent(rawQuery)}&_t=${Date.now()}`);
        if (kRes.ok) {
          const kData = await kRes.json();
          (kData.documents || []).forEach(doc => {
            const lat = parseFloat(doc.y);
            const lng = parseFloat(doc.x);
            const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
            if (!seenCoords.has(key)) {
              seenCoords.add(key);
              results.push({
                title: doc.place_name,
                sub: `${doc.category_name ? `[${doc.category_name.split('>').pop().trim()}] ` : ''}${doc.address_name || doc.road_address_name}`,
                lat,
                lng
              });
            }
          });
        }
      } catch (err) {}

      const cleanAddressQuery = rawQuery.replace(/(마을회관|노인정|쉼터|주차장|캠핑장|입구|등산로|관리사무소|회관|봉|산)/g, '').trim();
      const queryList = [rawQuery];
      if (cleanAddressQuery && cleanAddressQuery !== rawQuery) queryList.push(cleanAddressQuery);

      const naverPromises = queryList.map(q => new Promise((resolve) => {
        naver.maps.Service.geocode({ query: q }, (status, response) => {
          if (status === naver.maps.Service.Status.OK && response.v2?.addresses?.length > 0) {
            resolve(response.v2.addresses.map(item => ({
              title: item.roadAddress || item.jibunAddress,
              sub: item.jibunAddress ? `(지번) ${item.jibunAddress}` : '도로명 주소',
              lat: parseFloat(item.y),
              lng: parseFloat(item.x)
            })));
          } else {
            resolve([]);
          }
        });
      }));

      const naverResLists = await Promise.all(naverPromises);
      naverResLists.flat().forEach(item => {
        const key = `${item.lat.toFixed(4)},${item.lng.toFixed(4)}`;
        if (!seenCoords.has(key)) {
          seenCoords.add(key);
          results.push(item);
        }
      });

      renderSearchResults(results, rawQuery);
    }

    function renderSearchResults(results, query) {
      const dropdown = document.getElementById('searchDropdown');
      dropdown.innerHTML = `<div class="dropdown-header"><span>🔍 검색 결과</span><span>${results.length}건</span></div>`;

      if (results.length === 0) {
        dropdown.innerHTML += '<li class="dropdown-item" style="color:#f43f5e;">검색 결과가 없습니다. 단어를 다시 확인해보세요.</li>';
        return;
      }

      results.forEach(item => {
        const check = autoDetectDroneStatus(parseFloat(item.lat), parseFloat(item.lng));
        const li = document.createElement('li');
        li.className = 'dropdown-item';
        li.innerHTML = `

          <button type="button" class="btn-quick-add" style="display:${isAdminMode && !item.isInternal ? 'inline-block' : 'none'};">➕ 등록</button>
        `;
        li.querySelector('.dropdown-info').addEventListener('click', () => {
          smoothCenterMapOnSpot(parseFloat(item.lat), parseFloat(item.lng), false);
          if (tempSearchMarker) tempSearchMarker.setMap(null);

          if (item.isInternal && item.spotObj) {
            focusSpotOnMap(item.spotObj, false);
          } else {
            tempSearchMarker = new naver.maps.Marker({ 
              position: new naver.maps.LatLng(item.lat, item.lng), 
              map: map, 
              animation: naver.maps.Animation.DROP,
              zIndex: 3000
            });
          }
          dropdown.style.display = 'none';
        });

        if (isAdminMode && !item.isInternal) {
          li.querySelector('.btn-quick-add').addEventListener('click', (e) => {
            e.stopPropagation();
            openAddModal(item.title, item.lat, item.lng, check.status, item.title);
            dropdown.style.display = 'none';
          });
        }
        dropdown.appendChild(li);
      });
    }

      const name = document.getElementById('modalInputName').value.trim();
      const elevation = document.getElementById('modalInputElevation').value.trim();
      const entryPoint = document.getElementById('modalInputEntry').value.trim() || '들머리 정보 미입력';
      const desc = document.getElementById('modalInputDesc').value.trim() || '추천 백패킹 박지';
      const distance = document.getElementById('modalInputDistance').value.trim();
      const rawYt = document.getElementById('modalInputYoutube').value.trim();
      const youtubeUrls = rawYt ? rawYt.split('\n').map(u => u.trim()).filter(Boolean).slice(0, 3) : [];
      const blogUrl = document.getElementById('modalInputBlog').value.trim();
      const instaId = document.getElementById('modalInputInsta').value.trim() || 'oklionnature';

      const terrain = [];
      if (document.getElementById('chkDeck').checked) terrain.push('데크');
      if (document.getElementById('chkRock').checked) terrain.push('돌박지');
      if (document.getElementById('chkSoil').checked) terrain.push('노지');
      if (document.getElementById('chkIsland').checked) terrain.push('섬');
      if (document.getElementById('chkValley').checked) terrain.push('계곡');
      if (document.getElementById('chkCave').checked) terrain.push('동굴');
      if (document.getElementById('chkEtc').checked) terrain.push('기타');

      const difficulty = document.getElementById('modalSelectDiff').value;
      if (!name) return alert('산(박지) 이름을 입력해주세요.');

      let finalLat = modalPendingData.lat;
      let finalLng = modalPendingData.lng;
      if (!finalLat || !finalLng) {
        const { navAddress } = parseEntryPoint(entryPoint);
        const searchTarget = navAddress || name;
        const coords = await searchCoordsByQuery(searchTarget) || { lat: map.getCenter().lat(), lng: map.getCenter().lng() };
        finalLat = coords.lat;
        finalLng = coords.lng;
      }

      if (modalMode === 'PROPOSAL') {
        const check = autoDetectDroneStatus(finalLat, finalLng);
        const res = detectRegionAndCity(finalLat, finalLng, name, entryPoint);

        const proposalData = {
          name, elevation: elevation || '측정대기', entryPoint,
          lat: finalLat, lng: finalLng,
          region: res.region, cityName: res.cityName,
          desc, distance, youtubeUrls, blogUrl, instaId,
          terrain: terrain.length > 0 ? terrain : ['데크'],
          difficulty, droneStatus: check.status,
          status: 'pending',
          submittedAt: new Date().toLocaleString()
        };

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'PROPOSE_SPOT', proposal: proposalData })
          });
          alert(`🎉 '${name}' 박지 제보가 정상 접수되었습니다!\n\n관리자 확인 및 승인 후 지도에 등록됩니다. 소중한 제보 감사합니다! 🎒`);
        } catch (err) {
          alert('제보 전송 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
        }
        closeCustomModal();
        return;
      }

      if (modalMode === 'ADD') {
        const res = detectRegionAndCity(finalLat, finalLng, name, entryPoint);
        const newSpotId = String(Date.now());
        const nowTimestamp = Date.now();

        const newSpot = {
          id: newSpotId,
          name, elevation, entryPoint,
          lat: finalLat, lng: finalLng,
          region: res.region, cityName: res.cityName,
          desc, distance, youtubeUrls, blogUrl, instaId,
          terrain: terrain.length > 0 ? terrain : ['데크'],
          difficulty, droneStatus: modalPendingData.droneStatus || autoDetectDroneStatus(finalLat, finalLng).status,
          searchCount: 1,
          createdAt: nowTimestamp
        };
        
        spots.unshift(newSpot);
        renderSpots(newSpot.region);
        
        const sidebarList = document.getElementById('spotList');
        if (sidebarList) sidebarList.scrollTop = 0;

        setTimeout(() => {
          focusSpotOnMap(newSpot, false);
        }, 100);

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'ADD', spot: newSpot })
          });
          alert(`✅ '${newSpot.name}' 박지가 구글 시트와 지도에 즉시 등록되었습니다!`);
        } catch (err) {}

      } else if (modalMode === 'EDIT') {
        const target = spots[modalEditIndex];
        const res = detectRegionAndCity(finalLat, finalLng, name, entryPoint);
        Object.assign(target, { name, elevation, entryPoint, lat: finalLat, lng: finalLng, desc, distance, youtubeUrls, blogUrl, instaId, terrain: terrain.length > 0 ? terrain : ['데크'], difficulty, region: res.region, cityName: res.cityName });

        renderSpots(target.region);
        setTimeout(() => focusSpotOnMap(target, true), 100);

        try {
          await fetch(GAS_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'UPDATE', id: target.id, spot: target })
          });
          alert(`✅ '${target.name}' 수정사항이 반영되었습니다.`);
        } catch (err) {}
      }
      closeCustomModal();
    }

    async function deleteSpot(event, index) {
      event.stopPropagation();
      const targetSpot = spots[index];
      if (!confirm(`'${targetSpot.name}' 박지를 정말 삭제하시겠습니까?`)) return;

      const deletedId = targetSpot.id;
      const deletedName = targetSpot.name;
      
      spots.splice(index, 1);
      delete spotComments[deletedId];
      localStorage.setItem('okbm_comments', JSON.stringify(spotComments));

      closeInfoWindowCompletely();
      renderSpots();

      try {
        await fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'DELETE', id: deletedId, name: deletedName })
        });
        alert(`'${deletedName}' 박지가 삭제되었습니다.`);
      } catch (err) {}
    }

    function resetMapView() {
      map.morph(DEFAULT_MAP_CENTER, DEFAULT_MAP_ZOOM, { duration: 400, easing: 'easeOutCubic' });
      closeInfoWindowCompletely();
      droneHoverInfoWindow.close();
      if (tempSearchMarker) {
        tempSearchMarker.setMap(null);
        tempSearchMarker = null;
      }
      if (tempPickedMarker) {
        tempPickedMarker.setMap(null);
        tempPickedMarker = null;
      }
      currentTerrainFilter = 'ALL';
      document.querySelectorAll('.terrain-filter-btn').forEach(b => b.classList.toggle('active', b.innerText.includes('전체')));
      filterByRegion('ALL');
    }

    function filterByRegion(region) {
      currentRegionFilter = region;
      document.querySelectorAll('.region-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.trim() === (region === 'ALL' ? '전체' : region));
      });
      renderSpots(region !== 'ALL' ? region : null);
    }

    function filterByTerrain(terrain) {
      currentTerrainFilter = terrain;
      document.querySelectorAll('.terrain-filter-btn').forEach(btn => {
        btn.classList.toggle('active', terrain === 'ALL' ? btn.innerText.includes('전체') : btn.innerText.includes(terrain));
      });
      renderSpots();
    }

    function initDroneOverlays() {
      const allZones = [
        ...restrictedZones.map(z => ({ ...z, isStrict: z.type === 'border' || z.type === 'nuke' || z.type === 'p73' || z.type === 'mil_ban', isPark: false })),
        ...nationalParks.map(p => ({ ...p, isStrict: true, isPark: true }))
      ];

      droneOverlays = allZones.map(zone => {
        const circle = new naver.maps.Circle({
          center: new naver.maps.LatLng(zone.lat, zone.lng),
          radius: zone.radius,
          fillColor: zone.isStrict ? '#f43f5e' : '#f59e0b',
          fillOpacity: zone.isStrict ? 0.2 : 0.14,
          strokeColor: zone.isStrict ? '#e11d48' : '#d97706',
          strokeWeight: 1.5,
          clickable: true
        });

        naver.maps.Event.addListener(circle, 'mouseover', (e) => {
          droneHoverInfoWindow.setContent(`
            <div style="padding: 5px 8px; color: #f8fafc; line-height: 1.3; white-space: nowrap; pointer-events: none; border-radius: 6px;">
              <strong style="color: ${zone.isStrict ? '#fb7185' : '#fde047'}; font-size: 0.72rem;">[${zone.isPark ? '🚫 국립공원 금지' : (zone.isStrict ? '🚫 비행금지' : '⚠️ 관제공역')}] ${escapeHtml(zone.name)}</strong><br>
              <span style="color: #cbd5e1; font-size: 0.62rem; opacity: 0.9;">🚨 ${escapeHtml(zone.desc || '비행/촬영 승인 필수')}</span>
            </div>
          `);
          droneHoverInfoWindow.open(map, e.coord);
        });

        naver.maps.Event.addListener(circle, 'mousemove', (e) => droneHoverInfoWindow.setPosition(e.coord));
        naver.maps.Event.addListener(circle, 'mouseout', () => droneHoverInfoWindow.close());

        return circle;
      });
    }

    function toggleDroneOverlay() {
      isDroneOverlayOn = !isDroneOverlayOn;
      const pcBtn = document.getElementById('droneLayerBtn');
      const mobileBtn = document.getElementById('mobileDroneBtn');
      if (pcBtn) pcBtn.classList.toggle('active', isDroneOverlayOn);
      if (mobileBtn) mobileBtn.classList.toggle('active', isDroneOverlayOn);

      if (droneOverlays.length === 0) initDroneOverlays();
      droneOverlays.forEach(circle => circle.setMap(isDroneOverlayOn ? map : null));
      if (!isDroneOverlayOn) droneHoverInfoWindow.close();
    }

    function toggleMobileSidebar() {
      isSidebarCollapsed = !isSidebarCollapsed;
      const sidebar = document.getElementById('sidebar');
      const btn = document.getElementById('bottomToggleBtn');
      sidebar.classList.toggle('collapsed', isSidebarCollapsed);
      btn.innerText = isSidebarCollapsed ? '▲ 박지 목록 열기' : '▼ 박지 목록 닫기';
    }

    function exportDataBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(spots, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `okbm_spots_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importDataBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            spots = imported;
          } else if (imported?.spots && Array.isArray(imported.spots)) {
            spots = imported.spots;
            if (imported.comments) {
              spotComments = imported.comments;
              localStorage.setItem('okbm_comments', JSON.stringify(spotComments));
            }
          } else {
            return alert('유효하지 않은 백업 파일입니다.');
          }
          renderSpots();
          alert('데이터가 성공적으로 복원되었습니다.');
        } catch (err) {
          alert('JSON 파일 파싱 실패');
        }
      };
      reader.readAsText(file);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        spotMarkerMap.forEach((marker) => {
          if (marker.spotData) marker.setIcon(createCustomMarkerIcon(marker.spotData));
        });
      }, 150);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-container') && !e.target.closest('.custom-modal-overlay') && !e.target.closest('#pinPickerBanner')) {
        document.getElementById('searchDropdown').style.display = 'none';
      }
    });

    fetchSpotsFromGoogleSheet();
    fetchCommentsFromSheet();
  </script>
</body>
</html>
