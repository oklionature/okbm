<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 로그인</title>
</head>
<body style="margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <p id="naverStatus" style="font-size:14px;opacity:0.8;">네이버 로그인 처리 중...</p>
  <script>
    (function() {
      var statusEl = document.getElementById('naverStatus');

      function goBack() {
        var ret = sessionStorage.getItem('okbm_naver_return') || '/index.html';
        if (ret.charAt(0) !== '/') ret = '/' + ret;
        window.location.replace(window.location.origin + ret);
      }

      function fail(msg) {
        if (statusEl) statusEl.textContent = msg || '네이버 로그인에 실패했습니다.';
        setTimeout(goBack, 1600);
      }

      function parseHashParams() {
        var params = {};
        var raw = String(window.location.hash || '').replace(/^#/, '');
        if (!raw) return params;
        raw.split('&').forEach(function(part) {
          if (!part) return;
          var idx = part.indexOf('=');
          var key = decodeURIComponent((idx >= 0 ? part.slice(0, idx) : part).replace(/\+/g, ' '));
          var val = decodeURIComponent((idx >= 0 ? part.slice(idx + 1) : '').replace(/\+/g, ' '));
          params[key] = val;
        });
        return params;
      }

      function fetchProfileJsonp(accessToken) {
        return new Promise(function(resolve, reject) {
          var cbName = 'okbmNaverProfileCb_' + String(Date.now());
          var script = document.createElement('script');
          var timeout = setTimeout(function() {
            cleanup();
            reject(new Error('jsonp timeout'));
          }, 8000);

          function cleanup() {
            clearTimeout(timeout);
            try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
          }

          window[cbName] = function(result) {
            cleanup();
            var row = result && result.response;
            if (!row || !row.id) {
              reject(new Error('empty profile'));
              return;
            }
            resolve({
              id: String(row.id).trim(),
              email: String(row.email || '').trim(),
              nickname: String(row.nickname || row.name || '').trim(),
              photo: String(row.profile_image || '').trim()
            });
          };

          script.onerror = function() {
            cleanup();
            reject(new Error('jsonp script error'));
          };
          script.src = 'https://openapi.naver.com/v1/nid/getUserProfile.json?response_type=json'
            + '&access_token=' + encodeURIComponent(accessToken)
            + '&oauth_callback=' + encodeURIComponent(cbName);
          document.head.appendChild(script);
        });
      }

      var params = parseHashParams();
      var query = new URLSearchParams(window.location.search);
      var oauthError = params.error || query.get('error') || '';
      var accessToken = params.access_token || '';
      var returnedState = params.state || query.get('state') || '';
      var savedState = sessionStorage.getItem('okbm_naver_oauth_state') || '';

      if (oauthError) {
        fail('네이버 로그인이 취소되었거나 거부되었습니다.');
        return;
      }
      if (query.get('code') && !accessToken) {
        fail('네이버 로그인을 다시 시도해 주세요.');
        return;
      }
      if (!accessToken) {
        fail('네이버 토큰을 받지 못했습니다.');
        return;
      }
      if (savedState && returnedState && savedState !== returnedState) {
        fail('네이버 로그인 상태값이 일치하지 않습니다.');
        return;
      }

      sessionStorage.setItem('okbm_naver_oauth_token', accessToken);
      fetchProfileJsonp(accessToken).then(function(profile) {
        sessionStorage.setItem('okbm_naver_profile', JSON.stringify(profile));
        goBack();
      }).catch(function(err) {
        console.warn('[Naver profile jsonp]', err);
        goBack();
      });
    })();
  </script>
</body>
</html>
