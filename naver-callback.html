<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네이버 로그인</title>
</head>
<body style="margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <p id="naverStatus" style="font-size:14px;opacity:0.8;">네이버 로그인 처리 중...</p>
  <script>
    (function() {
      var statusEl = document.getElementById('naverStatus');

      function goBack() {
        var ret = sessionStorage.getItem('okbm_naver_return') || '/index.html';
        if (ret.charAt(0) !== '/') ret = '/' + ret;
        var hasOkbmInRet = ret.indexOf('/okbm') === 0;
        var basePath = (!hasOkbmInRet && window.location.pathname.indexOf('/okbm') !== -1) ? '/okbm' : '';
        window.location.replace(window.location.origin + basePath + ret);
      }

      function fail(msg) {
        sessionStorage.removeItem('okbm_naver_oauth_code');
        sessionStorage.removeItem('okbm_naver_oauth_token');
        if (statusEl) statusEl.textContent = msg || '네이버 로그인에 실패했습니다.';
        setTimeout(goBack, 1600);
      }

      var query = new URLSearchParams(window.location.search);
      var code = String(query.get('code') || '').trim();
      var oauthError = String(query.get('error') || '').trim();
      var returnedState = String(query.get('state') || '').trim();
      var savedState = sessionStorage.getItem('okbm_naver_oauth_state') || '';
      var savedRedirect = sessionStorage.getItem('okbm_naver_redirect_uri') || '';

      if (oauthError) {
        fail('네이버 로그인이 취소되었거나 거부되었습니다.');
        return;
      }
      if (window.location.hash && /access_token=/.test(window.location.hash)) {
        fail('네이버 로그인을 다시 시도해 주세요.');
        return;
      }
      if (!code) {
        fail('네이버 인가 코드를 받지 못했습니다.');
        return;
      }
      if (!savedState || !returnedState || savedState !== returnedState) {
        fail('네이버 로그인 상태값이 일치하지 않습니다.');
        return;
      }

      sessionStorage.setItem('okbm_naver_oauth_code', code);
      sessionStorage.removeItem('okbm_naver_oauth_token');
      sessionStorage.removeItem('okbm_naver_profile');
      if (!savedRedirect) {
        sessionStorage.setItem(
          'okbm_naver_redirect_uri',
          window.location.origin + window.location.pathname
        );
      }
      goBack();
    })();
  </script>
</body>
</html>
