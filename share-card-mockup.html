<!DOCTYPE html>

  <title>낭만루트 인증샷 목업</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07090e;
      --font: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      --en: 'Space Grotesk', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 8% -10%, rgba(255,255,255,0.05), transparent 50%),
        var(--bg);
      color: #f8fafc;
      font-family: var(--font);
      padding: 28px 16px 64px;
    }
    .wrap { width: min(560px, 100%); margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .head img { width: 28px; height: 28px; object-fit: contain; }
    .head h1 { font-size: 1.02rem; font-weight: 900; letter-spacing: -0.4px; }
    .sub { color: #94a3b8; font-size: 0.74rem; font-weight: 600; margin-bottom: 18px; }

    .icons {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 22px;
      padding: 12px 10px 10px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      background: #0c1118;
    }
    .icons .cell { text-align: center; color: #fff; }
    .icons svg { display: block; margin: 0 auto; }
    .icons b { display: block; margin-top: 5px; font-size: 0.52rem; font-weight: 800; color: #94a3b8; }

    .stage {
      width: min(330px, 100%);
      margin: 0 auto;
      background: #05070c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    }
    .note {
      margin: 14px auto 0;
      width: min(330px, 100%);
      color: #64748b;
      font-size: 0.68rem;
      font-weight: 600;
      line-height: 1.45;
    }
  </style>
</head>

  <div class="wrap">
    <div class="head">
      <img src="logo.png" alt="" />
      <h1>인증샷 공유 이미지 목업</h1>
    </div>
    <p class="sub">사진은 샘플. 아이콘·표시명·무게·총무게·날짜·장소는 앱에서 찍히는 그대로 배치했습니다.</p>

    <div class="icons" id="iconStrip"></div>
    <div class="stage" id="stage"></div>
    <p class="note">표시명은 DB 원문에서 줄인 값입니다. 원문 예: 노스페이스 마운틴 25 텐트 (풋프린트 포함) → 노스페이스 Mountain 25</p>
  </div>

  <script>
    function iconUse(id, size) {
      return '<svg viewBox="0 0 64 64" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" aria-hidden="true"><use href="#' + id + '"/></svg>';
    }

    var ICONS = [
      { id: 'tent', label: '텐트' },
      { id: 'sleeping-bag', label: '침낭' },
      { id: 'mat', label: '매트' },
      { id: 'backpack', label: '배낭' },
      { id: 'cooking', label: '취사' },
      { id: 'clothing', label: '의류' },
      { id: 'food', label: '식량' },
      { id: 'other', label: '기타' }
    ];

    document.getElementById('iconStrip').innerHTML = ICONS.map(function (ic) {
      return '<div class="cell">' + iconUse(ic.id, 24) + '<b>' + ic.label + '</b></div>';
    }).join('');

    var PACK = {
      photo: 'preview-camp.jpg',
      spot: '신안 그림산',
      date: '2026.09.19',
      items: [
        { icon: 'tent', brand: '노스페이스', name: 'Mountain 25', weight: 3997 },
        { icon: 'sleeping-bag', brand: '씨투써밋', name: 'Spark 0F', weight: 1111 },
        { icon: 'mat', brand: '니모', name: 'Tensor', weight: 399 },
        { icon: 'backpack', brand: '오스프리', name: 'Exos 48', weight: 1256 },
        { icon: 'cooking', brand: '소토', name: 'WindMaster', weight: 67 },
        { icon: 'clothing', brand: '아크테릭스', name: 'Beta AR', weight: 455 },
        { icon: 'food', brand: 'Peak Refuel', name: 'Pesto Pasta', weight: 447 },
        { icon: 'other', brand: '페츨', name: 'Actik Core', weight: 88 }
      ]
    };

    var totalG = PACK.items.reduce(function (s, it) { return s + it.weight; }, 0);
    var weightKg = (totalG / 1000).toFixed(2);
    var rows = PACK.items.map(function (it) {
      var label = it.brand + ' ' + it.name;
      return '' +
        '<div style="display:flex; justify-content:space-between; align-items:center; gap:3px; min-width:0; line-height:1;">' +
          '<span style="display:flex; align-items:center; gap:3px; min-width:0; overflow:hidden;">' +
            '<span style="width:12px; height:12px; flex-shrink:0; color:#ffffff; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8)); line-height:0;">' + iconUse(it.icon, 12) + '</span>' +
            '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.48rem; font-weight:700; color:#ffffff; text-shadow:0 1px 3px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.8);">' + label + '</span>' +
          '</span>' +
          '<span style="font-family:\'Space Grotesk\', sans-serif; font-size:0.46rem; font-weight:800; color:#ffffff; flex-shrink:0; text-shadow:0 1px 3px rgba(0,0,0,0.9);">' + (it.weight / 1000).toFixed(2) + '</span>' +
        '</div>';
    }).join('');

    document.getElementById('stage').innerHTML = '' +
      '<div style="position:relative; width:100%; aspect-ratio:3/4; overflow:hidden; border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,0.95); background:#000000; box-sizing:border-box; user-select:none;">' +
        '<img src="' + PACK.photo + '" alt="샘플 캠핑 사진" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%; display:block; z-index:1; pointer-events:none;" />' +
        '<div style="position:absolute; inset:auto 0 0 0; height:58%; z-index:2; pointer-events:none; background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.22) 40%, rgba(0,0,0,0.62) 100%);"></div>' +
        '<div style="position:absolute; top:12px; left:14px; right:14px; z-index:5; display:flex; justify-content:space-between; align-items:center;">' +
          '<div style="display:inline-flex; align-items:center; gap:4px; min-width:0; max-width:70%;">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" style="width:11px; height:11px; flex-shrink:0;"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>' +
            '<span style="font-family:\'Pretendard Variable\', -apple-system, sans-serif; font-size:0.68rem; font-weight:800; color:#ffffff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,0.8);">' + PACK.spot + '</span>' +
          '</div>' +
          '<span style="font-family:\'Space Grotesk\', sans-serif; font-size:0.54rem; font-weight:700; color:#cbd5e1; letter-spacing:0.8px; flex-shrink:0; text-shadow:0 1px 4px rgba(0,0,0,0.8);">' + PACK.date + '</span>' +
        '</div>' +
        '<div style="position:absolute; left:12px; right:12px; bottom:10px; z-index:5; display:flex; flex-direction:column; justify-content:flex-end; max-height:62%;">' +
          '<div style="display:grid; grid-template-columns:1fr 1fr; column-gap:8px; row-gap:0; align-content:end; min-height:0;">' + rows + '</div>' +
          '<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px; gap:8px;">' +
            '<div style="font-family:\'Space Grotesk\', \'Pretendard Variable\', sans-serif; font-size:1.18rem; font-weight:900; letter-spacing:-0.6px; line-height:1; color:#ffffff; text-shadow:0 1px 6px rgba(0,0,0,0.7), 0 1px 2px rgba(0,0,0,0.85);">' + weightKg + '<span style="font-family:\'Pretendard Variable\', sans-serif; font-size:0.48em; font-weight:800; margin-left:2px;">kg</span></div>' +
            '<div style="display:flex; align-items:center; gap:3px; opacity:0.7;">' +
              '<div style="transform:scale(0.7); transform-origin:right center;"><img src="logo.png" alt="" style="width:20px; height:20px; object-fit:contain; display:block;" /></div>' +
              '<span style="font-family:\'Pretendard Variable\', -apple-system, sans-serif; font-size:0.44rem; font-weight:700; color:#ffffff; letter-spacing:-0.2px; text-shadow:0 1px 3px rgba(0,0,0,0.8);">낭만루트</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  </script>
</body>
</html>
