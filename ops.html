<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/; connect-src 'self' https://qnumfecythtqtrxeasys.supabase.co; object-src 'none'; base-uri 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>낭만루트 운영 숫자</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
  <style>
    :root {
      --bg: #0E1013; --card: #171A1F; --raise: #20242B; --line: #2A2F37;
      --tx-1: #F2F3F5; --tx-2: #A3A9B3; --tx-3: #7D8490;
      --accent: #FFB547; --ok: #6FD6A8; --warn: #FF7A6B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--tx-1); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; font-size: 14px; padding: 20px 16px 60px; max-width: 720px; margin: 0 auto; }
    .back { display: inline-block; color: var(--tx-2); font-size: 13px; font-weight: 700; text-decoration: none; margin-bottom: 10px; }
    h1 { font-size: 20px; font-weight: 800; }
    .sub { color: var(--tx-3); font-size: 12px; margin-top: 4px; }
    .range { display: flex; gap: 8px; margin: 16px 0 8px; }
    .range button { background: var(--card); color: var(--tx-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
    .range button.on { background: var(--tx-1); color: var(--bg); border-color: var(--tx-1); }
    .msg { margin-top: 24px; color: var(--tx-2); line-height: 1.6; }
    .msg.err { color: var(--warn); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 16px; }
    section h2 { font-size: 16px; font-weight: 800; }
    section p.h { color: var(--tx-3); font-size: 12px; margin: 4px 0 12px; line-height: 1.5; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kpi { background: var(--raise); border-radius: 12px; padding: 12px; }
    .kpi b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .kpi span { font-size: 12px; color: var(--tx-3); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 9px 4px; border-bottom: 1px solid var(--raise); font-size: 13px; }
    th { color: var(--tx-3); font-weight: 700; font-size: 12px; }
    th:first-child, td:first-child { text-align: left; }
    td .bar { display: block; height: 4px; border-radius: 2px; background: var(--accent); margin-top: 5px; opacity: .85; }
    .dim { color: var(--tx-3); }
    .days { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 8px; }
    .days div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .days i { display: block; width: 100%; max-width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; }
    .days small { font-size: 10px; color: var(--tx-3); margin-top: 4px; }
    .days em { font-style: normal; font-size: 10px; color: var(--tx-2); margin-bottom: 2px; }
    /* 관리자 새 소식 */
    .kpis a.kpi { color: inherit; text-decoration: none; }
    .kpi .new { color: var(--accent); font-size: 12px; font-weight: 800; margin-left: 4px; }
    .tabs { display: flex; gap: 6px; margin: 14px 0 8px; }
    .tabs button { background: var(--raise); color: var(--tx-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: inherit; font-weight: 700; cursor: pointer; }
    .tabs button.on { background: var(--tx-1); color: var(--bg); border-color: var(--tx-1); }
    .act-row { padding: 10px 0; border-bottom: 1px solid var(--raise); }
    .act-row.is-new { border-left: 3px solid var(--accent); padding-left: 8px; }
    .act-row .t { font-weight: 800; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-row .m { color: var(--tx-3); font-size: 12px; margin-top: 3px; line-height: 1.5; }
    .act-row .b { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .act-row .b a, .act-row .b button { background: var(--raise); color: var(--tx-1); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
    .act-row .b button.red { color: var(--warn); }
    .tag { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 5px; padding: 1px 6px; margin-right: 4px; background: var(--raise); }
    .ok { color: var(--ok); } .warn { color: var(--warn); }
    /* 펼치기 칸 */
    details.fold { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-top: 16px; }
    details.fold > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
    details.fold > summary::-webkit-details-marker { display: none; }
    details.fold > summary::after { content: '▾'; margin-left: auto; color: var(--tx-3); transition: transform .2s; }
    details.fold[open] > summary::after { transform: rotate(180deg); }
    details.fold > summary .sum { color: var(--tx-3); font-size: 12px; font-weight: 700; }
    details.fold > .in { padding: 0 16px 16px; }
    details.fold > .in > section { background: none; border: 0; padding: 0; margin: 0; }
    .kpi .cmp { display: block; font-size: 11px; font-weight: 700; margin-top: 2px; }
    .kpi .cmp.up { color: var(--ok); } .kpi .cmp.down { color: var(--warn); } .kpi .cmp.same { color: var(--tx-3); }
    .days i.m { background: var(--ok); border-radius: 0; }
    .days .join { font-size: 10px; color: var(--ok); font-weight: 800; height: 12px; }
    .legend { display: flex; gap: 12px; font-size: 11px; color: var(--tx-3); margin-top: 6px; }
    .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
    @media (max-width: 420px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    /* 공지 푸시 */
    .push label { display: block; color: var(--tx-3); font-size: 12px; font-weight: 700; margin: 10px 0 4px; }
    .push input, .push textarea { width: 100%; background: var(--raise); color: var(--tx-1); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font: inherit; }
    .push textarea { min-height: 72px; resize: vertical; }
    .push .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .push button { background: var(--accent); color: #1a1205; border: 0; border-radius: 10px; padding: 9px 16px; font: inherit; font-weight: 800; cursor: pointer; }
    .push button:disabled { opacity: .5; cursor: default; }
    .push .st { color: var(--tx-2); font-size: 12px; line-height: 1.5; }
    .seen-btn { background: none; border: 1px solid var(--line); color: var(--tx-2); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <a class="back" href="index.html?open=report">‹ 마이리포트로</a>
  <h1>낭만루트 운영 숫자</h1>
  <p class="sub">관리자 계정으로만 보입니다. 관리자 본인 접속과 ?qa=1 접속은 세지 않습니다.</p>
  <div id="activity"></div>
  <details class="fold push" id="pushBox" hidden>
    <summary>공지 푸시 보내기 <span class="sum" id="pushCount"></span></summary>
    <div class="in">
      <p class="sub">아이폰 앱에서 알림을 허용한 기기 전체에 보내요. 보내면 되돌릴 수 없어요.</p>
      <label for="pushTitle">제목 (60자)</label>
      <input id="pushTitle" maxlength="60" placeholder="예: 새 박지 10곳이 올라왔어요" />
      <label for="pushBody">내용 (200자)</label>
      <textarea id="pushBody" maxlength="200" placeholder="알림에 보일 내용"></textarea>
      <label for="pushUrl">누르면 열 주소 (선택, /로 시작)</label>
      <input id="pushUrl" maxlength="300" placeholder="예: /notice/new-spots.html" />
      <div class="row"><button type="button" id="pushSend">보내기</button><span class="st" id="pushStatus"></span></div>
    </div>
  </details>
  <details class="fold push" id="kakaoBox" hidden>
    <summary>카카오톡 신고 알림 <span class="sum" id="kakaoSum"></span></summary>
    <div class="in">
      <p class="sub">새 신고가 들어오면 내 카카오톡 「나와의 채팅」으로 알려 줘요. 매일 오전 9시에 처리 안 한 신고가 있으면 한 번 더 알려요.</p>
      <div class="row"><button type="button" id="kakaoLink">카카오톡 알림 연결</button><button type="button" id="kakaoTest" hidden>테스트 보내기</button><span class="st" id="kakaoStatus"></span></div>
    </div>
  </details>
  <div class="range" id="range">
    <button type="button" data-days="7" class="on">7일</button>
    <button type="button" data-days="14">14일</button>
    <button type="button" data-days="30">30일</button>
  </div>
  <div id="out"><p class="msg">불러오는 중…</p></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script src="ops.js?v=12"></script>
</body>
</html>
