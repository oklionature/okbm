<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>박지 탐색기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main>
    <h1>박지 탐색기</h1>
    <p class="lead">드론으로 찍은 데크 사진을 넣으면 전국 봉우리와 데크 위치를 같이 봅니다. 능선 모양, 바다가 보이는지, 골짜기에 구름이 깔렸는지, 가까운 곳이 숲인지 바위기인지를 사진에서 재서 걸러 냅니다. 사진 파일이 없는 목록만으로는 고르지 않습니다. 한 곳으로 갈리지 않으면 장소를 정하지 않습니다.</p>
    <form id="form">
      <label class="drop" for="file">사진 선택</label>
      <input id="file" name="image" type="file" accept="image/jpeg,image/png,image/webp" />
      <button id="go" type="submit">찾기</button>
    </form>
    <p id="status" role="status"></p>
    <section id="result" hidden>
      <h2 id="title"></h2>
      <p id="note"></p>
      <div id="map"></div>
      <h3>비교한 곳</h3>
      <ul id="compared"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
