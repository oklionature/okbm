<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>낭만루트 쿠치 오버레이 목업</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --yellow: #e7de6a;
      --yellow-bar: #e6e05c;
      --kr: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
      --display: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #07090e;
      color: #f8fafc;
      font-family: var(--kr);
      padding: 24px 14px 64px;
    }
    .page { width: min(420px, 100%); margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .head img { width: 26px; height: 26px; object-fit: contain; }
    .head h1 { font-size: 1.02rem; font-weight: 900; }
    .sub { color: #94a3b8; font-size: 0.74rem; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
    .stage {
      background: #05070c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px;
    }
    .poster {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #ffffff;
      container-type: size;
      border-radius: 18px;
      padding: 2.8%;
      box-sizing: border-box;
    }
    .sheet {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      isolation: isolate;
    }
    .sheet .photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 42%;
      display: block;
    }
    .rail {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6.8%;
      background: var(--yellow-bar);
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 7% 0 8%;
    }
    .rail-block {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      color: #1a1a12;
    }
    .rail-block.spot {
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .rail-lab {
      font-family: var(--kr);
      font-size: 2.4cqw;
      font-weight: 700;
      letter-spacing: 0.12em;
      opacity: 0.72;
    }
    .rail-val {
      font-family: var(--display);
      font-size: 3.5cqw;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .mast {
      position: absolute;
      left: 8%;
      right: 2%;
      top: 52%;
      z-index: 5;
      text-align: center;
      pointer-events: none;
    }
    .mast-dark { z-index: 5; color: #2a2710; mix-blend-mode: multiply; }
    .mast-light { z-index: 6; color: #e7de6a; mix-blend-mode: screen; }
    .kg {
      font-family: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
      font-weight: 500;
      font-size: 38cqw;
      letter-spacing: 0.01em;
      line-height: 0.72;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .items {
      margin-top: 2.2%;
      font-family: var(--display);
      font-weight: 600;
      font-size: 5.2cqw;
      letter-spacing: 0.32em;
      text-transform: lowercase;
    }
    .mark-wrap {
      position: absolute;
      right: 3.4%;
      bottom: 3.2%;
      z-index: 7;
      height: 6.6cqw;
      width: 18cqw;
      pointer-events: none;
    }
    .mark {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;
    }
    .mark-dark { mix-blend-mode: multiply; }
    .mark-light { mix-blend-mode: screen; }
    .note { margin-top: 12px; color: #64748b; font-size: 0.68rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page">
    <div class="head">
      <img src="logo.png" alt="" />
      <h1>쿠치 오버레이 목업</h1>
    </div>
    <p class="sub">사진 위 오버레이. 왼쪽 세로줄에 장소·날짜, 가운데 무게, 그 아래 아이템 개수.</p>
    <div class="stage">
      <article class="poster">
        <div class="sheet">
          <img class="photo" src="preview-camp.jpg" alt="샘플 캠핑 사진" />
          <div class="rail">
            <div class="rail-block">
              <span class="rail-lab">date</span>
              <span class="rail-val">2026.09.19</span>
            </div>
            <div class="rail-block spot">
              <span class="rail-lab">spot</span>
              <span class="rail-val">설악산</span>
            </div>
          </div>
          <div class="mast mast-dark">
            <div class="kg">7.82</div>
            <div class="items">8 items</div>
          </div>
          <div class="mast mast-light">
            <div class="kg">7.82</div>
            <div class="items">8 items</div>
          </div>
          <div class="mark-wrap">
            <img class="mark mark-dark" src="fulllogo.png" alt="" />
            <img class="mark mark-light" src="fulllogo.png" alt="낭만루트" />
          </div>
        </div>
      </article>
    </div>
    <p class="note">http://127.0.0.1:5500/kuchi-cover-mockup.html</p>
  </div>
</body>
</html>
