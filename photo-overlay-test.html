<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHOTO OVERLAY 테스트</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700;6..96,800&family=Libre+Baskerville:ital,wght@0,400;0,700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #07090e; color: #e2e8f0; font-family: 'Pretendard Variable', sans-serif; padding: 24px 16px 64px; }
    h1 { font-size: 1.05rem; }
    .sub { color: #94a3b8; font-size: 0.74rem; margin: 6px 0 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
    .cell { width: min(330px, 100%); }
    .cell h2 { font-size: 0.72rem; margin: 0 0 8px; color: #cbd5e1; }
    .legacy { opacity: 0.95; }
  </style>
</head>
<body>
  <h1>PHOTO OVERLAY · 실제 DB 장비 테스트</h1>
  <p class="sub">저널은 기존 그대로. 스프레드는 사진 위 + 종이 장비 목록, 로고는 하단 오른쪽입니다.</p>
  <div class="row" id="overlayRow"></div>
  <h1 style="margin-top:28px;">이슈 / 스프레드 / 에디토리얼 / 매거진</h1>
  <div class="row" id="newRow"></div>
  <h1 style="margin-top:28px;">기존 템플릿 대조 (미니멀 / 시크 / 인증샷)</h1>
  <div class="row legacy" id="legacyRow"></div>
  <script src="templates.js?v=2.8.2"></script>
  <script>
    var PHOTO = 'preview-camp.jpg';
    var REAL = [
      { name: '노스페이스 마운틴 25 텐트 (풋프린트 포함) (Mountain 25 Tent with Footprint)', weight: 3997, categoryId: 'shelter', brand: '노스페이스 (The North Face)' },
      { name: '씨투써밋 스파크 0F 다운 침낭 (Spark 0F Down Sleeping Bag)', weight: 1111, categoryId: 'sleep', brand: '씨투써밋 (Sea to Summit)' },
      { name: '니모 텐서 올시즌 초경량 단열 에어매트 (Tensor All-Season Ultralight Insulated Sleeping Pad)', weight: 399, categoryId: 'sleep', brand: '니모 (NEMO)' },
      { name: '오스프리 엑소스 48 배낭 남성용 (Exos 48 Pack - Men\'s)', weight: 1256, categoryId: 'pack', brand: '오스프리 (Osprey)' },
      { name: '소토 윈드마스터 스토브 SOD-310 (SOTO WindMaster SOD-310)', weight: 67, categoryId: 'kitchen', brand: '소토 (Soto)' },
      { name: '아크테릭스 베타 AR 고어텍스 프로 자켓 (Beta AR Jacket Men\'s)', weight: 455, categoryId: 'wear', brand: '아크테릭스 (Arc\'teryx)' },
      { name: '페츨 액틱 코어 헤드랜턴 (Actik Core Headlamp)', weight: 88, categoryId: 'electronics', brand: '페츨 (Petzl)' },
      { name: '지팩스 듀플렉스 클래식 텐트 (Zpacks Duplex Classic Tent)', weight: 525, categoryId: 'shelter', brand: '지팩스 (Zpacks)' },
      { name: '씨투써밋 스파크 30F 다운 침낭 (Spark 30F Down Sleeping Bag)', weight: 494, categoryId: 'sleep', brand: '씨투써밋 (Sea to Summit)' },
      { name: '오스프리 엑소스 48 배낭 남성용 (Exos 48 Pack - Men\'s)', weight: 1256, categoryId: 'pack', brand: '오스프리 (Osprey)' },
      { name: '소토 퓨전 트렉 호스 스토브 SOD-330 (SOTO Fusion Trek)', weight: 182, categoryId: 'kitchen', brand: '소토 (Soto)' },
      { name: '아크테릭스 베타 AR 고어텍스 프로 자켓 (Beta AR Jacket Men\'s)', weight: 455, categoryId: 'wear', brand: '아크테릭스 (Arc\'teryx)' },
      { name: '페츨 티카 코어 헤드랜턴 (Tikka Core Headlamp)', weight: 84, categoryId: 'electronics', brand: '페츨 (Petzl)' },
      { name: '노스페이스 VE 25 텐트 (풋프린트 포함) (VE 25 Tent with Footprint)', weight: 4309, categoryId: 'shelter', brand: '노스페이스 (The North Face)' },
      { name: '큐물러스 테네카 850 Sailor blue', weight: 1310, categoryId: 'sleep', brand: '큐물러스 (Cumulus)' },
      { name: '니모 텐서 올시즌 초경량 단열 에어매트 (Tensor All-Season Ultralight Insulated Sleeping Pad)', weight: 399, categoryId: 'sleep', brand: '니모 (NEMO)' },
      { name: 'The North Face Mountain 25 Tent', weight: 3997, categoryId: 'shelter', brand: 'The North Face' },
      { name: "Arc'teryx Beta AR Jacket Men's GORE-TEX", weight: 455, categoryId: 'wear', brand: "Arc'teryx" },
      { name: 'BOTE 인플레이터블 Aero 체어 XL (Inflatable Aero Chair XL)', weight: 3175, categoryId: 'camp', brand: 'BOTE (BOTE)' },
      { name: 'GSI 아웃도어 Micro 테이블+ (Micro Table+)', weight: 581, categoryId: 'camp', brand: 'GSI 아웃도어 (GSI Outdoors)' },
      { name: 'KOMPERDELL 릿지하이커 코르크 파워락 폴 140cm (KP0025)', weight: 270, categoryId: 'electronics', brand: 'KOMPERDELL' },
      { name: 'REI Co-op Trailmade 트레킹폴 (1쌍) (Trailmade Trekking Poles - Pair)', weight: 503, categoryId: 'electronics', brand: 'REI Co-op (REI Co-op)' }
    ];

    function kgOf(list) {
      return (list.reduce(function(s, it) { return s + it.weight; }, 0) / 1000).toFixed(2);
    }

    function brand() {
      return (window.SVG_ICONS && SVG_ICONS.brandLogo) ? SVG_ICONS.brandLogo('#ffffff', '#ffffff') : '';
    }

    function card(title, count) {
      var items = REAL.slice(0, count);
      var html = window.renderPhotoOverlayMarkup({
        photo: PHOTO,
        spot: '신안 그림산',
        date: '2026.09.19',
        weightKg: kgOf(items),
        itemCount: items.length,
        items: items,
        theme: 'dark',
        brand: brand(),
        wrapCss: 'width:100%; aspect-ratio:4/5; margin:auto;'
      });
      return '<div class="cell" data-count="' + count + '"><h2>' + title + ' · ' + count + '개 · ' + kgOf(items) + 'kg</h2>' + html + '</div>';
    }

    document.getElementById('overlayRow').innerHTML =
      card('저널 3개', 3) + card('저널 7개', 7) + card('저널 14개', 14) + card('저널 20개+', 22);

    function extra(title, count, fn) {
      var items = REAL.slice(0, count);
      var html = fn({
        photo: PHOTO,
        spot: '신안 그림산',
        date: '2026.09.19',
        weightKg: kgOf(items),
        itemCount: items.length,
        items: items,
        wrapCss: 'width:100%; aspect-ratio:3/4; margin:auto;'
      });
      return '<div class="cell"><h2>' + title + ' · ' + count + '개 · ' + kgOf(items) + 'kg</h2>' + html + '</div>';
    }
    function extraKuchi(title, count, filter) {
      var items = REAL.slice(0, count);
      var html = window.renderKuchiMarkup({
        photo: PHOTO,
        spot: '신안 그림산',
        date: '2026.09.19',
        weightKg: kgOf(items),
        itemCount: items.length,
        wrapCss: 'width:100%; aspect-ratio:3/4; margin:auto;'
      });
      if (filter) html = html.replace('class="kc-photo"', 'class="kc-photo" style="filter:' + filter + '"');
      return '<div class="cell"><h2>' + title + '</h2>' + html + '</div>';
    }
    function extraMag(title, count, filter) {
      var items = REAL.slice(0, count);
      var html = window.renderMagazineCoverMarkup({
        photo: PHOTO,
        weightKg: kgOf(items),
        itemCount: items.length,
        wrapCss: 'width:100%; aspect-ratio:3/4; margin:auto;'
      });
      if (filter) html = html.replace('class="mag-photo"', 'class="mag-photo" style="filter:' + filter + '"');
      return '<div class="cell"><h2>' + title + '</h2>' + html + '</div>';
    }
    document.getElementById('newRow').innerHTML =
      extra('발란스', 8, window.renderBalanceMarkup) +
      extra('쿠치', 8, window.renderKuchiMarkup) +
      extraKuchi('쿠치 밝은 사진', 8, 'brightness(1.55) contrast(1.05)') +
      extraKuchi('쿠치 어두운 사진', 8, 'brightness(0.42) contrast(1.1)') +
      extra('이슈', 8, window.renderIssueMarkup) +
      extra('스프레드', 8, window.renderSpreadMarkup) +
      extra('에디토리얼', 8, window.renderEditorialOverlayMarkup) +
      extraMag('매거진 원본', 14, '') +
      extraMag('매거진 밝은 사진', 14, 'brightness(1.55) contrast(1.05)') +
      extraMag('매거진 어두운 사진', 14, 'brightness(0.42) contrast(1.1)');

    var seven = REAL.slice(0, 7);
    var rec = { spot: '신안 그림산', date: '2026.09.19', weightKg: kgOf(seven), items: seven };
    document.getElementById('legacyRow').innerHTML =
      '<div class="cell"><h2>minimal</h2>' + window.generateReadyShotMarkup(rec, { photo: PHOTO, mode: 'minimal' }) + '</div>' +
      '<div class="cell"><h2>chic</h2>' + window.generateReadyShotMarkup(rec, { photo: PHOTO, mode: 'chic' }) + '</div>' +
      '<div class="cell"><h2>nrc</h2>' + window.generateReadyShotMarkup(rec, { photo: PHOTO, mode: 'nrc' }) + '</div>';
  </script>
</body>
</html>
